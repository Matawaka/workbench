name: Workbench v0.43 clickable app tree tabs qualification

on:
  push:
    branches:
      - feat/workbench-v0.43-app-tree-tabs

permissions:
  contents: read

jobs:
  qualify:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: false

      - name: Restore and build zero warnings
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet restore Matawaka.Workbench.sln
          if ($LASTEXITCODE -ne 0) { throw 'v0.43 restore failed' }
          dotnet build Matawaka.Workbench.sln -c Release --no-restore -warnaserror
          if ($LASTEXITCODE -ne 0) { throw 'v0.43 Release build failed' }

      - name: Verify accepted predecessor implementation bytes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $base = '2a68f43b7c8b3a5e8aae7d960f2d997ffa7ec525'
          $mustRemain = @(
            'src/Matawaka.Workbench.App/WorkbenchShellV042Service.cs',
            'src/Matawaka.Workbench.App/MainWindow.V042.cs',
            'src/Matawaka.Workbench.App/JsonOutputSearchV041Service.cs',
            'src/Matawaka.Workbench.App/JsonSearchPresentationV0412Service.cs',
            'src/Matawaka.Workbench.App/TransitionBootstrapV040Service.cs',
            'src/Matawaka.Workbench.App/CandidateLaunchHandoffV039Service.cs',
            'src/Matawaka.Workbench.App/BoundedUpdateApplyBuildService.cs',
            'src/Matawaka.Workbench.App/MaintenanceUpdateOrchestratorService.cs',
            'src/Matawaka.Workbench.App/LocalApplicationMaintenanceService.cs',
            'src/Matawaka.Workbench.App/LocalApplicationRegistrationService.cs',
            'src/Matawaka.Workbench.App/LocalApplicationPackageBuilderService.cs',
            'src/Matawaka.Workbench.Runtime',
            'src/Matawaka.Workbench.Protocol',
            'src/Matawaka.Workbench.AgentHost',
            'src/Matawaka.Workbench.Engine',
            'src/Matawaka.Workbench.Catalog',
            'src/Matawaka.Workbench.SemanticHost'
          )
          foreach ($path in $mustRemain) {
            git diff --quiet $base HEAD -- $path
            if ($LASTEXITCODE -ne 0) { throw "accepted predecessor implementation changed unexpectedly: $path" }
          }
          Write-Host 'V043_PREDECESSOR_BYTES_PASS'

      - name: Verify clickable Apps shell contract
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $xaml = Get-Content 'src/Matawaka.Workbench.App/MainWindow.xaml' -Raw
          $surface = [regex]::Match($xaml, '<WrapPanel x:Name="PrimaryMaintenanceSurface"[\s\S]*?</WrapPanel>').Value
          if ([regex]::Matches($surface, '<Button\b').Count -ne 5) { throw 'visible maintenance button count changed from five' }
          if ([regex]::Matches($surface, '<CheckBox\b').Count -ne 0) { throw 'persistent authority checkbox appeared' }
          foreach ($name in @('SelfTestButton','AcceptCheckpointButton','CancelButton')) {
            $needle = 'x:Name="' + $name + '"'
            if ($surface.Contains($needle, [StringComparison]::Ordinal)) { throw "legacy manual control became visible: $name" }
          }
          foreach ($marker in @('Click="InstalledAppV043Button_Click"','Tag="{Binding ApplicationId}"','Cursor="Hand"','HierarchicalDataTemplate DataType="{x:Type local:AppTreeNodeV043}"','ItemsSource="{Binding Children}"')) {
            if (-not $xaml.Contains($marker, [StringComparison]::Ordinal)) { throw "clickable/tree XAML marker missing: $marker" }
          }
          $tabsAt = $xaml.IndexOf('x:Name="OutputTabs"', [StringComparison]::Ordinal)
          $findAt = $xaml.IndexOf('x:Name="JsonSearchSurface"', [StringComparison]::Ordinal)
          $statusAt = $xaml.IndexOf('x:Name="StatusProgressSurface"', [StringComparison]::Ordinal)
          if ($tabsAt -lt 0 -or $findAt -le $tabsAt -or $statusAt -le $findAt) { throw 'v0.42 output/find/status vertical contract changed' }
          Write-Host 'V043_CLICKABLE_SHELL_STATIC_PASS buttons=5 clickable=True treeTemplate=True'

      - name: Verify v0.43 release and observation boundaries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $app = Get-Content 'src/Matawaka.Workbench.App/App.xaml.cs' -Raw
          $ui = Get-Content 'src/Matawaka.Workbench.App/MainWindow.V043.cs' -Raw
          $tree = Get-Content 'src/Matawaka.Workbench.App/WorkbenchAppTreeV043Service.cs' -Raw
          $checkpoint = Get-Content 'src/Matawaka.Workbench.App/LocalCheckpointV043Service.cs' -Raw
          $publisher = Get-Content 'src/Matawaka.Workbench.App/FixedGitHubPublicationV043Service.cs' -Raw
          $accept = Get-Content 'src/Matawaka.Workbench.App/WorkbenchV043AcceptanceHarness.cs' -Raw
          foreach ($marker in @('ConfigureV043Routing','ConfigureV042Routing','Window_LoadedV043','InstalledAppV043Button_Click','OpenOrRefreshAppTreeTabV043','AcceptFromBootstrapAsync')) {
            if (($app + $ui) -notmatch [regex]::Escape($marker)) { throw "v0.43 routing marker missing: $marker" }
          }
          foreach ($marker in @('MaxDepth = 64','MaxNodes = 20_000','InstalledAppsV042Service.Read','FileAttributes.ReparsePoint','FileInfo(file).Length','EnsureInsideRoot')) {
            if ($tree -notmatch [regex]::Escape($marker)) { throw "app tree boundary marker missing: $marker" }
          }
          if ($tree -match 'File\.ReadAll|File\.OpenRead|ReadToEnd|ReadAllBytes') { throw 'app tree service contains application file-content read primitive' }
          if ($checkpoint -match 'public Task<LocalCheckpointReceipt> AcceptAsync') { throw 'manual v0.43 AcceptAsync unexpectedly exists' }
          if ($checkpoint -notmatch 'Version = "0\.43\.0"' -or $checkpoint -notmatch 'ExpectedPredecessorCommit = "2a68f43b7c8b3a5e8aae7d960f2d997ffa7ec525"' -or $checkpoint -notmatch 'TargetTag = "workbench-v0\.43-accepted"') { throw 'v0.43 checkpoint identity mismatch' }
          if ($publisher -notmatch 'ExpectedParent = "2a68f43b7c8b3a5e8aae7d960f2d997ffa7ec525"' -or $publisher -notmatch 'AcceptedTag = "workbench-v0\.43-accepted"') { throw 'v0.43 publisher identity mismatch' }
          if ($accept -notmatch 'matawaka\.workbench-acceptance-receipt/v0\.43' -or $accept -notmatch '"0\.43\.0"') { throw 'v0.43 acceptance identity mismatch' }
          Write-Host 'V043_OBSERVATION_BOUNDARY_PASS metadataOnly=True bootstrapOnly=True'

      - name: Execute compiled tree and WPF tab probe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $probe = Join-Path $env:RUNNER_TEMP 'v043-app-tree-probe'
          if (Test-Path $probe) { Remove-Item $probe -Recurse -Force }
          New-Item -ItemType Directory -Path $probe | Out-Null
          $appProject = (Resolve-Path 'src/Matawaka.Workbench.App/Matawaka.Workbench.App.csproj').Path
          $escaped = [Security.SecurityElement]::Escape($appProject)
          @"
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net10.0-windows</TargetFramework>
              <UseWPF>true</UseWPF>
              <ImplicitUsings>enable</ImplicitUsings>
              <Nullable>enable</Nullable>
              <TreatWarningsAsErrors>true</TreatWarningsAsErrors>
            </PropertyGroup>
            <ItemGroup><ProjectReference Include="$escaped" /></ItemGroup>
          </Project>
          "@ | Set-Content (Join-Path $probe 'Probe.csproj') -Encoding UTF8
          @'
          using System;
          using System.IO;
          using System.Linq;
          using System.Reflection;
          using System.Text.Json;
          using System.Windows;
          using System.Windows.Controls;
          using Matawaka.Workbench.App;

          internal static class Program
          {
              [STAThread]
              private static void Main()
              {
                  var root = Path.Combine(Path.GetTempPath(), "matawaka-v043-tree-" + Guid.NewGuid().ToString("N"));
                  var apps = Path.Combine(root, "Apps");
                  CreateApp(apps, "alpha", "1.0", new[] { ("src/a.txt", "aaa"), ("src/sub/b.bin", "12345"), ("z.txt", "zz") });
                  CreateApp(apps, "beta", "2.0", new[] { ("main.txt", "beta") });

                  var obs = WorkbenchAppTreeV043Service.Read(root, "alpha");
                  if (obs.ApplicationId != "alpha" || obs.Version != "1.0") throw new Exception("tree identity mismatch");
                  if (obs.DirectoryCount != 2 || obs.FileCount != 4) throw new Exception($"tree counts mismatch dirs={obs.DirectoryCount} files={obs.FileCount}");
                  if (obs.Root.Children.Count != 3 || !obs.Root.Children[0].IsDirectory || obs.Root.Children[0].Name != "src") throw new Exception("tree ordering mismatch");
                  var refused = false;
                  try { _ = WorkbenchAppTreeV043Service.Read(root, "unknown"); } catch (InvalidDataException) { refused = true; }
                  if (!refused) throw new Exception("unregistered app was not refused");

                  var window = new MainWindow();
                  var workspaceBox = (TextBox?)window.FindName("WorkspaceRootBox") ?? throw new Exception("workspace compatibility binding missing");
                  workspaceBox.Text = root;
                  Invoke(window, "ConfigureV043Routing");
                  workspaceBox.Text = root;
                  Invoke(window, "RefreshInstalledAppsV043");

                  var items = (ItemsControl?)window.FindName("InstalledAppsList") ?? throw new Exception("installed Apps list missing");
                  var installed = items.ItemsSource.Cast<InstalledAppV042>().OrderBy(x => x.ApplicationId).ToArray();
                  if (installed.Length != 2) throw new Exception("installed app item binding mismatch");

                  var handler = typeof(MainWindow).GetMethod("InstalledAppV043Button_Click", BindingFlags.Instance | BindingFlags.NonPublic) ?? throw new Exception("click handler missing");
                  var tabs = (TabControl?)window.FindName("OutputTabs") ?? throw new Exception("output tabs missing");
                  Click(handler, window, installed[0]);
                  var alphaTabs = tabs.Items.OfType<TabItem>().Where(t => Equals(t.Header, "App · alpha")).ToArray();
                  if (alphaTabs.Length != 1 || alphaTabs[0].Content is not Grid g || !g.Children.OfType<TreeView>().Any()) throw new Exception("alpha tree tab missing");
                  var countAfterFirst = tabs.Items.Count;
                  Click(handler, window, installed[0]);
                  if (tabs.Items.Count != countAfterFirst || tabs.Items.OfType<TabItem>().Count(t => Equals(t.Header, "App · alpha")) != 1) throw new Exception("duplicate alpha tree tab created");
                  Click(handler, window, installed[1]);
                  if (tabs.Items.OfType<TabItem>().Count(t => Equals(t.Header, "App · beta")) != 1) throw new Exception("beta separate tree tab missing");
                  var status = (TextBlock?)window.FindName("StatusText") ?? throw new Exception("status missing");
                  if (!status.Text.StartsWith("COMPLETED: opened read-only tree", StringComparison.Ordinal)) throw new Exception("click status mismatch");

                  window.Close();
                  Directory.Delete(root, true);
                  Console.WriteLine("V043_APP_TREE_PASS apps=2 alphaTab=1 betaTab=1 duplicateTabs=False metadataOnly=True");
              }

              private static void CreateApp(string appsRoot, string id, string version, (string Path, string Content)[] files)
              {
                  var app = Path.Combine(appsRoot, id);
                  Directory.CreateDirectory(app);
                  File.WriteAllText(Path.Combine(app, ".matawaka-app.json"), JsonSerializer.Serialize(new LocalApplicationIdentity(LocalApplicationMaintenanceService.IdentitySchema, id, version)));
                  foreach (var item in files)
                  {
                      var full = Path.Combine(app, item.Path.Replace('/', Path.DirectorySeparatorChar));
                      Directory.CreateDirectory(Path.GetDirectoryName(full)!);
                      File.WriteAllText(full, item.Content);
                  }
              }

              private static void Invoke(MainWindow window, string name)
              {
                  var method = typeof(MainWindow).GetMethod(name, BindingFlags.Instance | BindingFlags.NonPublic | BindingFlags.Public) ?? throw new Exception($"method missing: {name}");
                  method.Invoke(window, null);
              }

              private static void Click(MethodInfo handler, MainWindow window, InstalledAppV042 app)
              {
                  var button = new Button { DataContext = app, Tag = app.ApplicationId };
                  handler.Invoke(window, new object[] { button, new RoutedEventArgs(Button.ClickEvent, button) });
              }
          }
          '@ | Set-Content (Join-Path $probe 'Program.cs') -Encoding UTF8
          dotnet run --project (Join-Path $probe 'Probe.csproj') -c Release
          if ($LASTEXITCODE -ne 0) { throw 'v0.43 compiled tree/tab probe failed' }

      - name: Verify remote predecessor and bounded diff
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $remote = 'https://github.com/Matawaka/workbench.git'
          $mainLine = @(git ls-remote $remote refs/heads/main)
          if ($LASTEXITCODE -ne 0 -or $mainLine.Count -ne 1) { throw 'unable to read remote main' }
          $main = ($mainLine[0] -split '\s+')[0].ToLowerInvariant()
          if ($main -ne '2a68f43b7c8b3a5e8aae7d960f2d997ffa7ec525') { throw "remote main moved from accepted v0.42: $main" }
          $tagLines = @(git ls-remote $remote refs/tags/workbench-v0.42-accepted refs/tags/workbench-v0.42-accepted^'{}')
          $peeled = @($tagLines | Where-Object { $_ -match 'refs/tags/workbench-v0\.42-accepted\^\{\}$' })
          if ($peeled.Count -ne 1 -or (($peeled[0] -split '\s+')[0].ToLowerInvariant()) -ne $main) { throw 'v0.42 accepted tag mismatch' }
          if (@(git ls-remote $remote refs/tags/workbench-v0.43-accepted refs/tags/workbench-v0.43-accepted^'{}').Count -ne 0) { throw 'v0.43 tag already exists remotely' }

          $base = '2a68f43b7c8b3a5e8aae7d960f2d997ffa7ec525'
          $allowed = @(
            '.github/workflows/workbench-v0.43-candidate.yml',
            'PATCH-v0.43.md',
            'src/Matawaka.Workbench.App/App.xaml.cs',
            'src/Matawaka.Workbench.App/FixedGitHubPublicationV043Service.cs',
            'src/Matawaka.Workbench.App/LocalCheckpointV043Service.cs',
            'src/Matawaka.Workbench.App/MainWindow.V043.cs',
            'src/Matawaka.Workbench.App/MainWindow.xaml',
            'src/Matawaka.Workbench.App/WorkbenchAppTreeV043Service.cs',
            'src/Matawaka.Workbench.App/WorkbenchV043AcceptanceHarness.cs'
          ) | Sort-Object
          $actual = @(git diff --name-only $base HEAD) | Sort-Object
          if (($actual -join "`n") -ne ($allowed -join "`n")) { throw "unexpected v0.43 diff:`n$($actual -join "`n")" }
          if (git status --porcelain=v1 --untracked-files=all) { throw 'source checkout is not clean' }
          Write-Host 'V043_REMOTE_DIFF_PASS predecessorExact=True productDiffBounded=True'

      - name: Build and independently audit v0.43 source-only package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $files = @(
            'PATCH-v0.43.md',
            'src/Matawaka.Workbench.App/App.xaml.cs',
            'src/Matawaka.Workbench.App/FixedGitHubPublicationV043Service.cs',
            'src/Matawaka.Workbench.App/LocalCheckpointV043Service.cs',
            'src/Matawaka.Workbench.App/MainWindow.V043.cs',
            'src/Matawaka.Workbench.App/MainWindow.xaml',
            'src/Matawaka.Workbench.App/WorkbenchAppTreeV043Service.cs',
            'src/Matawaka.Workbench.App/WorkbenchV043AcceptanceHarness.cs'
          )
          $root = Join-Path $env:RUNNER_TEMP 'workbench-v0.43-package'
          $payload = Join-Path $root 'payload'
          if (Test-Path $root) { Remove-Item $root -Recurse -Force }
          New-Item -ItemType Directory -Path $payload -Force | Out-Null
          $manifestFiles = @()
          foreach ($file in $files) {
            $dest = Join-Path $payload ($file -replace '/', [IO.Path]::DirectorySeparatorChar)
            New-Item -ItemType Directory -Path ([IO.Path]::GetDirectoryName($dest)) -Force | Out-Null
            Copy-Item -LiteralPath $file -Destination $dest -Force
            $manifestFiles += [ordered]@{ Path=$file; Sha256=(Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant() }
          }
          $manifest = [ordered]@{
            Schema='matawaka.workbench-update-package/v0.10'; PackageVersion='0.10'; TargetVersion='0.43.0';
            PredecessorTag='workbench-v0.42-accepted'; PredecessorCommit='2a68f43b7c8b3a5e8aae7d960f2d997ffa7ec525';
            TargetTag='workbench-v0.43-accepted'; PayloadRoot='payload/'; Files=$manifestFiles;
            NetworkAccessRequested=$false; CatalogMutationRequested=$false; AgentExecuteRequested=$false;
            ArbitraryProcessExecutionRequested=$false; InstallerScriptExecutionRequested=$false;
            NonEffects=@('app tree is read-only metadata observation','no file-content reads from tree service','no app authority','five-button v0.42 shell preserved','Publish and Lifecycle remain separate')
          }
          [IO.File]::WriteAllText((Join-Path $root 'workbench-update-manifest.json'), ($manifest | ConvertTo-Json -Depth 8), [Text.UTF8Encoding]::new($false))
          $zip = Join-Path $env:RUNNER_TEMP 'workbench-v0.43-source-only.zip'
          if (Test-Path $zip) { Remove-Item $zip -Force }
          [IO.Compression.ZipFile]::CreateFromDirectory($root, $zip, [IO.Compression.CompressionLevel]::Optimal, $false)

          $audit = Join-Path $env:RUNNER_TEMP 'workbench-v0.43-audit'
          if (Test-Path $audit) { Remove-Item $audit -Recurse -Force }
          [IO.Compression.ZipFile]::ExtractToDirectory($zip, $audit)
          $m = Get-Content (Join-Path $audit 'workbench-update-manifest.json') -Raw | ConvertFrom-Json
          if ($m.TargetVersion -ne '0.43.0' -or $m.PredecessorCommit -ne '2a68f43b7c8b3a5e8aae7d960f2d997ffa7ec525' -or $m.PredecessorTag -ne 'workbench-v0.42-accepted' -or $m.TargetTag -ne 'workbench-v0.43-accepted') { throw 'package identity audit failed' }
          if ($m.NetworkAccessRequested -or $m.CatalogMutationRequested -or $m.AgentExecuteRequested -or $m.ArbitraryProcessExecutionRequested -or $m.InstallerScriptExecutionRequested) { throw 'package requested forbidden capability' }
          if ((@($m.Files.Path | Sort-Object) -join "`n") -ne (($files | Sort-Object) -join "`n")) { throw 'package file set mismatch' }
          foreach ($item in $m.Files) {
            $full = Join-Path (Join-Path $audit 'payload') ($item.Path -replace '/', [IO.Path]::DirectorySeparatorChar)
            if (-not (Test-Path -LiteralPath $full -PathType Leaf)) { throw "missing payload: $($item.Path)" }
            if ((Get-FileHash $full -Algorithm SHA256).Hash.ToLowerInvariant() -ne $item.Sha256.ToLowerInvariant()) { throw "hash mismatch: $($item.Path)" }
          }
          $actualPayload = @(Get-ChildItem (Join-Path $audit 'payload') -File -Recurse | ForEach-Object { [IO.Path]::GetRelativePath((Join-Path $audit 'payload'), $_.FullName).Replace('\','/') } | Sort-Object)
          if (($actualPayload -join "`n") -ne (($files | Sort-Object) -join "`n")) { throw 'extra/missing payload entries' }
          $sha = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText((Join-Path $env:RUNNER_TEMP 'workbench-v0.43-source-only.sha256.txt'), "$sha  workbench-v0.43-source-only.zip`n", [Text.UTF8Encoding]::new($false))
          Write-Host "V043_SOURCE_PACKAGE_AUDIT_PASS sha256=$sha payloadFiles=$($files.Count) forbiddenFlags=False"

      - name: Upload v0.43 source-only package
        uses: actions/upload-artifact@v4
        with:
          name: workbench-v0.43-source-only
          path: |
            ${{ runner.temp }}/workbench-v0.43-source-only.zip
            ${{ runner.temp }}/workbench-v0.43-source-only.sha256.txt
          retention-days: 30
