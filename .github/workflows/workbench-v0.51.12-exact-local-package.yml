name: Workbench v0.51.12 exact local package

on:
  push:
    branches: [feat/workbench-v0.51.12-listener-readiness-transaction]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build exact source candidate
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          dotnet restore Matawaka.Workbench.sln
          if($LASTEXITCODE -ne 0){throw 'v0.51.12 restore failed'}
          dotnet build Matawaka.Workbench.sln -c Release --no-restore -warnaserror
          if($LASTEXITCODE -ne 0){throw 'v0.51.12 build failed'}

          $route=Get-Content 'src/Matawaka.Workbench.App/MainWindow.V05112.cs' -Raw
          foreach($m in @('CreateOwnedReadLeaseAndAutoStartMcpV05112Async','PREPARED_LISTENER_START','RecordListenerStartedAsync','CommitReadyAsync','OWNER_LEASE_BOUND_LISTENER_READY_INDEXED_READ_LEASE_AND_LOCAL_MCP_READY','local-app.v05112.dispatch exclusive=true')){
            if(-not $route.Contains($m,[StringComparison]::Ordinal)){throw "v0.51.12 route marker missing: $m"}
          }
          $svc=Get-Content 'src/Matawaka.Workbench.App/LocalAppMcpListenerReadinessV05112Service.cs' -Raw
          foreach($m in @('LIVE_BOUND_NO_LISTENER','PREPARED_LISTENER_START is not evidence that a listener exists','ListenerStartedOrResumed','CanonicalHistoricalScanPerformed','EndpointSecretDisclosed')){
            if(-not $svc.Contains($m,[StringComparison]::Ordinal)){throw "v0.51.12 service marker missing: $m"}
          }
          $cp=Get-Content 'src/Matawaka.Workbench.App/LocalCheckpointV05112Service.cs' -Raw
          foreach($m in @('ab97fea019644f89ce1c846ab5013b1b99245465','workbench-v0.51.11.1-accepted','workbench-v0.51.12-accepted')){
            if(-not $cp.Contains($m,[StringComparison]::Ordinal)){throw "v0.51.12 checkpoint marker missing: $m"}
          }
          Write-Host 'V05112_EXACT_PACKAGE_BUILD_PASS'

      - name: Verify publication remains deferred
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $remote=(git ls-remote origin refs/heads/main).Split("`t")[0].Trim().ToLowerInvariant()
          if($remote -ne '632ddbb73e8d70b485f02d21f772674d429adf8c'){throw "remote main moved unexpectedly: $remote"}
          Write-Host "V05112_REMOTE_BOUNDARY_PASS main=$remote publicationDeferred=True"

      - name: Package exact local predecessor update
        id: pack
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $predecessor='ab97fea019644f89ce1c846ab5013b1b99245465'
          $stage=Join-Path $env:RUNNER_TEMP 'v05112-exact-update'
          if(Test-Path $stage){Remove-Item $stage -Recurse -Force}
          $payload=Join-Path $stage 'payload'
          New-Item -ItemType Directory -Path $payload|Out-Null

          $files=@(
            'KONTUR_INTEGRATION_BACKLOG.md',
            'PATCH-v0.51.12.md',
            'integrations/kontur/CAPABILITY_HANDOFF.schema.json',
            'integrations/kontur/FUTURE_WORK_START_HERE.md',
            'integrations/kontur/KONTUR_ANCHOR.json',
            'integrations/kontur/LM1_ARTIFACT_INTAKE.template.json',
            'integrations/kontur/README.md',
            'src/Matawaka.Workbench.App/App.xaml.cs',
            'src/Matawaka.Workbench.App/LocalAppMcpListenerReadinessV05112Service.cs',
            'src/Matawaka.Workbench.App/LocalAppMcpSessionOwnershipV0517Service.cs',
            'src/Matawaka.Workbench.App/LocalCheckpointV05112Service.cs',
            'src/Matawaka.Workbench.App/MainWindow.V05112.Acceptance.cs',
            'src/Matawaka.Workbench.App/MainWindow.V05112.cs',
            'src/Matawaka.Workbench.App/WorkbenchV05112AcceptanceHarness.cs'
          )
          $items=@()
          foreach($file in $files){
            $src=Join-Path (Get-Location) ($file -replace '/', [IO.Path]::DirectorySeparatorChar)
            if(-not (Test-Path $src -PathType Leaf)){throw "missing v0.51.12 payload file: $file"}
            $dst=Join-Path $payload ($file -replace '/', [IO.Path]::DirectorySeparatorChar)
            New-Item -ItemType Directory -Path ([IO.Path]::GetDirectoryName($dst)) -Force|Out-Null
            Copy-Item $src $dst -Force
            $items += [ordered]@{Path=$file;Sha256=(Get-FileHash $src -Algorithm SHA256).Hash.ToLowerInvariant()}
          }

          $manifest=[ordered]@{
            Schema='matawaka.workbench-update-package/v0.10'
            PackageVersion='0.10'
            TargetVersion='0.51.12'
            PredecessorTag='workbench-v0.51.11.1-accepted'
            PredecessorCommit=$predecessor
            TargetTag='workbench-v0.51.12-accepted'
            PayloadRoot='payload/'
            Files=$items
            NetworkAccessRequested=$false
            CatalogMutationRequested=$false
            AgentExecuteRequested=$false
            ArbitraryProcessExecutionRequested=$false
            InstallerScriptExecutionRequested=$false
            NonEffects=@(
              'source-only Workbench listener-readiness and KONTUR planning-anchor update',
              'exact local v0.51.11.1 predecessor only',
              'canonical v0.48 lease authority remains source of truth',
              'v0.51.11 owner-to-lease and v0.51.11.1 exclusive routing remain preserved',
              'listener readiness transaction grants no lease/read/revoke/resume authority',
              'listener recovery performs no automatic start/resume/revoke/renew',
              'no bearer plaintext/hash or endpoint path token in listener transaction',
              'KONTUR integration files are planning/contracts only and grant no download/runtime/model/game authority',
              'no private app bytes or runtime lease/index/fence/MCP state',
              'no automatic Secure MCP Tunnel',
              'no OpenAI bridge dependency',
              'no remote publication authority',
              'no CI workflow or qualification fixture files in payload'
            )
          }
          $manifest|ConvertTo-Json -Depth 8|Set-Content (Join-Path $stage 'workbench-update-manifest.json') -Encoding UTF8

          $zip=Join-Path $env:RUNNER_TEMP 'workbench-v0.51.12-listener-readiness-update.zip'
          if(Test-Path $zip){Remove-Item $zip -Force}
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip -CompressionLevel Optimal
          $sha=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "zip=$zip" >> $env:GITHUB_OUTPUT
          "sha=$sha" >> $env:GITHUB_OUTPUT
          Write-Host "V05112_PACKAGE_PASS predecessor=$predecessor files=$($files.Count) sha256=$sha"

      - uses: actions/upload-artifact@v4
        with:
          name: workbench-v0.51.12-exact-local-update
          path: ${{ steps.pack.outputs.zip }}
          if-no-files-found: error
