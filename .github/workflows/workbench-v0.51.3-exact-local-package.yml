name: Workbench v0.51.3 exact local predecessor package

on:
  push:
    branches: [feat/workbench-v0.51.3-read-session-status]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build exact source candidate
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          dotnet restore Matawaka.Workbench.sln
          if($LASTEXITCODE -ne 0){throw 'v0.51.3 restore failed'}
          dotnet build Matawaka.Workbench.sln -c Release --no-restore -warnaserror
          if($LASTEXITCODE -ne 0){throw 'v0.51.3 Release build failed'}

          $app=Get-Content 'src/Matawaka.Workbench.App/App.xaml.cs' -Raw
          foreach($m in @('ConfigureV0513Routing()','ConfigureV0513AcceptanceRouting()')){
            if(-not $app.Contains($m,[StringComparison]::Ordinal)){throw "v0.51.3 startup marker missing: $m"}
          }
          $cp=Get-Content 'src/Matawaka.Workbench.App/LocalCheckpointV0513Service.cs' -Raw
          foreach($m in @('workbench-v0.51.2-accepted','workbench-v0.51.3-accepted','v0.51.3-source-manifest*.json','PredecessorGitSha')){
            if(-not $cp.Contains($m,[StringComparison]::Ordinal)){throw "checkpoint marker missing: $m"}
          }
          $status=Get-Content 'src/Matawaka.Workbench.App/LocalAppReadSessionStatusV0513Service.cs' -Raw
          foreach($m in @('BearerPlaintextDisclosed','BearerHashDisclosed','OrphanClosureEligible','BoundToActiveLocalMcp')){
            if(-not $status.Contains($m,[StringComparison]::Ordinal)){throw "status marker missing: $m"}
          }
          $main=Get-Content 'src/Matawaka.Workbench.App/MainWindow.V0513.cs' -Raw
          if($main.Contains('RevokeAllActiveAsync',[StringComparison]::Ordinal)){throw 'v0.51.3 exact orphan closure must not use revoke-all'}
          Write-Host 'V0513_EXACT_PACKAGE_BUILD_PASS'

      - name: Verify public publication remains deferred
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $remote=(git ls-remote origin refs/heads/main).Split("`t")[0].Trim().ToLowerInvariant()
          if($remote -ne '632ddbb73e8d70b485f02d21f772674d429adf8c'){throw "remote main moved unexpectedly: $remote"}
          Write-Host "V0513_REMOTE_BOUNDARY_PASS main=$remote publicationDeferred=True"

      - name: Package exact local predecessor update
        id: pack
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $predecessor='0ddb3a139daf65f9835603673661d06993fab006'
          $stage=Join-Path $env:RUNNER_TEMP 'v0513-exact-update'
          if(Test-Path $stage){Remove-Item $stage -Recurse -Force}
          $payload=Join-Path $stage 'payload'
          New-Item -ItemType Directory -Path $payload|Out-Null

          $files=@(
            'PATCH-v0.51.3.md',
            'src/Matawaka.Workbench.App/App.xaml.cs',
            'src/Matawaka.Workbench.App/LocalAppOrphanLeaseChooserV0513.cs',
            'src/Matawaka.Workbench.App/LocalAppReadSessionStatusV0513Service.cs',
            'src/Matawaka.Workbench.App/LocalAppsActionDialogV050.cs',
            'src/Matawaka.Workbench.App/LocalAppsActionDialogV0513.cs',
            'src/Matawaka.Workbench.App/LocalCheckpointV0513Service.cs',
            'src/Matawaka.Workbench.App/MainWindow.V0513.Acceptance.cs',
            'src/Matawaka.Workbench.App/MainWindow.V0513.cs',
            'src/Matawaka.Workbench.App/WorkbenchV0513AcceptanceHarness.cs'
          )

          $items=@()
          foreach($file in $files){
            $src=Join-Path (Get-Location) ($file -replace '/', [IO.Path]::DirectorySeparatorChar)
            if(-not (Test-Path $src -PathType Leaf)){throw "missing v0.51.3 payload file: $file"}
            $dst=Join-Path $payload ($file -replace '/', [IO.Path]::DirectorySeparatorChar)
            New-Item -ItemType Directory -Path ([IO.Path]::GetDirectoryName($dst)) -Force|Out-Null
            Copy-Item $src $dst -Force
            $items += [ordered]@{Path=$file;Sha256=(Get-FileHash $src -Algorithm SHA256).Hash.ToLowerInvariant()}
          }

          $manifest=[ordered]@{
            Schema='matawaka.workbench-update-package/v0.10'
            PackageVersion='0.10'
            TargetVersion='0.51.3'
            PredecessorTag='workbench-v0.51.2-accepted'
            PredecessorCommit=$predecessor
            TargetTag='workbench-v0.51.3-accepted'
            PayloadRoot='payload/'
            Files=$items
            NetworkAccessRequested=$false
            CatalogMutationRequested=$false
            AgentExecuteRequested=$false
            ArbitraryProcessExecutionRequested=$false
            InstallerScriptExecutionRequested=$false
            NonEffects=@(
              'source only',
              'exact local v0.51.2 predecessor only',
              'no private app bytes',
              'no bearer plaintext/hash or application content in status payload',
              'no lease/bearer/clipboard/endpoint runtime bytes',
              'no automatic orphan revocation on startup',
              'no automatic Secure MCP Tunnel',
              'no OpenAI bridge dependency',
              'no remote publication authority'
            )
          }
          $manifest|ConvertTo-Json -Depth 8|Set-Content (Join-Path $stage 'workbench-update-manifest.json') -Encoding UTF8

          $zip=Join-Path $env:RUNNER_TEMP 'workbench-v0.51.3-read-session-status-update.zip'
          if(Test-Path $zip){Remove-Item $zip -Force}
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip -CompressionLevel Optimal
          $sha=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "zip=$zip" >> $env:GITHUB_OUTPUT
          "sha=$sha" >> $env:GITHUB_OUTPUT
          Write-Host "V0513_PACKAGE_PASS predecessor=$predecessor files=$($files.Count) sha256=$sha"

      - uses: actions/upload-artifact@v4
        with:
          name: workbench-v0.51.3-exact-local-update
          path: ${{ steps.pack.outputs.zip }}
          if-no-files-found: error
