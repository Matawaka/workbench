name: Workbench v0.50 Secure MCP Tunnel candidate

on:
  push:
    branches: [feat/workbench-v0.50-secure-mcp-tunnel-handoff]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build and static authority checks
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          dotnet restore Matawaka.Workbench.sln
          dotnet build Matawaka.Workbench.sln -c Release --no-restore -warnaserror
          if($LASTEXITCODE -ne 0){throw 'Release build failed'}
          $app=Get-Content 'src/Matawaka.Workbench.App/App.xaml.cs' -Raw
          if(-not $app.Contains('ConfigureV050Routing()', [StringComparison]::Ordinal)){throw 'v0.50 routing missing'}
          $svc=Get-Content 'src/Matawaka.Workbench.App/OpenAiSecureMcpTunnelV050Service.cs' -Raw
          foreach($m in @('Tools/OpenAI/tunnel-client/tunnel-client-runtime.exe','ExpectedTunnelClientVersion = "0.0.14"','CONTROL_PLANE_API_KEY','CONTROL_PLANE_TUNNEL_ID','MCP_SERVER_URL','--control-plane.api-key','--health.listen-addr','127.0.0.1:0','/readyz','Kill(entireProcessTree: true)')){if(-not $svc.Contains($m,[StringComparison]::Ordinal)){throw "missing v0.50 marker: $m"}}
          foreach($m in @('ArgumentList.Add("admin")','ArgumentList.Add("init")','ArgumentList.Add("runtimes")','UseShellExecute = true','IPAddress.Any')){if($svc.Contains($m,[StringComparison]::Ordinal)){throw "forbidden authority invocation: $m"}}
          $main=Get-Content 'src/Matawaka.Workbench.App/MainWindow.V050.cs' -Raw
          foreach($m in @('EndpointClipboardWritePerformed = false','RuntimeApiKeyPersisted = false','LocalMcpEndpointPersisted = false','ChatGptConnectionConfigured = false')){if(-not $main.Contains($m,[StringComparison]::Ordinal)){throw "secret boundary missing: $m"}}
          $adapter=Get-Content 'src/Matawaka.Workbench.App/LocalAppMcpReadAdapterV049Service.cs' -Raw
          foreach($m in @('read_local_app_chunk','["readOnlyHint"] = true','TcpListener(IPAddress.Loopback, 0)','REFUSED_BY_ACTIVE_READ_LEASE')){if(-not $adapter.Contains($m,[StringComparison]::Ordinal)){throw "predecessor MCP boundary missing: $m"}}
          Write-Host 'V050_STATIC_PASS build=True leaseGated=True fourButtonPreserved=True keyPersistence=False admin=False'

      - name: Prove exact source overlay builds offline
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $candidate=(Get-Location).Path
          $overlay=Join-Path $env:RUNNER_TEMP 'overlay-v050'
          if(Test-Path $overlay){Remove-Item $overlay -Recurse -Force}
          git worktree add --detach $overlay 1e0453ccf047bd948e76b577c2395a7d0009ff7a
          if($LASTEXITCODE -ne 0){throw 'accepted v0.49.1 predecessor unavailable'}
          $files=@(
            'PATCH-v0.50.md',
            'src/Matawaka.Workbench.App/App.xaml.cs',
            'src/Matawaka.Workbench.App/OpenAiSecureMcpTunnelV050Service.cs',
            'src/Matawaka.Workbench.App/OpenAiSecureMcpTunnelDialogV050.cs',
            'src/Matawaka.Workbench.App/LocalAppsActionDialogV050.cs',
            'src/Matawaka.Workbench.App/MainWindow.V050.cs',
            'src/Matawaka.Workbench.App/WorkbenchV050AcceptanceHarness.cs',
            'src/Matawaka.Workbench.App/LocalCheckpointV050Service.cs',
            'src/Matawaka.Workbench.App/FixedGitHubPublicationV050Service.cs'
          )
          try {
            Push-Location $overlay
            dotnet restore Matawaka.Workbench.sln
            if($LASTEXITCODE -ne 0){throw 'predecessor restore failed'}
            Pop-Location
            foreach($file in $files){
              $src=Join-Path $candidate ($file-replace'/',[IO.Path]::DirectorySeparatorChar)
              $dst=Join-Path $overlay ($file-replace'/',[IO.Path]::DirectorySeparatorChar)
              New-Item -ItemType Directory -Path ([IO.Path]::GetDirectoryName($dst)) -Force|Out-Null
              Copy-Item $src $dst -Force
            }
            Push-Location $overlay
            dotnet build Matawaka.Workbench.sln -c Release --no-restore -warnaserror
            if($LASTEXITCODE -ne 0){throw 'v0.50 overlay --no-restore build failed'}
            Pop-Location
            Write-Host "V050_NO_RESTORE_PASS predecessor=v0.49.1 payloadFiles=$($files.Count)"
          } finally {
            if((Get-Location).Path -eq $overlay){Pop-Location}
            git worktree remove --force $overlay 2>$null
          }

      - name: Bounded tunnel runtime fixture integration
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $f=Join-Path $env:RUNNER_TEMP 'v050-fixture';$fo=Join-Path $f 'out'
          New-Item -ItemType Directory -Path $f -Force|Out-Null
          @'
          <Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><OutputType>Exe</OutputType><TargetFramework>net10.0</TargetFramework><ImplicitUsings>enable</ImplicitUsings><Nullable>enable</Nullable><AssemblyName>tunnel-client-runtime</AssemblyName><UseAppHost>true</UseAppHost></PropertyGroup></Project>
          '@ | Set-Content (Join-Path $f 'Fixture.csproj') -Encoding UTF8
          @'
          using System;
          using System.IO;
          using System.Linq;
          using System.Net;
          using System.Net.Sockets;
          using System.Text;
          if(args.Length==1&&args[0]=="--version"){Console.WriteLine("0.0.14 flavor=runtime");return;}
          if(args.Length==0||args[0]!="run"){Environment.ExitCode=2;return;}
          var key=Environment.GetEnvironmentVariable("CONTROL_PLANE_API_KEY");var tunnel=Environment.GetEnvironmentVariable("CONTROL_PLANE_TUNNEL_ID");var mcp=Environment.GetEnvironmentVariable("MCP_SERVER_URL");
          if(string.IsNullOrWhiteSpace(key)||string.IsNullOrWhiteSpace(tunnel)||string.IsNullOrWhiteSpace(mcp)){Environment.ExitCode=3;return;}
          var h=Array.IndexOf(args,"--health.url-file");if(h<0||h+1>=args.Length){Environment.ExitCode=4;return;}
          if(args.Any(x=>x.Contains(key,StringComparison.Ordinal)||x.Contains(mcp,StringComparison.Ordinal))){Environment.ExitCode=5;return;}
          File.WriteAllText(Path.Combine(AppContext.BaseDirectory,"fake-observed.txt"),"keySeen=true;mcpSeen=true;tunnelSeen=true",new UTF8Encoding(false));
          var l=new TcpListener(IPAddress.Loopback,0);l.Start();var ep=(IPEndPoint)l.LocalEndpoint;File.WriteAllText(args[h+1],$"http://127.0.0.1:{ep.Port}",new UTF8Encoding(false));
          while(true){using var c=await l.AcceptTcpClientAsync();using var s=c.GetStream();var b=new byte[4096];var n=await s.ReadAsync(b);if(n<=0)continue;var t=Encoding.ASCII.GetString(b,0,n);var ok=t.StartsWith("GET /readyz ",StringComparison.Ordinal);var body=ok?"ready":"no";var status=ok?"200 OK":"404 Not Found";await s.WriteAsync(Encoding.ASCII.GetBytes($"HTTP/1.1 {status}\r\nContent-Length: {body.Length}\r\nConnection: close\r\n\r\n{body}"));}
          '@ | Set-Content (Join-Path $f 'Program.cs') -Encoding UTF8
          dotnet publish (Join-Path $f 'Fixture.csproj') -c Release -o $fo
          if($LASTEXITCODE -ne 0){throw 'fixture build failed'}

          $p=Join-Path $env:RUNNER_TEMP 'v050-probe';New-Item -ItemType Directory -Path $p -Force|Out-Null
          $appProject=(Resolve-Path 'src/Matawaka.Workbench.App/Matawaka.Workbench.App.csproj').Path;$escaped=[Security.SecurityElement]::Escape($appProject)
          @"
          <Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><OutputType>Exe</OutputType><TargetFramework>net10.0-windows</TargetFramework><UseWPF>true</UseWPF><Nullable>enable</Nullable></PropertyGroup><ItemGroup><ProjectReference Include="$escaped" /></ItemGroup></Project>
          "@ | Set-Content (Join-Path $p 'Probe.csproj') -Encoding UTF8
          @'
          using System;
          using System.IO;
          using System.Threading.Tasks;
          using System.Text.Json;
          using Matawaka.Workbench.App;
          var w=Path.Combine(Path.GetTempPath(),"matawaka-v050-"+Guid.NewGuid().ToString("N"));
          var tools=Path.Combine(w,"Tools","OpenAI","tunnel-client");Directory.CreateDirectory(tools);
          foreach(var f in Directory.GetFiles(Environment.GetEnvironmentVariable("V050_FIXTURE_OUT")!)){File.Copy(f,Path.Combine(tools,Path.GetFileName(f)),true);}
          var svc=new OpenAiSecureMcpTunnelV050Service();var obs=await svc.ObserveTunnelClientAsync(w,default);if(!obs.VersionMatched)throw new Exception("version failed");
          var tunnel="tunnel_0123456789abcdef0123456789abcdef";var key="sk-test-v050-never-persist-0123456789";var token=new string('a',64);var local=$"http://127.0.0.1:31337/mcp/{token}";
          var preview=await svc.PreviewAsync(w,"alpha","lease-alpha",DateTimeOffset.Now.AddMinutes(3),tunnel,key,true,default);var pj=JsonSerializer.Serialize(preview);if(pj.Contains(key)||pj.Contains(token)||preview.ContainsRuntimeApiKey||preview.ContainsLocalMcpEndpoint)throw new Exception("preview secret leak");
          var grant=await svc.StartAsync(w,preview,key,local,default);if(!grant.Ready||!svc.IsActiveFor("alpha"))throw new Exception("ready failed");
          var receipt=await svc.WriteStartReceiptAsync(w,grant,default);var rj=File.ReadAllText(receipt.ReceiptPath);if(rj.Contains(key)||rj.Contains(token)||receipt.Receipt.RuntimeApiKeyPlaintextPersisted||receipt.Receipt.LocalMcpEndpointPlaintextPersisted)throw new Exception("receipt secret leak");
          if(File.ReadAllText(Path.Combine(tools,"fake-observed.txt"))!="keySeen=true;mcpSeen=true;tunnelSeen=true")throw new Exception("env binding failed");
          var stop=await svc.StopAsync(w,default);if(!stop.Receipt.ProcessStopped||svc.IsActiveFor("alpha")||stop.Receipt.ReadLeaseRevokedByTunnelStop||stop.Receipt.McpAdapterStoppedByTunnelStop)throw new Exception("stop boundary failed");
          var shortPreview=await svc.PreviewAsync(w,"alpha","lease-expiry",DateTimeOffset.Now.AddSeconds(2),tunnel,key,true,default);await svc.StartAsync(w,shortPreview,key,local,default);await Task.Delay(3000);if(svc.IsActiveFor("alpha"))throw new Exception("expiry stop failed");
          Directory.Delete(w,true);Console.WriteLine("V050_FIXTURE_PASS ready=True envOnly=True secretFree=True stop=True expiry=True");
          '@ | Set-Content (Join-Path $p 'Program.cs') -Encoding UTF8
          $env:V050_FIXTURE_OUT=$fo
          dotnet run --project (Join-Path $p 'Probe.csproj') -c Release
          if($LASTEXITCODE -ne 0){throw 'fixture integration failed'}

      - name: Remote prepublication boundary
        shell: pwsh
        run: |
          $remote='https://github.com/Matawaka/workbench.git'
          $main=((git ls-remote $remote refs/heads/main)-split '\s+')[0].ToLowerInvariant()
          if($main -ne '1e0453ccf047bd948e76b577c2395a7d0009ff7a'){throw "remote main moved: $main"}
          if(@(git ls-remote $remote refs/tags/workbench-v0.50-accepted).Count -ne 0){throw 'target tag exists'}
          Write-Host 'V050_REMOTE_PASS main=v0.49.1 targetAbsent=True'

      - name: Package source-only candidate
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop';Add-Type -AssemblyName System.IO.Compression.FileSystem
          $files=@('PATCH-v0.50.md','src/Matawaka.Workbench.App/App.xaml.cs','src/Matawaka.Workbench.App/OpenAiSecureMcpTunnelV050Service.cs','src/Matawaka.Workbench.App/OpenAiSecureMcpTunnelDialogV050.cs','src/Matawaka.Workbench.App/LocalAppsActionDialogV050.cs','src/Matawaka.Workbench.App/MainWindow.V050.cs','src/Matawaka.Workbench.App/WorkbenchV050AcceptanceHarness.cs','src/Matawaka.Workbench.App/LocalCheckpointV050Service.cs','src/Matawaka.Workbench.App/FixedGitHubPublicationV050Service.cs')
          $root=Join-Path $env:RUNNER_TEMP 'v050-package';$payload=Join-Path $root 'payload';if(Test-Path $root){Remove-Item $root -Recurse -Force};New-Item -ItemType Directory -Path $payload -Force|Out-Null
          $mf=@();foreach($file in $files){$d=Join-Path $payload ($file-replace'/',[IO.Path]::DirectorySeparatorChar);New-Item -ItemType Directory -Path ([IO.Path]::GetDirectoryName($d)) -Force|Out-Null;Copy-Item $file $d;$mf+=[ordered]@{Path=$file;Sha256=(Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()}}
          $m=[ordered]@{Schema='matawaka.workbench-update-package/v0.10';PackageVersion='0.10';TargetVersion='0.50.0';PredecessorTag='workbench-v0.49.1-accepted';PredecessorCommit='1e0453ccf047bd948e76b577c2395a7d0009ff7a';TargetTag='workbench-v0.50-accepted';PayloadRoot='payload/';Files=$mf;NetworkAccessRequested=$false;CatalogMutationRequested=$false;AgentExecuteRequested=$false;ArbitraryProcessExecutionRequested=$false;InstallerScriptExecutionRequested=$false;NonEffects=@('source only','external tunnel-client excluded','credentials/private bytes excluded','no automatic tunnel/ChatGPT connection')}
          [IO.File]::WriteAllText((Join-Path $root 'workbench-update-manifest.json'),($m|ConvertTo-Json -Depth 8),[Text.UTF8Encoding]::new($false))
          $zip=Join-Path $env:RUNNER_TEMP 'workbench-v0.50-source-only.zip';if(Test-Path $zip){Remove-Item $zip};[IO.Compression.ZipFile]::CreateFromDirectory($root,$zip,[IO.Compression.CompressionLevel]::Optimal,$false)
          $audit=Join-Path $env:RUNNER_TEMP 'audit-v050';if(Test-Path $audit){Remove-Item $audit -Recurse -Force};[IO.Compression.ZipFile]::ExtractToDirectory($zip,$audit);$am=Get-Content (Join-Path $audit 'workbench-update-manifest.json') -Raw|ConvertFrom-Json
          if($am.PredecessorCommit -ne '1e0453ccf047bd948e76b577c2395a7d0009ff7a' -or $am.TargetVersion -ne '0.50.0' -or @($am.Files).Count -ne 9){throw 'package identity/file count failed'}
          if($am.NetworkAccessRequested -or $am.CatalogMutationRequested -or $am.AgentExecuteRequested -or $am.ArbitraryProcessExecutionRequested -or $am.InstallerScriptExecutionRequested){throw 'forbidden package capability'}
          foreach($i in $am.Files){$full=Join-Path (Join-Path $audit 'payload') ($i.Path-replace'/',[IO.Path]::DirectorySeparatorChar);if((Get-FileHash $full -Algorithm SHA256).Hash.ToLowerInvariant() -ne $i.Sha256){throw "hash mismatch $($i.Path)"}}
          $sha=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant();[IO.File]::WriteAllText((Join-Path $env:RUNNER_TEMP 'workbench-v0.50-source-only.sha256.txt'),"$sha  workbench-v0.50-source-only.zip`n",[Text.UTF8Encoding]::new($false));Write-Host "V050_PACKAGE_PASS sha256=$sha payloadFiles=$($files.Count) forbiddenFlags=False"

      - uses: actions/upload-artifact@v4
        with:
          name: workbench-v0.50-source-only
          path: |
            ${{ runner.temp }}/workbench-v0.50-source-only.zip
            ${{ runner.temp }}/workbench-v0.50-source-only.sha256.txt
          retention-days: 30
