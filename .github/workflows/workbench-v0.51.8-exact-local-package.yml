name: Workbench v0.51.8 exact local predecessor package

on:
  push:
    branches: [feat/workbench-v0.51.8-mcp-ownership-status]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build exact source candidate
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          dotnet restore Matawaka.Workbench.sln
          if($LASTEXITCODE -ne 0){throw 'v0.51.8 restore failed'}
          dotnet build Matawaka.Workbench.sln -c Release --no-restore -warnaserror
          if($LASTEXITCODE -ne 0){throw 'v0.51.8 Release build failed'}

          $app=Get-Content 'src/Matawaka.Workbench.App/App.xaml.cs' -Raw
          foreach($m in @('ConfigureV0518Routing()','ConfigureV0518AcceptanceRouting()')){
            if(-not $app.Contains($m,[StringComparison]::Ordinal)){throw "v0.51.8 routing marker missing: $m"}
          }
          $status=Get-Content 'src/Matawaka.Workbench.App/LocalAppMcpOwnershipStatusV0518Service.cs' -Raw
          foreach($m in @('FREE_STALE_METADATA','LIVE_ORPHAN','ResumeAuthorityGranted','RevokeAuthorityGranted')){
            if(-not $status.Contains($m,[StringComparison]::Ordinal)){throw "v0.51.8 status marker missing: $m"}
          }
          $recovery=Get-Content 'src/Matawaka.Workbench.App/LocalAppMcpOwnershipRecoveryV0518Service.cs' -Raw
          foreach($m in @('MCP_STALE_METADATA_ACK_REFUSED_OWNER_BUSY','stale-evidence-v0518','CanonicalLeaseMutated','ActiveIndexMutated')){
            if(-not $recovery.Contains($m,[StringComparison]::Ordinal)){throw "v0.51.8 recovery marker missing: $m"}
          }
          $cp=Get-Content 'src/Matawaka.Workbench.App/LocalCheckpointV0518Service.cs' -Raw
          foreach($m in @('workbench-v0.51.7-accepted','workbench-v0.51.8-accepted','v0.51.8-source-manifest*.json','PredecessorGitSha')){
            if(-not $cp.Contains($m,[StringComparison]::Ordinal)){throw "v0.51.8 checkpoint marker missing: $m"}
          }
          Write-Host 'V0518_EXACT_PACKAGE_BUILD_PASS'

      - name: Verify public publication remains deferred
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $remote=(git ls-remote origin refs/heads/main).Split("`t")[0].Trim().ToLowerInvariant()
          if($remote -ne '632ddbb73e8d70b485f02d21f772674d429adf8c'){throw "remote main moved unexpectedly: $remote"}
          Write-Host "V0518_REMOTE_BOUNDARY_PASS main=$remote publicationDeferred=True"

      - name: Package exact local predecessor update
        id: pack
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $predecessor='38a29719440476c759201bac9cf2d89960711484'
          $stage=Join-Path $env:RUNNER_TEMP 'v0518-exact-update'
          if(Test-Path $stage){Remove-Item $stage -Recurse -Force}
          $payload=Join-Path $stage 'payload'
          New-Item -ItemType Directory -Path $payload|Out-Null

          $files=@(
            'PATCH-v0.51.8.md',
            'src/Matawaka.Workbench.App/App.xaml.cs',
            'src/Matawaka.Workbench.App/LocalAppMcpOwnershipRecoveryV0518Service.cs',
            'src/Matawaka.Workbench.App/LocalAppMcpOwnershipStatusV0518Service.cs',
            'src/Matawaka.Workbench.App/LocalAppsActionDialogV050.cs',
            'src/Matawaka.Workbench.App/LocalAppsActionDialogV0515.cs',
            'src/Matawaka.Workbench.App/LocalCheckpointV0518Service.cs',
            'src/Matawaka.Workbench.App/MainWindow.V0518.Acceptance.cs',
            'src/Matawaka.Workbench.App/MainWindow.V0518.cs',
            'src/Matawaka.Workbench.App/WorkbenchV0518AcceptanceHarness.cs'
          )

          $items=@()
          foreach($file in $files){
            $src=Join-Path (Get-Location) ($file -replace '/', [IO.Path]::DirectorySeparatorChar)
            if(-not (Test-Path $src -PathType Leaf)){throw "missing v0.51.8 payload file: $file"}
            $dst=Join-Path $payload ($file -replace '/', [IO.Path]::DirectorySeparatorChar)
            New-Item -ItemType Directory -Path ([IO.Path]::GetDirectoryName($dst)) -Force|Out-Null
            Copy-Item $src $dst -Force
            $items += [ordered]@{Path=$file;Sha256=(Get-FileHash $src -Algorithm SHA256).Hash.ToLowerInvariant()}
          }

          $manifest=[ordered]@{
            Schema='matawaka.workbench-update-package/v0.10'
            PackageVersion='0.10'
            TargetVersion='0.51.8'
            PredecessorTag='workbench-v0.51.7-accepted'
            PredecessorCommit=$predecessor
            TargetTag='workbench-v0.51.8-accepted'
            PayloadRoot='payload/'
            Files=$items
            NetworkAccessRequested=$false
            CatalogMutationRequested=$false
            AgentExecuteRequested=$false
            ArbitraryProcessExecutionRequested=$false
            InstallerScriptExecutionRequested=$false
            NonEffects=@(
              'source only',
              'exact local v0.51.7 predecessor only',
              'MCP ownership status is observational and grants no resume/read/lease/revoke authority',
              'stale owner acknowledgement is explicit evidence rotation only',
              'canonical v0.48 lease state remains authority source of truth',
              'v0.51.5 active index remains derived and v0.51.6/v0.51.7 cross-process runtime controls remain preserved',
              'no automatic orphan closure lease renewal/revocation or MCP resume',
              'no bearer plaintext/hash or endpoint path token disclosure',
              'no historical evidence deletion or compaction',
              'no private app bytes',
              'no runtime lease/index/fence/MCP owner/stale-evidence/clipboard endpoint state',
              'no automatic Secure MCP Tunnel',
              'no OpenAI bridge dependency',
              'no remote publication authority',
              'no CI workflow or qualification fixture files in payload'
            )
          }
          $manifest|ConvertTo-Json -Depth 8|Set-Content (Join-Path $stage 'workbench-update-manifest.json') -Encoding UTF8

          $zip=Join-Path $env:RUNNER_TEMP 'workbench-v0.51.8-mcp-ownership-status-update.zip'
          if(Test-Path $zip){Remove-Item $zip -Force}
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip -CompressionLevel Optimal
          $sha=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "zip=$zip" >> $env:GITHUB_OUTPUT
          "sha=$sha" >> $env:GITHUB_OUTPUT
          Write-Host "V0518_PACKAGE_PASS predecessor=$predecessor files=$($files.Count) sha256=$sha"

      - uses: actions/upload-artifact@v4
        with:
          name: workbench-v0.51.8-exact-local-update
          path: ${{ steps.pack.outputs.zip }}
          if-no-files-found: error
