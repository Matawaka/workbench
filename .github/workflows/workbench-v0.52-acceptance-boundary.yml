name: Workbench v0.52 artifact acquisition acceptance boundary

on:
  push:
    branches: [feat/workbench-v0.52-bounded-artifact-acquisition]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build and verify v0.52 admission
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          dotnet restore Matawaka.Workbench.sln
          if($LASTEXITCODE -ne 0){throw 'v0.52 restore failed'}
          dotnet build Matawaka.Workbench.sln -c Release --no-restore -warnaserror
          if($LASTEXITCODE -ne 0){throw 'v0.52 Release build failed'}

          $app=Get-Content 'src/Matawaka.Workbench.App/App.xaml.cs' -Raw
          foreach($m in @('ConfigureV052Routing()','ConfigureV052AcceptanceRouting()')){
            if(-not $app.Contains($m,[StringComparison]::Ordinal)){throw "startup v0.52 marker missing: $m"}
          }

          $svc=Get-Content 'src/Matawaka.Workbench.App/BoundedArtifactAcquisitionV052Service.cs' -Raw
          foreach($m in @('ACQUISITION_PREPARED','DOWNLOAD_STARTED','BYTES_COMPLETE','SIZE_VERIFIED','SHA256_VERIFIED','RemainingCalls = 0','AllowAutoRedirect = false','Atomic','Artifact Selected != Download Authority')){
            if(-not $svc.Contains($m,[StringComparison]::Ordinal)){throw "v0.52 service marker missing: $m"}
          }

          $ui=Get-Content 'src/Matawaka.Workbench.App/MainWindow.V052.cs' -Raw
          foreach($m in @('AcquireArtifactsV052Async','GrantAsync','AcquireAsync','AuthorityGrantBearerOmitted = true','AutomaticRetryPerformed = false','RuntimeStartPerformed = false','ModelRequestPerformed = false')){
            if(-not $ui.Contains($m,[StringComparison]::Ordinal)){throw "v0.52 UI marker missing: $m"}
          }

          $route=Get-Content 'src/Matawaka.Workbench.App/MainWindow.V05113.cs' -Raw
          if(-not $route.Contains('case LocalAppsActionChoiceV050.BoundedArtifactAcquisition: await AcquireArtifactsV052Async(); break;',[StringComparison]::Ordinal)){
            throw 'v0.52 chooser route is not materialized'
          }
          $chooser=Get-Content 'src/Matawaka.Workbench.App/LocalAppsActionDialogV0515.cs' -Raw
          foreach($m in @('Bounded artifact acquisition from exact JSON — generic','selected app is navigation context only')){
            if(-not $chooser.Contains($m,[StringComparison]::Ordinal)){throw "v0.52 chooser marker missing: $m"}
          }

          $acc=Get-Content 'src/Matawaka.Workbench.App/MainWindow.V052.Acceptance.cs' -Raw
          foreach($m in @('Window_LoadedV052','RunV052AcceptanceArtifactAsync','AcceptFromBootstrapAsync','SelectedEqualsAuthority = false','OneShotCallBudget = 1','KONTURSpecificRuntimeBehavior = false','AutomaticPublishPerformed = false')){
            if(-not $acc.Contains($m,[StringComparison]::Ordinal)){throw "v0.52 acceptance marker missing: $m"}
          }
          $h=Get-Content 'src/Matawaka.Workbench.App/WorkbenchV052AcceptanceHarness.cs' -Raw
          foreach($m in @('BoundedArtifactAcquisitionV052Service.RunOfflineContractChecks','verified artifact does not imply extraction','provider-neutral contract')){
            if(-not $h.Contains($m,[StringComparison]::Ordinal)){throw "v0.52 acceptance harness marker missing: $m"}
          }

          $cp=Get-Content 'src/Matawaka.Workbench.App/LocalCheckpointV052Service.cs' -Raw
          foreach($m in @('workbench-v0.51.13-accepted','46c926221cfaa8be3b68012852c7e8f3e324247f','workbench-v0.52-accepted','v0.52-source-manifest*.json','matawaka.workbench-local-checkpoint-receipt/v0.52')){
            if(-not $cp.Contains($m,[StringComparison]::Ordinal)){throw "v0.52 checkpoint marker missing: $m"}
          }

          foreach($path in @(
            'integrations/artifact-acquisition/README.md',
            'integrations/artifact-acquisition/artifact-acquisition-request.v052.schema.json',
            'integrations/kontur/ARTIFACT_ACQUISITION_INTAKE.v052.json'
          )){
            if(-not (Test-Path $path -PathType Leaf)){throw "v0.52 integration contract missing: $path"}
          }
          $intake=Get-Content 'integrations/kontur/ARTIFACT_ACQUISITION_INTAKE.v052.json' -Raw
          if(-not $intake.Contains('PREPARED_NOT_AUTHORIZED',[StringComparison]::Ordinal)){throw 'KONTUR intake must remain non-authoritative'}

          $xaml=Get-Content 'src/Matawaka.Workbench.App/MainWindow.xaml' -Raw
          foreach($name in @('UpdateCandidateButton','UpdateLocalAppButton','PublishAcceptedButton','LifecycleReceiptButton')){
            if(-not $xaml.Contains("x:Name=\"$name\"",[StringComparison]::Ordinal)){throw "top-level button missing: $name"}
          }
          Write-Host 'V052_ACCEPTANCE_BOUNDARY_PASS exactPredecessor=46c926221cfaa8be3b68012852c7e8f3e324247f primitive=provider-neutral oneShot=true postDownloadAuthority=false konturIntake=non-authoritative publish=deferred'
      - name: Verify publication remains deferred
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $remote=(git ls-remote origin refs/heads/main).Split("`t")[0].Trim().ToLowerInvariant()
          if($remote -ne '632ddbb73e8d70b485f02d21f772674d429adf8c'){throw "remote main moved unexpectedly: $remote"}
          Write-Host "V052_ACCEPTANCE_REMOTE_BOUNDARY_PASS main=$remote publicationDeferred=True"
