name: Workbench v0.34.1 qualification and stabilization

on:
  push:
    branches:
      - stabilize/workbench-v0.34.1-qualification
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    name: Windows stabilization build and qualification checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Matawaka.Workbench.sln

      - name: Build Release
        run: dotnet build Matawaka.Workbench.sln -c Release --no-restore

      - name: Verify generic lifecycle adapter
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $src = Get-Content 'src/Matawaka.Workbench.App/MaintenanceLifecycleReceiptService.cs' -Raw

          foreach ($required in @(
            'AcceptedTagRegex',
            'RequireSingleAcceptedTag',
            'ParseAcceptedTagVersion',
            'rev-parse", "HEAD^',
            'tag", "--points-at", parent',
            'CheckpointSchemaFor',
            'AcceptanceSchemaFor',
            'PublicationSchemaFor',
            'FindSingleJson',
            'ValidateReadOnlyGitArgs',
            'lifecycle-ambiguous-artifact-refused',
            'lifecycle-missing-artifact-refused',
            'lifecycle-nonaccepted-tag-refused'
          )) {
            if ($src -notmatch [regex]::Escape($required)) { throw "generic lifecycle marker missing: $required" }
          }

          foreach ($forbidden in @(
            'public const string Version = "0.34.0"',
            'public const string PredecessorCommit',
            'public const string PredecessorTag',
            'public const string TargetTag',
            'OrderByDescending\(File\.GetLastWriteTimeUtc',
            'MaintenanceUpdateOrchestratorService\s*\(',
            'LaunchCandidateAsync\s*\(',
            'LocalCheckpointV0341Service\s*\(',
            'FixedGitHubPublicationV0341Service\s*\('
          )) {
            if ($src -match $forbidden) { throw "release-bound/downstream lifecycle behavior found: $forbidden" }
          }

          if ($src -notmatch 'Generic Evidence Discovery != Authority Discovery' -and $src -notmatch 'evidence routing only') {
            throw 'generic lifecycle authority/trust boundary text missing'
          }
          Write-Host 'successor-generic lifecycle adapter: PASS'

      - name: Verify lifecycle Git allowlist
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $src = Get-Content 'src/Matawaka.Workbench.App/MaintenanceLifecycleReceiptService.cs' -Raw
          foreach ($required in @(
            'joined == "rev-parse\u001fHEAD"',
            'joined == "rev-parse\u001fHEAD^"',
            'joined == "tag\u001f--points-at\u001fHEAD"',
            'joined == "status\u001f--porcelain=v1\u001f--untracked-files=all"'
          )) {
            if (-not $src.Contains($required)) { throw "fixed read-only Git allowlist marker missing: $required" }
          }
          foreach ($verb in @('"push"','"fetch"','"remote"','"add"','"commit"')) {
            $callPattern = 'RunGitReadOnlyAsync\([^;]{0,240}' + [regex]::Escape($verb)
            if ($src -match $callPattern) { throw "mutating/network Git call found in lifecycle adapter: $verb" }
          }
          Write-Host 'lifecycle fixed read-only Git allowlist: PASS'

      - name: Verify publisher parent ownership is decoupled
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $legacy = Get-Content 'src/Matawaka.Workbench.App/FixedGitHubPublicationV034Service.cs' -Raw
          if ($legacy -match 'MaintenanceLifecycleReceiptService\.PredecessorCommit') {
            throw 'historical v0.34 publisher still depends on lifecycle-owned predecessor constant'
          }
          if ($legacy -notmatch 'ExpectedParent = "df211d1f4d80d0b1f238f1166460758e73ce18d2"') {
            throw 'historical v0.34 publisher does not own its exact expected parent'
          }
          Write-Host 'publisher/lifecycle parent ownership decoupled: PASS'

      - name: Verify accepted-state-neutral public docs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $docs = @('README.md','START-HERE.md','SECURITY-BOUNDARY.md','DEVELOPMENT-AUDIT-ROADMAP.md')
          foreach ($doc in $docs) {
            $text = Get-Content $doc -Raw
            $firstLines = (($text -split "`n") | Select-Object -First 12) -join "`n"
            if ($firstLines -match '(?i)candidate') { throw "$doc still presents permanent docs as candidate-state" }
            if ($firstLines -match 'df211d1f4d80d0b1f238f1166460758e73ce18d2') { throw "$doc still hard-codes v0.33 as accepted baseline" }
            if ($firstLines -match 'workbench-v0\.33-accepted') { throw "$doc still hard-codes v0.33 accepted baseline" }
          }
          $readme = Get-Content README.md -Raw
          if ($readme -notmatch 'single `workbench-v<version>-accepted` tag at `main` HEAD') { throw 'accepted-state rule missing from README' }
          Write-Host 'accepted-state-neutral public docs: PASS'

      - name: Verify v0.34.1 patch successors and qualification ceiling
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $accept = Get-Content 'src/Matawaka.Workbench.App/WorkbenchV0341AcceptanceHarness.cs' -Raw
          $checkpoint = Get-Content 'src/Matawaka.Workbench.App/LocalCheckpointV0341Service.cs' -Raw
          $publisher = Get-Content 'src/Matawaka.Workbench.App/FixedGitHubPublicationV0341Service.cs' -Raw
          $xaml = Get-Content 'src/Matawaka.Workbench.App/MainWindow.xaml' -Raw
          $qualification = Get-Content 'QUALIFICATION-v0.34.1.json' -Raw | ConvertFrom-Json

          if ($accept -notmatch 'matawaka\.workbench-acceptance-receipt/v0\.34\.1') { throw 'v0.34.1 acceptance schema missing' }
          if ($checkpoint -notmatch 'ExpectedPredecessorCommit = "224ad00bd72b0534de1081b2a20c44746ee0e7a0"') { throw 'exact v0.34 predecessor missing from checkpoint' }
          if ($checkpoint -notmatch 'workbench-v0\.34\.1-accepted') { throw 'v0.34.1 checkpoint target missing' }
          if ($checkpoint -notmatch 'matawaka\.workbench-build-source-manifest/v0\.34') { throw 'patch build-manifest major.minor schema rule missing' }
          if ($publisher -notmatch 'ExpectedParent = "224ad00bd72b0534de1081b2a20c44746ee0e7a0"') { throw 'exact v0.34 parent missing from publisher' }
          if ($publisher -notmatch 'workbench-v0\.34\.1-accepted') { throw 'v0.34.1 publisher target missing' }
          if ($publisher -match '"--force') { throw 'force publication argument found' }
          if ($xaml -notmatch 'Matawaka Workbench v0\.34\.1') { throw 'v0.34.1 title missing' }
          foreach ($handler in @('SelfTestV0341Button_Click','AcceptCheckpointV0341Button_Click','PublishAcceptedV0341Button_Click','LifecycleReceiptGenericButton_Click')) {
            if ($xaml -notmatch [regex]::Escape($handler)) { throw "v0.34.1 UI handler missing: $handler" }
          }
          if ($qualification.qualification.status -ne 'REAL_SUCCESSOR_QUALIFICATION_PENDING') { throw 'qualification prematurely claims final outcome' }
          if ($qualification.patch_scope.feature_layer_created -ne $false) { throw 'patch self-claims feature layer' }
          if ($qualification.patch_scope.historical_v0_34_publisher_parent_ownership_repaired -ne $true) { throw 'publisher/lifecycle coupling repair not recorded' }
          if ($qualification.qualification.positive_outcome_authorized_before_real_successor -ne $false) { throw 'positive lifecycle qualification prematurely authorized' }
          Write-Host 'patch successors / qualification ceiling: PASS'

      - name: Verify accepted non-App implementation unchanged
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $base = '224ad00bd72b0534de1081b2a20c44746ee0e7a0'
          git cat-file -e "$base^{commit}"
          $changed = git diff --name-only $base HEAD
          $forbidden = $changed | Where-Object {
            $_ -like 'src/Matawaka.Workbench.AgentHost/*' -or
            $_ -like 'src/Matawaka.Workbench.Runtime/*' -or
            $_ -like 'src/Matawaka.Workbench.Protocol/*' -or
            $_ -like 'src/Matawaka.Workbench.Engine/*' -or
            $_ -like 'src/Matawaka.Workbench.Catalog/*' -or
            $_ -like 'src/Matawaka.Workbench.SemanticHost/*'
          }
          if ($forbidden) { throw "unexpected non-App stabilization mutation: $($forbidden -join ', ')" }
          Write-Host 'accepted non-App implementation unchanged: PASS'

      - name: Clean checkout before package creation
        shell: pwsh
        run: |
          $status = git status --porcelain=v1 --untracked-files=all
          if ($status) { throw "source drift after validation: $status" }

      - name: Build source-only v0.34.1 stabilization package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $files = @(
            'README.md',
            'START-HERE.md',
            'SECURITY-BOUNDARY.md',
            'DEVELOPMENT-AUDIT-ROADMAP.md',
            'PATCH-v0.34.1.md',
            'QUALIFICATION-v0.34.1.json',
            'src/Matawaka.Workbench.App/MainWindow.xaml',
            'src/Matawaka.Workbench.App/MainWindow.V0341.cs',
            'src/Matawaka.Workbench.App/MaintenanceLifecycleReceiptService.cs',
            'src/Matawaka.Workbench.App/FixedGitHubPublicationV034Service.cs',
            'src/Matawaka.Workbench.App/WorkbenchV0341AcceptanceHarness.cs',
            'src/Matawaka.Workbench.App/LocalCheckpointV0341Service.cs',
            'src/Matawaka.Workbench.App/FixedGitHubPublicationV0341Service.cs'
          )
          foreach ($file in $files) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { throw "package payload file missing: $file" }
          }

          $root = Join-Path $env:RUNNER_TEMP 'workbench-v0.34.1-package'
          $payload = Join-Path $root 'payload'
          if (Test-Path $root) { Remove-Item $root -Recurse -Force }
          New-Item -ItemType Directory -Path $payload -Force | Out-Null
          $manifestFiles = @()
          foreach ($file in $files) {
            $dest = Join-Path $payload ($file -replace '/', [IO.Path]::DirectorySeparatorChar)
            New-Item -ItemType Directory -Path ([IO.Path]::GetDirectoryName($dest)) -Force | Out-Null
            Copy-Item -LiteralPath $file -Destination $dest -Force
            $sha = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
            $manifestFiles += [ordered]@{ Path = $file; Sha256 = $sha }
          }
          $manifest = [ordered]@{
            Schema = 'matawaka.workbench-update-package/v0.10'
            PackageVersion = '0.10'
            TargetVersion = '0.34.1'
            PredecessorTag = 'workbench-v0.34-accepted'
            PredecessorCommit = '224ad00bd72b0534de1081b2a20c44746ee0e7a0'
            TargetTag = 'workbench-v0.34.1-accepted'
            PayloadRoot = 'payload/'
            Files = $manifestFiles
            NetworkAccessRequested = $false
            CatalogMutationRequested = $false
            AgentExecuteRequested = $false
            ArbitraryProcessExecutionRequested = $false
            InstallerScriptExecutionRequested = $false
            NonEffects = @(
              'qualification patch only; no feature layer on package creation',
              'no network requested by package',
              'no catalog mutation or Agent Execute requested',
              'package validity does not authorize materialization/build/launch/checkpoint/publication/lifecycle',
              'LIFECYCLE_REUSABLE remains unproven until real successor lifecycle completes'
            )
          }
          $manifestPath = Join-Path $root 'workbench-update-manifest.json'
          [IO.File]::WriteAllText($manifestPath, ($manifest | ConvertTo-Json -Depth 8), [Text.UTF8Encoding]::new($false))
          $zip = Join-Path $env:RUNNER_TEMP 'workbench-v0.34.1-source-only.zip'
          if (Test-Path $zip) { Remove-Item $zip -Force }
          [IO.Compression.ZipFile]::CreateFromDirectory($root, $zip, [IO.Compression.CompressionLevel]::Optimal, $false)
          $zipSha = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText((Join-Path $env:RUNNER_TEMP 'workbench-v0.34.1-source-only.sha256.txt'), "$zipSha  workbench-v0.34.1-source-only.zip`n", [Text.UTF8Encoding]::new($false))
          Write-Host "sha256=$zipSha"
          Write-Host "payload files=$($files.Count)"

      - name: Upload v0.34.1 source-only stabilization package
        uses: actions/upload-artifact@v4
        with:
          name: workbench-v0.34.1-source-only
          path: |
            ${{ runner.temp }}/workbench-v0.34.1-source-only.zip
            ${{ runner.temp }}/workbench-v0.34.1-source-only.sha256.txt
          if-no-files-found: error
          retention-days: 30
