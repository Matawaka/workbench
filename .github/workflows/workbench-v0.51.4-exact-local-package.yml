name: Workbench v0.51.4 exact local predecessor package

on:
  push:
    branches: [feat/workbench-v0.51.4-bounded-session-status]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build exact source candidate
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          dotnet restore Matawaka.Workbench.sln
          if($LASTEXITCODE -ne 0){throw 'v0.51.4 restore failed'}
          dotnet build Matawaka.Workbench.sln -c Release --no-restore -warnaserror
          if($LASTEXITCODE -ne 0){throw 'v0.51.4 Release build failed'}

          $app=Get-Content 'src/Matawaka.Workbench.App/App.xaml.cs' -Raw
          foreach($m in @('ConfigureV0514Routing()','ConfigureV0514AcceptanceRouting()')){
            if(-not $app.Contains($m,[StringComparison]::Ordinal)){throw "v0.51.4 routing marker missing: $m"}
          }
          $cp=Get-Content 'src/Matawaka.Workbench.App/LocalCheckpointV0514Service.cs' -Raw
          foreach($m in @('workbench-v0.51.3-accepted','workbench-v0.51.4-accepted','v0.51.4-source-manifest*.json','PredecessorGitSha')){
            if(-not $cp.Contains($m,[StringComparison]::Ordinal)){throw "checkpoint marker missing: $m"}
          }
          $svc=Get-Content 'src/Matawaka.Workbench.App/LocalAppReadSessionStatusV0514Service.cs' -Raw
          foreach($m in @('DefaultHistoryLimit = 16','MaxHistoryLimit = 64','LiveAuthorityHardLimit = 32','LIVE_AUTHORITY_OVERFLOW','ObserveExactLease')){
            if(-not $svc.Contains($m,[StringComparison]::Ordinal)){throw "bounded status marker missing: $m"}
          }
          Write-Host 'V0514_EXACT_PACKAGE_BUILD_PASS'

      - name: Verify public publication remains deferred
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $remote=(git ls-remote origin refs/heads/main).Split("`t")[0].Trim().ToLowerInvariant()
          if($remote -ne '632ddbb73e8d70b485f02d21f772674d429adf8c'){throw "remote main moved unexpectedly: $remote"}
          Write-Host "V0514_REMOTE_BOUNDARY_PASS main=$remote publicationDeferred=True"

      - name: Package exact local predecessor update
        id: pack
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $predecessor='5c68cd165cb1d5995c6086de4f7b9987b78bf439'
          $stage=Join-Path $env:RUNNER_TEMP 'v0514-exact-update'
          if(Test-Path $stage){Remove-Item $stage -Recurse -Force}
          $payload=Join-Path $stage 'payload'
          New-Item -ItemType Directory -Path $payload|Out-Null

          $files=@(
            'PATCH-v0.51.4.md',
            'src/Matawaka.Workbench.App/App.xaml.cs',
            'src/Matawaka.Workbench.App/LocalAppReadSessionStatusV0514Service.cs',
            'src/Matawaka.Workbench.App/LocalAppHistoryPageChooserV0514.cs',
            'src/Matawaka.Workbench.App/LocalAppsActionDialogV0514.cs',
            'src/Matawaka.Workbench.App/LocalCheckpointV0514Service.cs',
            'src/Matawaka.Workbench.App/MainWindow.V0514.Acceptance.cs',
            'src/Matawaka.Workbench.App/MainWindow.V0514.cs',
            'src/Matawaka.Workbench.App/WorkbenchV0514AcceptanceHarness.cs'
          )

          $items=@()
          foreach($file in $files){
            $src=Join-Path (Get-Location) ($file -replace '/', [IO.Path]::DirectorySeparatorChar)
            if(-not (Test-Path $src -PathType Leaf)){throw "missing v0.51.4 payload file: $file"}
            $dst=Join-Path $payload ($file -replace '/', [IO.Path]::DirectorySeparatorChar)
            New-Item -ItemType Directory -Path ([IO.Path]::GetDirectoryName($dst)) -Force|Out-Null
            Copy-Item $src $dst -Force
            $items += [ordered]@{Path=$file;Sha256=(Get-FileHash $src -Algorithm SHA256).Hash.ToLowerInvariant()}
          }

          $manifest=[ordered]@{
            Schema='matawaka.workbench-update-package/v0.10'
            PackageVersion='0.10'
            TargetVersion='0.51.4'
            PredecessorTag='workbench-v0.51.3-accepted'
            PredecessorCommit=$predecessor
            TargetTag='workbench-v0.51.4-accepted'
            PayloadRoot='payload/'
            Files=$items
            NetworkAccessRequested=$false
            CatalogMutationRequested=$false
            AgentExecuteRequested=$false
            ArbitraryProcessExecutionRequested=$false
            InstallerScriptExecutionRequested=$false
            NonEffects=@(
              'source only',
              'exact local v0.51.3 predecessor only',
              'historical pagination is representation-only',
              'no lease-state deletion, compaction or archival mutation',
              'no private app bytes',
              'no lease bearer clipboard endpoint or MCP runtime bytes',
              'no automatic Secure MCP Tunnel',
              'no OpenAI bridge dependency',
              'no remote publication authority',
              'no CI workflow files in payload'
            )
          }
          $manifest|ConvertTo-Json -Depth 8|Set-Content (Join-Path $stage 'workbench-update-manifest.json') -Encoding UTF8

          $zip=Join-Path $env:RUNNER_TEMP 'workbench-v0.51.4-bounded-session-status-update.zip'
          if(Test-Path $zip){Remove-Item $zip -Force}
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip -CompressionLevel Optimal
          $sha=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "zip=$zip" >> $env:GITHUB_OUTPUT
          "sha=$sha" >> $env:GITHUB_OUTPUT
          Write-Host "V0514_PACKAGE_PASS predecessor=$predecessor files=$($files.Count) sha256=$sha"

      - uses: actions/upload-artifact@v4
        with:
          name: workbench-v0.51.4-exact-local-update
          path: ${{ steps.pack.outputs.zip }}
          if-no-files-found: error
