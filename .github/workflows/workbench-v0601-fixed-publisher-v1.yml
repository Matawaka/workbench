name: Workbench v0601 fixed publisher v1
on:
  push:
    branches: [tooling/workbench-v0.60.1-fixed-publication-v1]
    paths:
      - tooling/v0601-fixed-publication/publisher-fixed-v1/**
      - .github/workflows/workbench-v0601-fixed-publisher-v1.yml
permissions:
  contents: read
jobs:
  windows-publisher:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 10.0.401
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Acquire exact MinGit for disposable fixtures only
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP/publisher-MinGit.zip"
          Invoke-WebRequest 'https://github.com/git-for-windows/git/releases/download/v2.55.0.windows.4/MinGit-2.55.0.4-64-bit.zip' -OutFile $zip -TimeoutSec 120
          if ((Get-Item $zip).Length -ne 38792847 -or (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne '4e03f94c2ffbf70be337e005cee02661c732dbfc81031a078bda9299b9a7d644') { throw 'MINGIT_ARCHIVE_IDENTITY_MISMATCH' }
          Expand-Archive -LiteralPath $zip -DestinationPath "$env:RUNNER_TEMP/publisher-mingit"
      - name: Materialize separate publisher with unchanged qualified V2 source
        shell: pwsh
        run: |
          python tooling/v0601-fixed-publication/publisher-fixed-v1/prepare.py "$env:RUNNER_TEMP/publisher-source" "$env:RUNNER_TEMP/publisher-MinGit.zip"
          if ($LASTEXITCODE -ne 0) { throw 'PUBLISHER_SOURCE_MATERIALIZATION_FAILED' }
      - name: Inherited source evidence and promisor regression qualification
        shell: pwsh
        run: |
          $env:PATH = "$env:RUNNER_TEMP/publisher-mingit/cmd;" + $env:PATH
          Set-Location "$env:RUNNER_TEMP/publisher-source"
          dotnet run --project V2Tests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'INHERITED_V2_QUALIFICATION_FAILED' }
      - name: Exact publisher isolated transport qualification
        shell: pwsh
        run: |
          $env:PATH = "$env:RUNNER_TEMP/publisher-mingit/cmd;" + $env:PATH
          Set-Location "$env:RUNNER_TEMP/publisher-source"
          dotnet run --project PublisherTests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'FIXED_PUBLISHER_QUALIFICATION_FAILED' }
      - name: Real loopback HTTPS credentials TLS redirects and lost-response qualification
        shell: pwsh
        run: |
          $env:PATH = "$env:RUNNER_TEMP/publisher-mingit/cmd;" + $env:PATH
          Set-Location "$env:RUNNER_TEMP/publisher-source"
          dotnet run --project NetworkTests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'FIXED_PUBLISHER_HTTPS_QUALIFICATION_FAILED' }
      - name: Build zero-argument publisher after all checks
        shell: pwsh
        run: |
          dotnet publish "$env:RUNNER_TEMP/publisher-source/Publisher.csproj" -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o "$env:RUNNER_TEMP/publisher-delivery"
          if ($LASTEXITCODE -ne 0) { throw 'PUBLISHER_BUILD_FAILED' }
          @'
          import os,pathlib,subprocess
          exe=pathlib.Path(os.environ['RUNNER_TEMP'])/'publisher-delivery/Matawaka.Workbench.V0601FixedPublisher.exe'
          p=subprocess.run([str(exe),'--argument-probe'],capture_output=True,timeout=20)
          assert p.returncode==1 and b'ARGUMENTS_NOT_ACCEPTED' in p.stderr, 'ZERO_ARGUMENT_GUARD_FAILED'
          print('DELIVERED_PUBLISHER_ARGUMENT_REFUSAL_PASS_NO_HOST_ACCESS')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'PRODUCTION_CLI_GUARD_FAILED' }
      - name: Bind binary sources reports and complete tool manifest
        shell: pwsh
        run: |
          @'
          import os,pathlib,zipfile,hashlib,json,shutil
          temp=pathlib.Path(os.environ['RUNNER_TEMP']);src=temp/'publisher-source';out=temp/'publisher-delivery'
          reports=['preflight-qualification.json','evidence-qualification.json','promisor-v2-qualification.json','publisher-qualification.json','publisher-https-qualification.json']
          for name in reports:
              value=json.loads((src/name).read_text(encoding='utf-8-sig'));assert value['Passed'] and all(c['Passed'] for c in value['Checks'])
              shutil.copyfile(src/name,out/name)
          for name in ['publisher-materialization.json','mingit-files.json']:shutil.copyfile(src/name,out/name)
          with zipfile.ZipFile(out/'qualified-source.zip','w',zipfile.ZIP_DEFLATED) as z:
              for p in sorted(src.iterdir()):
                  if p.is_file() and p.suffix in ('.cs','.csproj','.json'):z.write(p,p.name)
          files=[{'Path':p.name,'Bytes':p.stat().st_size,'Sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in sorted(out.iterdir()) if p.is_file()]
          manifest={'Schema':'matawaka.workbench-fixed-publisher-delivery/v0.1','SourceSha':os.environ['GITHUB_SHA'],'RunId':os.environ['GITHUB_RUN_ID'],'ProductionPublisherExecuted':False,'OperatorHostAccessed':False,'Files':files}
          (out/'manifest.json').write_text(json.dumps(manifest,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(manifest,indent=2))
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'PUBLISHER_DELIVERY_BINDING_FAILED' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: workbench-v0601-fixed-publisher-v1-win-x64
          path: ${{ runner.temp }}/publisher-delivery/*
          retention-days: 30
          if-no-files-found: error
