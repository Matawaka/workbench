name: Workbench v0.51.1 read lease to local MCP auto-start candidate

on:
  push:
    branches: [feat/workbench-v0.51.1-read-lease-auto-mcp]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build and static authority checks
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          dotnet restore Matawaka.Workbench.sln
          if($LASTEXITCODE -ne 0){throw 'restore failed'}
          dotnet build Matawaka.Workbench.sln -c Release --no-restore -warnaserror
          if($LASTEXITCODE -ne 0){throw 'Release build failed'}
          $app=Get-Content 'src/Matawaka.Workbench.App/App.xaml.cs' -Raw
          if(-not $app.Contains('ConfigureV0511Routing()', [StringComparison]::Ordinal)){throw 'v0.51.1 routing missing'}
          $main=Get-Content 'src/Matawaka.Workbench.App/MainWindow.V0511.cs' -Raw
          foreach($m in @('CreateReadLeaseAndAutoStartMcpV0511Async','Clipboard.SetText(exactGrantJson)','Clipboard.GetText()','StringComparison.Ordinal','PreviewFromGrantJson','StartAsync','LEASE_CREATED_MCP_START_FAILED','AutomaticRetryPerformed = false','LeaseRevokedAutomatically = false','SecureMcpTunnelStarted = false')){if(-not $main.Contains($m,[StringComparison]::Ordinal)){throw "marker missing: $m"}}
          $combined=[regex]::Match($main,'private async Task CreateReadLeaseAndAutoStartMcpV0511Async[\s\S]*?private void ShowLeaseCreatedMcpStartFailureV0511').Value
          if([string]::IsNullOrWhiteSpace($combined)){throw 'combined method missing'}
          if($combined.Contains('StartSecureMcpTunnel',[StringComparison]::Ordinal) -or $combined.Contains('PublishAsync',[StringComparison]::Ordinal)){throw 'combined action gained forbidden tunnel/publication authority'}
          $cp=Get-Content 'src/Matawaka.Workbench.App/LocalCheckpointV0511Service.cs' -Raw
          foreach($m in @('ExpectedPredecessorCommit = "a8a93143e942a02913475013e355d61b2fa6bee8"','ExpectedPredecessorTag = "workbench-v0.51-accepted"','TargetTag = "workbench-v0.51.1-accepted"','v0.51.1-source-manifest*.json','matawaka.workbench-build-source-manifest/v0.51')){if(-not $cp.Contains($m,[StringComparison]::Ordinal)){throw "checkpoint marker missing: $m"}}
          $xaml=Get-Content 'src/Matawaka.Workbench.App/MainWindow.xaml' -Raw
          $surface=[regex]::Match($xaml,'<WrapPanel x:Name="PrimaryMaintenanceSurface"[\s\S]*?</WrapPanel>').Value
          if([regex]::Matches($surface,'<Button\b').Count -ne 4){throw 'top-level surface changed'}
          Write-Host 'V0511_STATIC_PASS build=True buttons=4 autoMcp=True exactClipboard=True tunnelAuto=False'

      - name: Execute clipboard grant to live local MCP probe
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $p=Join-Path $env:RUNNER_TEMP 'v0511-probe'
          if(Test-Path $p){Remove-Item $p -Recurse -Force}
          New-Item -ItemType Directory -Path $p|Out-Null
          $appProject=(Resolve-Path 'src/Matawaka.Workbench.App/Matawaka.Workbench.App.csproj').Path
          $escaped=[Security.SecurityElement]::Escape($appProject)
          @"
          <Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><OutputType>Exe</OutputType><TargetFramework>net10.0-windows</TargetFramework><UseWPF>true</UseWPF><ImplicitUsings>enable</ImplicitUsings><Nullable>enable</Nullable><TreatWarningsAsErrors>true</TreatWarningsAsErrors></PropertyGroup><ItemGroup><ProjectReference Include="$escaped" /></ItemGroup></Project>
          "@ | Set-Content (Join-Path $p 'Probe.csproj') -Encoding UTF8
          @'
          using System.IO;
          using System.Net.Http;
          using System.Text;
          using System.Text.Json;
          using System.Windows;
          using Matawaka.Workbench.App;

          internal static class Program
          {
              [STAThread]
              public static async Task Main()
              {
                  var workspace=Path.Combine(Path.GetTempPath(),"matawaka-v0511-"+Guid.NewGuid().ToString("N"));
                  Directory.CreateDirectory(Path.Combine(workspace,"Workbench","artifacts"));
                  var appRoot=Path.Combine(workspace,"Apps","alpha");
                  var data=Path.Combine(appRoot,"data");
                  Directory.CreateDirectory(data);
                  File.WriteAllText(Path.Combine(appRoot,".matawaka-app.json"),JsonSerializer.Serialize(new LocalApplicationIdentity(LocalApplicationMaintenanceService.IdentitySchema,"alpha","1.0.0")),new UTF8Encoding(false));
                  File.WriteAllText(Path.Combine(data,"state.json"),"{\"auto\":true}",new UTF8Encoding(false));

                  var leases=new LocalAppReadLeaseV048Service();
                  var request=new LocalAppReadLeaseRequestV048(LocalAppReadLeaseV048Service.RequestSchema,"lease:v0511:auto","alpha",new[]{new LocalAppReadLeaseScopeV048("installed","data/")},65536,262144,8,300);
                  var preview=leases.Preview(workspace,"alpha",request,default);
                  var created=await leases.CreateAsync(workspace,"alpha",preview,false,default);
                  var before=leases.ListActive(workspace,"alpha").Single(x=>x.LeaseId==created.Grant.LeaseId);

                  var exact=LocalAppReadLeaseV048Service.SerializeGrant(created.Grant);
                  Clipboard.SetText(exact);
                  var observed=Clipboard.GetText();
                  if(!string.Equals(exact,observed,StringComparison.Ordinal))throw new Exception("clipboard exact round-trip failed");

                  var adapter=new LocalAppMcpReadAdapterV049Service();
                  var ap=adapter.PreviewFromGrantJson(workspace,"alpha",observed,default);
                  if(ap.LeaseId!=created.Grant.LeaseId||ap.ApplicationId!="alpha"||!ap.BearerSha256.Equals(created.Receipt.BearerSha256,StringComparison.OrdinalIgnoreCase))throw new Exception("adapter preview is not exact lease/grant bound");
                  var grant=await adapter.StartAsync(workspace,"alpha",ap,observed,default);
                  if(!grant.LoopbackOnly||grant.PublicNetworkExposurePerformed||grant.SecureMcpTunnelStarted)throw new Exception("local-only boundary failed");
                  if(grant.Tools.Count!=2||!grant.Tools.Contains("read_local_app_chunk")||!grant.Tools.Contains("list_local_app_entries"))throw new Exception("v0.51 two-tool surface missing");

                  var after=leases.ListActive(workspace,"alpha").Single(x=>x.LeaseId==created.Grant.LeaseId);
                  if(after.RemainingCalls!=before.RemainingCalls||after.RemainingBytes!=before.RemainingBytes)throw new Exception("MCP startup consumed lease budget");

                  using var http=new HttpClient();
                  var body="{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"tools/list\",\"params\":{}}";
                  using var response=await http.PostAsync(grant.EndpointUrl,new StringContent(body,Encoding.UTF8,"application/json"));
                  var text=await response.Content.ReadAsStringAsync();
                  if(!response.IsSuccessStatusCode||!text.Contains("read_local_app_chunk",StringComparison.Ordinal)||!text.Contains("list_local_app_entries",StringComparison.Ordinal))throw new Exception("live tools/list mismatch");

                  await adapter.StopAsync(workspace,default);
                  var active=leases.ListActive(workspace,"alpha").Single(x=>x.LeaseId==created.Grant.LeaseId);
                  if(active.Revoked||active.RemainingCalls!=before.RemainingCalls||active.RemainingBytes!=before.RemainingBytes)throw new Exception("MCP stop changed lease authority/budget");
                  Console.WriteLine($"V0511_RUNTIME_PASS calls={active.RemainingCalls} bytes={active.RemainingBytes} tools={string.Join(',',grant.Tools)} tunnel=false");
              }
          }
          '@ | Set-Content (Join-Path $p 'Program.cs') -Encoding UTF8
          Push-Location $p
          try {
            dotnet restore Probe.csproj
            if($LASTEXITCODE -ne 0){throw 'probe restore failed'}
            dotnet run --project Probe.csproj -c Release --no-restore
            if($LASTEXITCODE -ne 0){throw 'clipboard/MCP runtime probe failed'}
          } finally { Pop-Location }

      - name: Verify public frontier remains v0.50.2
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $remote=(git ls-remote origin refs/heads/main).Split("`t")[0].Trim().ToLowerInvariant()
          if($remote -ne '632ddbb73e8d70b485f02d21f772674d429adf8c'){throw "remote main moved unexpectedly: $remote"}
          Write-Host "V0511_REMOTE_BOUNDARY_PASS main=$remote publicationDeferred=True"

      - name: Package source-only v0.51.1 candidate
        shell: pwsh
        id: package
        run: |
          $ErrorActionPreference='Stop'
          $stage=Join-Path $env:RUNNER_TEMP 'v0511-update'
          if(Test-Path $stage){Remove-Item $stage -Recurse -Force}
          $payload=Join-Path $stage 'payload';New-Item -ItemType Directory -Path $payload|Out-Null
          $files=@('PATCH-v0.51.1.md','src/Matawaka.Workbench.App/App.xaml.cs','src/Matawaka.Workbench.App/MainWindow.V0511.cs','src/Matawaka.Workbench.App/WorkbenchV0511AcceptanceHarness.cs','src/Matawaka.Workbench.App/LocalCheckpointV0511Service.cs')
          $items=@()
          foreach($file in $files){$src=Join-Path (Get-Location) ($file-replace'/',[IO.Path]::DirectorySeparatorChar);$dst=Join-Path $payload ($file-replace'/',[IO.Path]::DirectorySeparatorChar);New-Item -ItemType Directory -Path ([IO.Path]::GetDirectoryName($dst)) -Force|Out-Null;Copy-Item $src $dst -Force;$items += [ordered]@{Path=$file;Sha256=(Get-FileHash $src -Algorithm SHA256).Hash.ToLowerInvariant()}}
          $manifest=[ordered]@{Schema='matawaka.workbench-update-package/v0.10';PackageVersion='0.10';TargetVersion='0.51.1';PredecessorTag='workbench-v0.51-accepted';PredecessorCommit='a8a93143e942a02913475013e355d61b2fa6bee8';TargetTag='workbench-v0.51.1-accepted';PayloadRoot='payload/';Files=$items;NetworkAccessRequested=$false;CatalogMutationRequested=$false;AgentExecuteRequested=$false;ArbitraryProcessExecutionRequested=$false;InstallerScriptExecutionRequested=$false;NonEffects=@('source only','local v0.51 predecessor only','no private app bytes','no lease/bearer/clipboard/endpoint runtime bytes','no automatic Secure MCP Tunnel','no remote publication authority')}
          $manifest|ConvertTo-Json -Depth 8|Set-Content (Join-Path $stage 'workbench-update-manifest.json') -Encoding UTF8
          $zip=Join-Path $env:RUNNER_TEMP 'workbench-v0.51.1-read-lease-auto-mcp-update.zip'
          if(Test-Path $zip){Remove-Item $zip -Force}
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip -CompressionLevel Optimal
          $sha=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "zip=$zip" >> $env:GITHUB_OUTPUT
          "sha=$sha" >> $env:GITHUB_OUTPUT
          Write-Host "V0511_PACKAGE_PASS files=$($files.Count) sha256=$sha"

      - uses: actions/upload-artifact@v4
        with:
          name: workbench-v0.51.1-read-lease-auto-mcp-candidate
          path: ${{ steps.package.outputs.zip }}
          if-no-files-found: error
