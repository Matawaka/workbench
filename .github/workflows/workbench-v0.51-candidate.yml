          static string Hash(string path){using var stream=File.OpenRead(path);return Convert.ToHexString(SHA256.HashData(stream)).ToLowerInvariant();}

          var workspace=Path.Combine(Path.GetTempPath(),"matawaka-v051-"+Guid.NewGuid().ToString("N"));Directory.CreateDirectory(Path.Combine(workspace,"Workbench","artifacts"));
          var appRoot=Path.Combine(workspace,"Apps","alpha");var data=Path.Combine(appRoot,"data");var history=Path.Combine(data,"history");var many=Path.Combine(data,"many");Directory.CreateDirectory(history);Directory.CreateDirectory(many);
          File.WriteAllText(Path.Combine(appRoot,".matawaka-app.json"),JsonSerializer.Serialize(new LocalApplicationIdentity(LocalApplicationMaintenanceService.IdentitySchema,"alpha","1.0.0")),new UTF8Encoding(false));
          var statePath=Path.Combine(data,"state.json");File.WriteAllText(statePath,"{\"live\":\"browse-read\"}",new UTF8Encoding(false));File.WriteAllText(Path.Combine(data,"other.txt"),"other",new UTF8Encoding(false));File.WriteAllText(Path.Combine(history,"h1.txt"),"h1",new UTF8Encoding(false));for(var i=0;i<260;i++)File.WriteAllText(Path.Combine(many,$"f{i:D3}.txt"),i.ToString(),new UTF8Encoding(false));
          var leases=new LocalAppReadLeaseV048Service();
          async Task<LocalAppReadLeaseGrantV048> Create(string id,string scope,int perRead=65536,long total=262144,int calls=8,int ttl=300){var req=new LocalAppReadLeaseRequestV048(LocalAppReadLeaseV048Service.RequestSchema,id,"alpha",new[]{new LocalAppReadLeaseScopeV048("installed",scope)},perRead,total,calls,ttl);var preview=leases.Preview(workspace,"alpha",req,default);return(await leases.CreateAsync(workspace,"alpha",preview,false,default)).Grant;}

          var broad=await Create("lease:v051:broad","data/");
          var first=await leases.AuthorizeAndListAsync(workspace,new LocalAppLeaseListRequestV051(LocalAppReadLeaseV048Service.ListRequestSchemaV051,"list:v051:data",broad.LeaseId,broad.Bearer,"alpha","installed","data",0,64),default);
          if(first.Response.ReturnedEntries!=4||first.Response.Entries.Any(e=>e.RelativePath.Contains("h1.txt",StringComparison.Ordinal))||first.Response.RemainingCalls!=7||first.Response.RemainingBytes!=262144-first.Response.DisclosureBytes)throw new Exception("immediate-child list/accounting mismatch");
          if(!first.Response.Entries.Any(e=>e.RelativePath=="data/history/"&&e.Kind=="directory")||!first.Response.Entries.Any(e=>e.RelativePath=="data/state.json"&&e.Kind=="file"))throw new Exception("expected list entries missing");
          var nested=await leases.AuthorizeAndListAsync(workspace,new LocalAppLeaseListRequestV051(LocalAppReadLeaseV048Service.ListRequestSchemaV051,"list:v051:history",broad.LeaseId,broad.Bearer,"alpha","installed","data/history",0,64),default);if(nested.Response.ReturnedEntries!=1||nested.Response.Entries[0].RelativePath!="data/history/h1.txt"||nested.Response.RemainingCalls!=6)throw new Exception("nested list failed");
          var read=await leases.AuthorizeAndReadAsync(workspace,new LocalAppLeaseReadRequestV048(LocalAppReadLeaseV048Service.ReadRequestSchema,"read:v051:state",broad.LeaseId,broad.Bearer,"alpha","installed","data/state.json",0,1024,Hash(statePath)),default);if(read.Response.RemainingCalls!=5||read.Response.RemainingBytes!=nested.Response.RemainingBytes-read.Response.ReturnedBytes)throw new Exception("browse/read shared accounting mismatch");
          await ExpectRefusal(()=>leases.AuthorizeAndListAsync(workspace,new LocalAppLeaseListRequestV051(LocalAppReadLeaseV048Service.ListRequestSchemaV051,"list:v051:root",broad.LeaseId,broad.Bearer,"alpha","installed",".",0,10),default),"root list");
          await ExpectRefusal(()=>leases.AuthorizeAndListAsync(workspace,new LocalAppLeaseListRequestV051(LocalAppReadLeaseV048Service.ListRequestSchemaV051,"list:v051:wrongbearer",broad.LeaseId,new string('0',64),"alpha","installed","data",0,10),default),"wrong bearer");
          await ExpectRefusal(()=>leases.AuthorizeAndListAsync(workspace,new LocalAppLeaseListRequestV051(LocalAppReadLeaseV048Service.ListRequestSchemaV051,"list:v051:wrongrole",broad.LeaseId,broad.Bearer,"alpha","source","data",0,10),default),"wrong role");

          var exact=await Create("lease:v051:exact","data/state.json");await ExpectRefusal(()=>leases.AuthorizeAndListAsync(workspace,new LocalAppLeaseListRequestV051(LocalAppReadLeaseV048Service.ListRequestSchemaV051,"list:v051:exact",exact.LeaseId,exact.Bearer,"alpha","installed","data",0,10),default),"exact-file sibling list");
          var paged=await Create("lease:v051:paged","data/many/");var page1=await leases.AuthorizeAndListAsync(workspace,new LocalAppLeaseListRequestV051(LocalAppReadLeaseV048Service.ListRequestSchemaV051,"list:v051:page1",paged.LeaseId,paged.Bearer,"alpha","installed","data/many",0,256),default);if(page1.Response.ReturnedEntries!=256||page1.Response.NextStartIndex!=256)throw new Exception("256-entry page bound mismatch");var page2=await leases.AuthorizeAndListAsync(workspace,new LocalAppLeaseListRequestV051(LocalAppReadLeaseV048Service.ListRequestSchemaV051,"list:v051:page2",paged.LeaseId,paged.Bearer,"alpha","installed","data/many",256,256),default);if(page2.Response.ReturnedEntries!=4||page2.Response.NextStartIndex is not null)throw new Exception("pagination tail mismatch");await ExpectRefusal(()=>leases.AuthorizeAndListAsync(workspace,new LocalAppLeaseListRequestV051(LocalAppReadLeaseV048Service.ListRequestSchemaV051,"list:v051:257",paged.LeaseId,paged.Bearer,"alpha","installed","data/many",0,257),default),"entry ceiling");

          var byteLease=await Create("lease:v051:bytes","data/history/",128,128,4);var byteFirst=await leases.AuthorizeAndListAsync(workspace,new LocalAppLeaseListRequestV051(LocalAppReadLeaseV048Service.ListRequestSchemaV051,"list:v051:bytes1",byteLease.LeaseId,byteLease.Bearer,"alpha","installed","data/history",0,1),default);if(byteFirst.Response.DisclosureBytes<=0||byteFirst.Response.RemainingBytes>=128)throw new Exception("byte accounting did not consume");await ExpectRefusal(()=>leases.AuthorizeAndListAsync(workspace,new LocalAppLeaseListRequestV051(LocalAppReadLeaseV048Service.ListRequestSchemaV051,"list:v051:bytes2",byteLease.LeaseId,byteLease.Bearer,"alpha","installed","data/history",0,1),default),"byte exhaustion");var byteState=leases.ListActive(workspace,"alpha").Single(x=>x.LeaseId==byteLease.LeaseId);if(byteState.RemainingCalls!=3)throw new Exception("failed byte-exhausted list consumed call");
          var callLease=await Create("lease:v051:calls","data/history/",65536,262144,1);await leases.AuthorizeAndListAsync(workspace,new LocalAppLeaseListRequestV051(LocalAppReadLeaseV048Service.ListRequestSchemaV051,"list:v051:call1",callLease.LeaseId,callLease.Bearer,"alpha","installed","data/history",0,1),default);await ExpectRefusal(()=>leases.AuthorizeAndListAsync(workspace,new LocalAppLeaseListRequestV051(LocalAppReadLeaseV048Service.ListRequestSchemaV051,"list:v051:call2",callLease.LeaseId,callLease.Bearer,"alpha","installed","data/history",0,1),default),"call exhaustion");
          var expired=await Create("lease:v051:expired","data/history/",65536,262144,2,1);await Task.Delay(1300);await ExpectRefusal(()=>leases.AuthorizeAndListAsync(workspace,new LocalAppLeaseListRequestV051(LocalAppReadLeaseV048Service.ListRequestSchemaV051,"list:v051:expired",expired.LeaseId,expired.Bearer,"alpha","installed","data/history",0,1),default),"expired list");

          var outside=Path.Combine(workspace,"outside-junction-target");Directory.CreateDirectory(outside);File.WriteAllText(Path.Combine(outside,"secret.txt"),"outside");var link=Path.Combine(data,"junction");var psi=new ProcessStartInfo("cmd.exe"){UseShellExecute=false,RedirectStandardOutput=true,RedirectStandardError=true,CreateNoWindow=true};psi.ArgumentList.Add("/c");psi.ArgumentList.Add("mklink");psi.ArgumentList.Add("/J");psi.ArgumentList.Add(link);psi.ArgumentList.Add(outside);using(var proc=Process.Start(psi)??throw new Exception("junction process failed")){await proc.WaitForExitAsync();if(proc.ExitCode!=0)throw new Exception("junction creation failed: "+await proc.StandardError.ReadToEndAsync());}var reparseReq=new LocalAppReadLeaseRequestV048(LocalAppReadLeaseV048Service.RequestSchema,"lease:v051:reparse","alpha",new[]{new LocalAppReadLeaseScopeV048("installed","data/junction/")},65536,262144,2,300);try{leases.Preview(workspace,"alpha",reparseReq,default);throw new Exception("reparse scope unexpectedly admitted");}catch(InvalidDataException){}if(Directory.Exists(link))Directory.Delete(link);if(Directory.Exists(link))throw new Exception("junction cleanup failed");

          var revoked=await Create("lease:v051:revoke","data/");await leases.RevokeAllActiveAsync(workspace,"alpha",default);await ExpectRefusal(()=>leases.AuthorizeAndListAsync(workspace,new LocalAppLeaseListRequestV051(LocalAppReadLeaseV048Service.ListRequestSchemaV051,"list:v051:revoked",revoked.LeaseId,revoked.Bearer,"alpha","installed","data",0,10),default),"revoked list");

          var mcpLease=await Create("lease:v051:mcp","data/",65536,262144,8);var grantJson=LocalAppReadLeaseV048Service.SerializeGrant(mcpLease);var adapter=new LocalAppMcpReadAdapterV049Service();var adapterPreview=adapter.PreviewFromGrantJson(workspace,"alpha",grantJson,default);var adapterGrant=await adapter.StartAsync(workspace,"alpha",adapterPreview,grantJson,default);var facade=new PlainMcpOAuthDiscoveryCompatV0502Service();var facadeGrant=await facade.StartAsync("alpha",mcpLease.LeaseId,mcpLease.ExpiresAt,adapterGrant.EndpointUrl,default);var facadeUri=new Uri(facadeGrant.EndpointUrl);
          using(var http=new HttpClient()){var root=await http.GetAsync($"http://127.0.0.1:{facadeUri.Port}/.well-known/oauth-protected-resource");if(root.StatusCode!=HttpStatusCode.NotFound)throw new Exception("root PRMD regression");var specific=await http.GetAsync($"http://127.0.0.1:{facadeUri.Port}/.well-known/oauth-protected-resource{facadeUri.AbsolutePath}");if(specific.StatusCode!=HttpStatusCode.NotFound)throw new Exception("path PRMD regression");}
          var transport=new HttpClientTransport(new HttpClientTransportOptions{Endpoint=facadeUri,TransportMode=HttpTransportMode.StreamableHttp,EnableStandaloneGetStream=false});await using var client=await McpClient.CreateAsync(transport,new McpClientOptions{ClientInfo=new Implementation{Name="Matawaka-v0.51-qualification",Version="1.0"}});var tools=await client.ListToolsAsync();var names=tools.Select(t=>t.Name).OrderBy(x=>x,StringComparer.Ordinal).ToArray();if(names.Length!=2||names[0]!="list_local_app_entries"||names[1]!="read_local_app_chunk")throw new Exception("official client two-tool surface mismatch");
          var listed=await client.CallToolAsync("list_local_app_entries",new Dictionary<string,object?>{{"role","installed"},{"relativeDirectory","data"},{"startIndex",0},{"maxEntries",64}});if(listed.IsError is true)throw new Exception("official client browse unexpectedly refused");var listText=listed.Content.OfType<TextContentBlock>().Single().Text;using(var doc=JsonDocument.Parse(listText)){if(doc.RootElement.GetProperty("Schema").GetString()!=LocalAppMcpReadAdapterV049Service.ListResponseSchemaV051||!doc.RootElement.GetProperty("Entries").EnumerateArray().Any(e=>e.GetProperty("RelativePath").GetString()=="data/state.json"))throw new Exception("official MCP browse response mismatch");}
          var readTool=await client.CallToolAsync("read_local_app_chunk",new Dictionary<string,object?>{{"role","installed"},{"relativePath","data/state.json"},{"offset",0L},{"maxBytes",1024},{"expectedFileSha256",Hash(statePath)}});if(readTool.IsError is true||!readTool.Content.OfType<TextContentBlock>().Single().Text.Contains("browse-read",StringComparison.Ordinal))throw new Exception("official MCP read regression");await facade.StopAsync(default);await adapter.StopAsync(workspace,default);await leases.RevokeAllActiveAsync(workspace,"alpha",default);
          Console.WriteLine("V051_BROWSE_PASS immediateOnly=True nested=True exactFileSibling=False reparse=False pagination=256 byteAccounting=True callBudget=True expiry=True revoke=True tools=2 officialMcp=True prmd404=True");
          '@ | Set-Content (Join-Path $p 'Program.cs') -Encoding UTF8
          dotnet run --project (Join-Path $p 'Probe.csproj') -c Release
          if($LASTEXITCODE -ne 0){throw 'v0.51 browse/MCP integration failed'}

      - name: Remote prepublication boundary
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop';$remote='https://github.com/Matawaka/workbench.git';$main=((git ls-remote $remote refs/heads/main)-split '\s+')[0].ToLowerInvariant();if($main -ne '632ddbb73e8d70b485f02d21f772674d429adf8c'){throw "remote main moved: $main"};$baseCommit=(git rev-list -n 1 workbench-v0.50.2-accepted).Trim().ToLowerInvariant();if($baseCommit -ne $main){throw 'accepted v0.50.2 base tag peel mismatch'};foreach($tag in @('workbench-v0.49-accepted','workbench-v0.50-accepted','workbench-v0.50.1-accepted','workbench-v0.51-accepted')){if(@(git ls-remote $remote "refs/tags/$tag").Count -ne 0){throw "unexpected remote tag: $tag"}};Write-Host 'V051_REMOTE_PASS main=v0.50.2 failedTagsAbsent=True targetAbsent=True'

      - name: Package source-only v0.51 candidate
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop';Add-Type -AssemblyName System.IO.Compression.FileSystem
          $files=@('PATCH-v0.51.md','LOCAL-APP-LIVE-BROWSE.md','src/Matawaka.Workbench.App/App.xaml.cs','src/Matawaka.Workbench.App/LocalAppReadLeaseV048Service.cs','src/Matawaka.Workbench.App/LocalAppMcpReadAdapterV049Service.cs','src/Matawaka.Workbench.App/MainWindow.V051.cs','src/Matawaka.Workbench.App/WorkbenchV051AcceptanceHarness.cs','src/Matawaka.Workbench.App/LocalCheckpointV051Service.cs','src/Matawaka.Workbench.App/FixedGitHubPublicationV051Service.cs')
          $root=Join-Path $env:RUNNER_TEMP 'v051-package';$payload=Join-Path $root 'payload';if(Test-Path $root){Remove-Item $root -Recurse -Force};New-Item -ItemType Directory -Path $payload -Force|Out-Null;$mf=@();foreach($file in $files){$d=Join-Path $payload ($file-replace'/',[IO.Path]::DirectorySeparatorChar);New-Item -ItemType Directory -Path ([IO.Path]::GetDirectoryName($d)) -Force|Out-Null;Copy-Item $file $d;$mf+=[ordered]@{Path=$file;Sha256=(Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()}}
          $m=[ordered]@{Schema='matawaka.workbench-update-package/v0.10';PackageVersion='0.10';TargetVersion='0.51.0';PredecessorTag='workbench-v0.50.2-accepted';PredecessorCommit='632ddbb73e8d70b485f02d21f772674d429adf8c';TargetTag='workbench-v0.51-accepted';PayloadRoot='payload/';Files=$mf;NetworkAccessRequested=$false;CatalogMutationRequested=$false;AgentExecuteRequested=$false;ArbitraryProcessExecutionRequested=$false;InstallerScriptExecutionRequested=$false;NonEffects=@('source only','no private app bytes','no runtime lease/bearer/tunnel credentials','no new OAuth/tunnel authority','browse remains directory-prefix lease-gated')};[IO.File]::WriteAllText((Join-Path $root 'workbench-update-manifest.json'),($m|ConvertTo-Json -Depth 8),[Text.UTF8Encoding]::new($false))
          $zip=Join-Path $env:RUNNER_TEMP 'workbench-v0.51-live-app-browse-candidate.zip';if(Test-Path $zip){Remove-Item $zip -Force};[IO.Compression.ZipFile]::CreateFromDirectory($root,$zip,[IO.Compression.CompressionLevel]::Optimal,$false);$sha=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant();$size=(Get-Item $zip).Length;$entries=[IO.Compression.ZipFile]::OpenRead($zip);try{$names=@($entries.Entries|% FullName);if($names.Count -ne ($files.Count+1)){throw "unexpected zip entries: $($names.Count)"};if($names -contains '.github/workflows/workbench-v0.51-candidate.yml'){throw 'workflow leaked into package'}}finally{$entries.Dispose()};"PACKAGE_SHA256=$sha"|Out-File $env:GITHUB_ENV -Append;"PACKAGE_SIZE=$size"|Out-File $env:GITHUB_ENV -Append;"PACKAGE_PATH=$zip"|Out-File $env:GITHUB_ENV -Append;Write-Host "V051_PACKAGE_PASS sha256=$sha bytes=$size payloadFiles=$($files.Count) authorityFlags=false"

      - name: Upload candidate
        uses: actions/upload-artifact@v4
        with:
          name: workbench-v0.51-live-app-browse-candidate
          path: ${{ env.PACKAGE_PATH }}
          if-no-files-found: error
