name: Workbench v0.51 lease-gated live app browse candidate

on:
  push:
    branches: [feat/workbench-v0.51-live-app-browse]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build and static browse-authority checks
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          dotnet restore Matawaka.Workbench.sln
          if($LASTEXITCODE -ne 0){throw 'v0.51 restore failed'}
          dotnet build Matawaka.Workbench.sln -c Release --no-restore -warnaserror
          if($LASTEXITCODE -ne 0){throw 'v0.51 Release build failed'}
          $app=Get-Content 'src/Matawaka.Workbench.App/App.xaml.cs' -Raw
          if(-not $app.Contains('ConfigureV051Routing()', [StringComparison]::Ordinal)){throw 'v0.51 startup routing missing'}
          $xaml=Get-Content 'src/Matawaka.Workbench.App/MainWindow.xaml' -Raw
          $surface=[regex]::Match($xaml,'<WrapPanel x:Name="PrimaryMaintenanceSurface"[\s\S]*?</WrapPanel>').Value
          if([regex]::Matches($surface,'<Button\b').Count -ne 4){throw 'top-level surface is not exactly four buttons'}
          $lease=Get-Content 'src/Matawaka.Workbench.App/LocalAppReadLeaseV048Service.cs' -Raw
          foreach($m in @('AuthorizeAndListAsync','ScopeAllowsDirectory','MaxListEntriesV051 = 256','MaxListDisclosureBytesV051 = 64 * 1024','Application-root listing is not authorized','exact-file scopes do not authorize sibling enumeration','RejectReparse(entry.FullName','RemainingCalls = remainingCalls','RemainingBytes = remainingBytes')){if(-not $lease.Contains($m,[StringComparison]::Ordinal)){throw "lease browse marker missing: $m"}}
          $adapter=Get-Content 'src/Matawaka.Workbench.App/LocalAppMcpReadAdapterV049Service.cs' -Raw
          foreach($m in @('read_local_app_chunk','list_local_app_entries','ToolSurfaceVersionV051 = "0.51.0"','ListToolEnvelopeAsync','openWorldHint')){if(-not $adapter.Contains($m,[StringComparison]::Ordinal)){throw "MCP browse marker missing: $m"}}
          $toolBlock=[regex]::Match($adapter,'private static Dictionary<string, object\?> BuildToolsListResult\(\)[\s\S]*?return new Dictionary<string, object\?> \{ \["tools"\]').Value
          if([string]::IsNullOrWhiteSpace($toolBlock)){throw 'v0.51 tool schema block not found'}
          foreach($forbiddenArg in @('ApplicationId','LeaseId','Bearer','WorkspaceRoot','AbsolutePath','recursive','glob')){if($toolBlock.Contains('["'+$forbiddenArg+'"]',[StringComparison]::Ordinal)){throw "forbidden caller-selectable browse authority arg: $forbiddenArg"}}
          foreach($requiredArg in @('"role"','"relativeDirectory"','"startIndex"','"maxEntries"')){if(-not $toolBlock.Contains($requiredArg,[StringComparison]::Ordinal)){throw "required browse arg missing: $requiredArg"}}
          $cp=Get-Content 'src/Matawaka.Workbench.App/LocalCheckpointV051Service.cs' -Raw
          if(-not $cp.Contains('632ddbb73e8d70b485f02d21f772674d429adf8c')){throw 'v0.51 predecessor binding missing'}
          $pub=Get-Content 'src/Matawaka.Workbench.App/FixedGitHubPublicationV051Service.cs' -Raw
          foreach($m in @('ExpectedRemoteBase = "632ddbb73e8d70b485f02d21f772674d429adf8c"','AcceptedTag = "workbench-v0.51-accepted"','FailedRemoteTagV0501 = "workbench-v0.50.1-accepted"')){if(-not $pub.Contains($m,[StringComparison]::Ordinal)){throw "v0.51 publication marker missing: $m"}}
          Write-Host 'V051_STATIC_PASS build=True buttons=4 dirPrefixOnly=True exactFileSiblingBrowse=False rootBrowse=False recursive=False tools=2'

      - name: Prove exact accepted v0.50.2 builds v0.51 overlay with no restore
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $candidate=(Get-Location).Path;$overlay=Join-Path $env:RUNNER_TEMP 'overlay-v051'
          if(Test-Path $overlay){Remove-Item $overlay -Recurse -Force}
          git worktree add --detach $overlay 632ddbb73e8d70b485f02d21f772674d429adf8c
          if($LASTEXITCODE -ne 0){throw 'accepted v0.50.2 predecessor unavailable'}
          $files=@('PATCH-v0.51.md','LOCAL-APP-LIVE-BROWSE.md','src/Matawaka.Workbench.App/App.xaml.cs','src/Matawaka.Workbench.App/LocalAppReadLeaseV048Service.cs','src/Matawaka.Workbench.App/LocalAppMcpReadAdapterV049Service.cs','src/Matawaka.Workbench.App/MainWindow.V051.cs','src/Matawaka.Workbench.App/WorkbenchV051AcceptanceHarness.cs','src/Matawaka.Workbench.App/LocalCheckpointV051Service.cs','src/Matawaka.Workbench.App/FixedGitHubPublicationV051Service.cs')
          try {
            Push-Location $overlay;dotnet restore Matawaka.Workbench.sln;if($LASTEXITCODE -ne 0){throw 'accepted v0.50.2 restore failed'};Pop-Location
            foreach($file in $files){$src=Join-Path $candidate ($file-replace'/',[IO.Path]::DirectorySeparatorChar);$dst=Join-Path $overlay ($file-replace'/',[IO.Path]::DirectorySeparatorChar);New-Item -ItemType Directory -Path ([IO.Path]::GetDirectoryName($dst)) -Force|Out-Null;Copy-Item $src $dst -Force}
            Push-Location $overlay;dotnet build Matawaka.Workbench.sln -c Release --no-restore -warnaserror;if($LASTEXITCODE -ne 0){throw 'v0.51 overlay --no-restore build failed'};Pop-Location
            Write-Host "V051_NO_RESTORE_PASS predecessor=v0.50.2 successorFiles=$($files.Count)"
          } finally {if((Get-Location).Path -eq $overlay){Pop-Location};git worktree remove --force $overlay 2>$null}

      - name: Execute browse lease controls and official MCP 2.2.0 interoperability
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $p=Join-Path $env:RUNNER_TEMP 'v051-probe';if(Test-Path $p){Remove-Item $p -Recurse -Force};New-Item -ItemType Directory -Path $p|Out-Null
          $appProject=(Resolve-Path 'src/Matawaka.Workbench.App/Matawaka.Workbench.App.csproj').Path;$escaped=[Security.SecurityElement]::Escape($appProject)
          @"
          <Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><OutputType>Exe</OutputType><TargetFramework>net10.0-windows</TargetFramework><UseWPF>true</UseWPF><ImplicitUsings>enable</ImplicitUsings><Nullable>enable</Nullable><TreatWarningsAsErrors>true</TreatWarningsAsErrors></PropertyGroup><ItemGroup><ProjectReference Include="$escaped" /><PackageReference Include="ModelContextProtocol" Version="2.2.0" /></ItemGroup></Project>
          "@ | Set-Content (Join-Path $p 'Probe.csproj') -Encoding UTF8
          @'
          using System.Diagnostics;
          using System.Net;
          using System.Security.Cryptography;
          using System.Text;
          using System.Text.Json;
          using Matawaka.Workbench.App;
          using ModelContextProtocol.Client;
          using ModelContextProtocol.Protocol;

