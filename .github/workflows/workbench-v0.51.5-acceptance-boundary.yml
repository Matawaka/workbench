name: Workbench v0.51.5 acceptance boundary

on:
  push:
    branches: [feat/workbench-v0.51.5-verified-active-lease-index]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build and verify first-boot acceptance boundary
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          dotnet restore Matawaka.Workbench.sln
          if($LASTEXITCODE -ne 0){throw 'restore failed'}
          dotnet build Matawaka.Workbench.sln -c Release --no-restore -warnaserror
          if($LASTEXITCODE -ne 0){throw 'Release build failed'}

          $app=Get-Content 'src/Matawaka.Workbench.App/App.xaml.cs' -Raw
          foreach($m in @('ConfigureV0515Routing()','ConfigureV0515AcceptanceRouting()')){
            if(-not $app.Contains($m,[StringComparison]::Ordinal)){throw "startup acceptance marker missing: $m"}
          }
          $cp=Get-Content 'src/Matawaka.Workbench.App/LocalCheckpointV0515Service.cs' -Raw
          foreach($m in @('workbench-v0.51.4-accepted','workbench-v0.51.5-accepted','v0.51.5-source-manifest*.json','PredecessorGitSha','matawaka.workbench-local-checkpoint-receipt/v0.51.5')){
            if(-not $cp.Contains($m,[StringComparison]::Ordinal)){throw "checkpoint marker missing: $m"}
          }
          $acc=Get-Content 'src/Matawaka.Workbench.App/MainWindow.V0515.Acceptance.cs' -Raw
          foreach($m in @('Window_LoadedV0515','RunV0515AcceptanceArtifactAsync','AcceptFromBootstrapAsync','PublishAcceptedV0515Button_Click','AutomaticReconciliationPerformedAtFirstBoot = false','HistoricalEvidenceDeletionOrCompaction = false','FastStatusCanonicalHistoricalScanPerformed = false')){
            if(-not $acc.Contains($m,[StringComparison]::Ordinal)){throw "acceptance marker missing: $m"}
          }
          $h=Get-Content 'src/Matawaka.Workbench.App/WorkbenchV0515AcceptanceHarness.cs' -Raw
          foreach($m in @('LocalAppActiveLeaseIndexV0515Service.RunOfflineContractChecks','LocalAppReadLeaseIndexedLifecycleV0515Service.RunOfflineContractChecks','ObserveV0515VerifiedIndexContract','acceptance-receipt/v0.51.5')){
            if(-not $h.Contains($m,[StringComparison]::Ordinal)){throw "harness marker missing: $m"}
          }
          Write-Host 'V0515_ACCEPTANCE_BOUNDARY_PASS bootstrap=one-shot checkpoint=dual-bound reconciliation=explicit publish=deferred'
