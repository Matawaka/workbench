name: Workbench v0.51.7 exact local predecessor package

on:
  push:
    branches: [feat/workbench-v0.51.7-cross-process-mcp-session-ownership]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build exact source candidate
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          dotnet restore Matawaka.Workbench.sln
          if($LASTEXITCODE -ne 0){throw 'v0.51.7 restore failed'}
          dotnet build Matawaka.Workbench.sln -c Release --no-restore -warnaserror
          if($LASTEXITCODE -ne 0){throw 'v0.51.7 Release build failed'}

          $app=Get-Content 'src/Matawaka.Workbench.App/App.xaml.cs' -Raw
          foreach($m in @('ConfigureV0517Routing()','ConfigureV0517AcceptanceRouting()')){
            if(-not $app.Contains($m,[StringComparison]::Ordinal)){throw "v0.51.7 routing marker missing: $m"}
          }
          $owner=Get-Content 'src/Matawaka.Workbench.App/LocalAppMcpSessionOwnershipV0517Service.cs' -Raw
          foreach($m in @('FileShare.None','MCP_SESSION_OWNED_BY_OTHER_PROCESS','MCP_SESSION_RELEASE_REFUSED_LISTENER_STILL_ACTIVE','BearerPlaintextStored','BearerHashStored','EndpointSecretStored','LeaseAuthorityGranted')){
            if(-not $owner.Contains($m,[StringComparison]::Ordinal)){throw "v0.51.7 owner marker missing: $m"}
          }
          $cp=Get-Content 'src/Matawaka.Workbench.App/LocalCheckpointV0517Service.cs' -Raw
          foreach($m in @('workbench-v0.51.6-accepted','workbench-v0.51.7-accepted','v0.51.7-source-manifest*.json','PredecessorGitSha')){
            if(-not $cp.Contains($m,[StringComparison]::Ordinal)){throw "v0.51.7 checkpoint marker missing: $m"}
          }
          $acc=Get-Content 'src/Matawaka.Workbench.App/MainWindow.V0517.Acceptance.cs' -Raw
          foreach($m in @('RunV0517AcceptanceArtifactAsync','AcceptFromBootstrapAsync','OwnerCrashRevokesCanonicalLease = false','AutomaticPublishPerformed = false')){
            if(-not $acc.Contains($m,[StringComparison]::Ordinal)){throw "v0.51.7 acceptance marker missing: $m"}
          }
          Write-Host 'V0517_EXACT_PACKAGE_BUILD_PASS'

      - name: Verify public publication remains deferred
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $remote=(git ls-remote origin refs/heads/main).Split("`t")[0].Trim().ToLowerInvariant()
          if($remote -ne '632ddbb73e8d70b485f02d21f772674d429adf8c'){throw "remote main moved unexpectedly: $remote"}
          Write-Host "V0517_REMOTE_BOUNDARY_PASS main=$remote publicationDeferred=True"

      - name: Package exact local predecessor update
        id: pack
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $predecessor='cde3e6fb494625ef0412c85fc432c9a66e5de0a4'
          $stage=Join-Path $env:RUNNER_TEMP 'v0517-exact-update'
          if(Test-Path $stage){Remove-Item $stage -Recurse -Force}
          $payload=Join-Path $stage 'payload'
          New-Item -ItemType Directory -Path $payload|Out-Null

          $files=@(
            'PATCH-v0.51.7.md',
            'src/Matawaka.Workbench.App/App.xaml.cs',
            'src/Matawaka.Workbench.App/LocalAppMcpSessionOwnershipV0517Service.cs',
            'src/Matawaka.Workbench.App/LocalCheckpointV0517Service.cs',
            'src/Matawaka.Workbench.App/MainWindow.V0517.Acceptance.cs',
            'src/Matawaka.Workbench.App/MainWindow.V0517.cs',
            'src/Matawaka.Workbench.App/WorkbenchV0517AcceptanceHarness.cs'
          )

          $items=@()
          foreach($file in $files){
            $src=Join-Path (Get-Location) ($file -replace '/', [IO.Path]::DirectorySeparatorChar)
            if(-not (Test-Path $src -PathType Leaf)){throw "missing v0.51.7 payload file: $file"}
            $dst=Join-Path $payload ($file -replace '/', [IO.Path]::DirectorySeparatorChar)
            New-Item -ItemType Directory -Path ([IO.Path]::GetDirectoryName($dst)) -Force|Out-Null
            Copy-Item $src $dst -Force
            $items += [ordered]@{Path=$file;Sha256=(Get-FileHash $src -Algorithm SHA256).Hash.ToLowerInvariant()}
          }

          $manifest=[ordered]@{
            Schema='matawaka.workbench-update-package/v0.10'
            PackageVersion='0.10'
            TargetVersion='0.51.7'
            PredecessorTag='workbench-v0.51.6-accepted'
            PredecessorCommit=$predecessor
            TargetTag='workbench-v0.51.7-accepted'
            PayloadRoot='payload/'
            Files=$items
            NetworkAccessRequested=$false
            CatalogMutationRequested=$false
            AgentExecuteRequested=$false
            ArbitraryProcessExecutionRequested=$false
            InstallerScriptExecutionRequested=$false
            NonEffects=@(
              'source only',
              'exact local v0.51.6 predecessor only',
              'MCP ownership is app-scoped runtime serialization only and grants no lease/read authority',
              'canonical v0.48 lease state remains authority source of truth',
              'v0.51.5 active index remains derived only and v0.51.6 cross-process index fence is preserved',
              'same-app ownership contention fails before replacement lease creation',
              'owner crash releases runtime ownership only and does not revoke or resume canonical lease authority',
              'no bearer plaintext/hash or endpoint path token in owner metadata/receipt payload',
              'no historical evidence deletion or compaction',
              'no private app bytes',
              'no runtime lease/index/fence/MCP owner/clipboard endpoint state',
              'no automatic Secure MCP Tunnel',
              'no OpenAI bridge dependency',
              'no remote publication authority',
              'no CI workflow or qualification fixture files in payload'
            )
          }
          $manifest|ConvertTo-Json -Depth 8|Set-Content (Join-Path $stage 'workbench-update-manifest.json') -Encoding UTF8

          $zip=Join-Path $env:RUNNER_TEMP 'workbench-v0.51.7-cross-process-mcp-session-ownership-update.zip'
          if(Test-Path $zip){Remove-Item $zip -Force}
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip -CompressionLevel Optimal
          $sha=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "zip=$zip" >> $env:GITHUB_OUTPUT
          "sha=$sha" >> $env:GITHUB_OUTPUT
          Write-Host "V0517_PACKAGE_PASS predecessor=$predecessor files=$($files.Count) sha256=$sha"

      - uses: actions/upload-artifact@v4
        with:
          name: workbench-v0.51.7-exact-local-update
          path: ${{ steps.pack.outputs.zip }}
          if-no-files-found: error
