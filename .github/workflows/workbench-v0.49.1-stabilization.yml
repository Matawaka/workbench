name: Workbench v0.49.1 MCP runtime closure qualification

on:
  push:
    branches: [stabilize/workbench-v0.49.1-mcp-runtime-closure]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build and dependency closure
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          dotnet restore Matawaka.Workbench.sln
          dotnet build Matawaka.Workbench.sln -c Release --no-restore -warnaserror
          if ($LASTEXITCODE -ne 0) { throw 'build failed' }
          $project=Get-Content 'src/Matawaka.Workbench.App/Matawaka.Workbench.App.csproj' -Raw
          if ($project.Contains('Microsoft.AspNetCore',[StringComparison]::Ordinal) -or $project.Contains('ModelContextProtocol',[StringComparison]::Ordinal)) { throw 'product runtime dependency expansion detected' }
          $adapter=Get-Content 'src/Matawaka.Workbench.App/LocalAppMcpReadAdapterV049Service.cs' -Raw
          foreach($m in @('TcpListener(IPAddress.Loopback, 0)','MaxHttpHeaderBytes = 16 * 1024','MaxProtocolRequestBytes = 64 * 1024','MaxHttpTrailerBytes = 4 * 1024','ReadChunkedBodyAsync','Transfer-Encoding','read_local_app_chunk','REFUSED_BY_ACTIVE_READ_LEASE')) { if(-not $adapter.Contains($m,[StringComparison]::Ordinal)){throw "missing $m"} }
          foreach($m in @('Microsoft.AspNetCore','WebApplication','Kestrel','IPAddress.Any','IPAddress.IPv6Any')) { if($adapter.Contains($m,[StringComparison]::Ordinal)){throw "forbidden $m"} }
          $out=Join-Path $env:RUNNER_TEMP 'publish-v0491'
          dotnet publish src/Matawaka.Workbench.App/Matawaka.Workbench.App.csproj -c Release --no-restore -o $out
          $deps=Get-Content (Join-Path $out 'Matawaka.Workbench.App.deps.json') -Raw
          if($deps.Contains('Microsoft.AspNetCore',[StringComparison]::Ordinal)){throw 'published deps include ASP.NET Core'}
          if(@(Get-ChildItem $out -Filter 'Microsoft.AspNetCore*.dll' -File).Count -ne 0){throw 'published output includes ASP.NET Core dlls'}
          Write-Host 'V0491_CLOSURE_PASS build=True aspnet=False mcpRuntimePackage=False tcpLoopback=True chunkedBounded=True'

      - name: Prove failed v0.49 source tree accepts stabilization with no restore
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $candidate=(Get-Location).Path
          $overlay=Join-Path $env:RUNNER_TEMP 'overlay-v0491'
          git worktree add --detach $overlay 7445fba8b0317a69074960612fa0c018db50c70a
          try {
            Push-Location $overlay
            dotnet restore Matawaka.Workbench.sln
            Pop-Location
            foreach($file in @('src/Matawaka.Workbench.App/Matawaka.Workbench.App.csproj','src/Matawaka.Workbench.App/LocalAppMcpReadAdapterV049Service.cs','src/Matawaka.Workbench.App/WorkbenchV049AcceptanceHarness.cs')) {
              Copy-Item (Join-Path $candidate ($file -replace '/', [IO.Path]::DirectorySeparatorChar)) (Join-Path $overlay ($file -replace '/', [IO.Path]::DirectorySeparatorChar)) -Force
            }
            Push-Location $overlay
            dotnet build Matawaka.Workbench.sln -c Release --no-restore -warnaserror
            if($LASTEXITCODE -ne 0){throw 'no-restore stabilization failed'}
            Pop-Location
            Write-Host 'V0491_NO_RESTORE_PASS sourceTree=failed-v0.49'
          } finally { if((Get-Location).Path -eq $overlay){Pop-Location}; git worktree remove --force $overlay 2>$null }

      - name: Official MCP 2.2.0 client interoperability
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $probe=Join-Path $env:RUNNER_TEMP 'mcp-v0491-probe'
          New-Item -ItemType Directory -Path $probe -Force | Out-Null
          $appProject=(Resolve-Path 'src/Matawaka.Workbench.App/Matawaka.Workbench.App.csproj').Path
          $escaped=[Security.SecurityElement]::Escape($appProject)
          @"
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup><OutputType>Exe</OutputType><TargetFramework>net10.0-windows</TargetFramework><UseWPF>true</UseWPF><ImplicitUsings>enable</ImplicitUsings><Nullable>enable</Nullable></PropertyGroup>
            <ItemGroup><ProjectReference Include="$escaped" /><PackageReference Include="ModelContextProtocol" Version="2.2.0" /></ItemGroup>
          </Project>
          "@ | Set-Content (Join-Path $probe 'Probe.csproj') -Encoding UTF8
          @'
          using System.IO;
          using System.Security.Cryptography;
          using System.Text;
          using System.Text.Json;
          using Matawaka.Workbench.App;
          using ModelContextProtocol.Client;
          using ModelContextProtocol.Protocol;

          static class Program {
            static string Hash(string p){using var s=File.OpenRead(p); return Convert.ToHexString(SHA256.HashData(s)).ToLowerInvariant();}
            static async Task Main(){
              var w=Path.Combine(Path.GetTempPath(),"v0491-"+Guid.NewGuid().ToString("N")); Directory.CreateDirectory(Path.Combine(w,"Workbench","artifacts"));
              var a=Path.Combine(w,"Apps","alpha"); Directory.CreateDirectory(Path.Combine(a,"data"));
              File.WriteAllText(Path.Combine(a,".matawaka-app.json"),JsonSerializer.Serialize(new LocalApplicationIdentity(LocalApplicationMaintenanceService.IdentitySchema,"alpha","1.0.0")),new UTF8Encoding(false));
              var state=Path.Combine(a,"data","state.json"); File.WriteAllText(state,"{\"private\":\"MCP-LEASE-SECRET\"}",new UTF8Encoding(false));
              var outside=Path.Combine(a,"data","outside.txt"); File.WriteAllText(outside,"outside",new UTF8Encoding(false));
              var sr=Path.Combine(w,"AppSources","alpha"); Directory.CreateDirectory(Path.Combine(sr,"web")); File.WriteAllText(Path.Combine(sr,".matawaka-source.json"),"{}",new UTF8Encoding(false));
              var source=Path.Combine(sr,"web","app.js"); File.WriteAllText(source,"source-v0491",new UTF8Encoding(false));
              var ls=new LocalAppReadLeaseV048Service();
              var req=new LocalAppReadLeaseRequestV048(LocalAppReadLeaseV048Service.RequestSchema,"lease:v0491","alpha",new[]{new LocalAppReadLeaseScopeV048("installed","data/state.json"),new LocalAppReadLeaseScopeV048("source","web/")},1024,8192,8,300);
              var lp=ls.Preview(w,"alpha",req,default); var created=await ls.CreateAsync(w,"alpha",lp,false,default); var gj=LocalAppReadLeaseV048Service.SerializeGrant(created.Grant);
              var ad=new LocalAppMcpReadAdapterV049Service(); var ap=ad.PreviewFromGrantJson(w,"alpha",gj,default); var ag=await ad.StartAsync(w,"alpha",ap,gj,default);
              var transport=new HttpClientTransport(new HttpClientTransportOptions{Endpoint=new Uri(ag.EndpointUrl),TransportMode=HttpTransportMode.StreamableHttp,EnableStandaloneGetStream=false});
              await using var client=await McpClient.CreateAsync(transport,new McpClientOptions{ClientInfo=new Implementation{Name="v0491",Version="1"}});
              var tools=await client.ListToolsAsync(); if(tools.Count!=1||tools[0].Name!="read_local_app_chunk") throw new Exception("tools mismatch");
              var ok=await client.CallToolAsync("read_local_app_chunk",new Dictionary<string,object?>{{"role","installed"},{"relativePath","data/state.json"},{"offset",0L},{"maxBytes",1024},{"expectedFileSha256",Hash(state)}}); if(ok.IsError is true||!ok.Content.OfType<TextContentBlock>().Single().Text.Contains("MCP-LEASE-SECRET"))throw new Exception("installed failed");
              var src=await client.CallToolAsync("read_local_app_chunk",new Dictionary<string,object?>{{"role","source"},{"relativePath","web/app.js"},{"offset",0L},{"maxBytes",1024},{"expectedFileSha256",Hash(source)}}); if(src.IsError is true)throw new Exception("source failed");
              var outscope=await client.CallToolAsync("read_local_app_chunk",new Dictionary<string,object?>{{"role","installed"},{"relativePath","data/outside.txt"},{"offset",0L},{"maxBytes",32},{"expectedFileSha256",Hash(outside)}}); if(outscope.IsError is not true)throw new Exception("scope not refused");
              var injected=await client.CallToolAsync("read_local_app_chunk",new Dictionary<string,object?>{{"role","installed"},{"relativePath","data/state.json"},{"offset",0L},{"maxBytes",32},{"ApplicationId","other"}}); if(injected.IsError is not true)throw new Exception("authority not refused");
              var stale=await client.CallToolAsync("read_local_app_chunk",new Dictionary<string,object?>{{"role","installed"},{"relativePath","data/state.json"},{"offset",0L},{"maxBytes",32},{"expectedFileSha256",new string('0',64)}}); if(stale.IsError is not true)throw new Exception("stale not refused");
              var rv=await ls.RevokeAllActiveAsync(w,"alpha",default); if(rv.Receipt.RevokedLeases!=1)throw new Exception("revoke failed");
              var denied=await client.CallToolAsync("read_local_app_chunk",new Dictionary<string,object?>{{"role","installed"},{"relativePath","data/state.json"},{"offset",0L},{"maxBytes",32}}); if(denied.IsError is not true)throw new Exception("revoked not refused");
              await client.DisposeAsync(); var stop=await ad.StopAsync(w,default); if(!stop.Receipt.ListenerStopped||ad.IsActiveFor("alpha"))throw new Exception("stop failed");
              Directory.Delete(w,true); Console.WriteLine("V0491_INTEROP_PASS officialClient=2.2.0 chunked=True installed=True source=True negatives=True revoke=True stop=True");
            }
          }
          '@ | Set-Content (Join-Path $probe 'Program.cs') -Encoding UTF8
          dotnet run --project (Join-Path $probe 'Probe.csproj') -c Release
          if($LASTEXITCODE -ne 0){throw 'interop failed'}

      - name: Remote accepted frontier unchanged
        shell: pwsh
        run: |
          $main=((git ls-remote https://github.com/Matawaka/workbench.git refs/heads/main) -split '\s+')[0].ToLowerInvariant()
          if($main -ne '2b0e3127e3c0284ff569720d85889cec3374f053'){throw "main moved: $main"}
          Write-Host 'V0491_REMOTE_PASS main=v0.48'
