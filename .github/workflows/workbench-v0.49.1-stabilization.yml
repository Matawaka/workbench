name: Workbench v0.49.1 MCP runtime closure qualification

on:
  push:
    branches:
      - stabilize/workbench-v0.49.1-mcp-runtime-closure
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore and build stabilization zero warnings
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet restore Matawaka.Workbench.sln
          if ($LASTEXITCODE -ne 0) { throw 'restore failed' }
          dotnet build Matawaka.Workbench.sln -c Release --no-restore -warnaserror
          if ($LASTEXITCODE -ne 0) { throw 'Release build failed' }

      - name: Verify base-dotnet runtime closure and authority surface
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $csproj = Get-Content 'src/Matawaka.Workbench.App/Matawaka.Workbench.App.csproj' -Raw
          if ($csproj.Contains('Microsoft.AspNetCore', [StringComparison]::Ordinal)) { throw 'product project still depends on Microsoft.AspNetCore' }
          if ($csproj.Contains('ModelContextProtocol', [StringComparison]::Ordinal)) { throw 'product project still depends on MCP NuGet' }

          $adapter = Get-Content 'src/Matawaka.Workbench.App/LocalAppMcpReadAdapterV049Service.cs' -Raw
          foreach ($required in @(
            'TcpListener(IPAddress.Loopback, 0)',
            'MaxHttpHeaderBytes = 16 * 1024',
            'MaxProtocolRequestBytes = 64 * 1024',
            'Transfer-Encoding/chunked requests are not admitted',
            'read_local_app_chunk',
            'LocalAppReadLeaseV048Service.ReadRequestSchema',
            'REFUSED_BY_ACTIVE_READ_LEASE',
            'RandomNumberGenerator.GetBytes(32)'
          )) {
            if (-not $adapter.Contains($required, [StringComparison]::Ordinal)) { throw "missing stabilization marker: $required" }
          }
          foreach ($forbidden in @('Microsoft.AspNetCore','WebApplication','Kestrel','IPAddress.Any','IPAddress.IPv6Any','ListenAnyIP')) {
            if ($adapter.Contains($forbidden, [StringComparison]::Ordinal)) { throw "forbidden runtime dependency/listener marker: $forbidden" }
          }

          $toolBlock = [regex]::Match($adapter, 'private static Dictionary<string, object\?> BuildToolsListResult\(\)[\s\S]*?return new Dictionary<string, object\?> \{ \["tools"\]').Value
          if ([string]::IsNullOrWhiteSpace($toolBlock)) { throw 'tool schema block missing' }
          foreach ($forbiddenArg in @('ApplicationId','LeaseId','Bearer','WorkspaceRoot','AbsolutePath')) {
            if ($toolBlock.Contains('["' + $forbiddenArg + '"]', [StringComparison]::Ordinal)) { throw "caller authority argument exposed: $forbiddenArg" }
          }
          Write-Host 'V0491_STATIC_PASS baseDotNet=True aspnet=False mcpRuntimeNuget=False loopback=True boundedHttp=True'

      - name: Prove failed v0.49 tree can build stabilization overlay with no restore
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $candidate = (Get-Location).Path
          $overlay = Join-Path $env:RUNNER_TEMP 'workbench-v0491-no-restore-overlay'
          if (Test-Path $overlay) { Remove-Item $overlay -Recurse -Force }
          git worktree add --detach $overlay 7445fba8b0317a69074960612fa0c018db50c70a
          if ($LASTEXITCODE -ne 0) { throw 'unable to materialize exact failed v0.49 source tree' }
          try {
            Push-Location $overlay
            dotnet restore Matawaka.Workbench.sln
            if ($LASTEXITCODE -ne 0) { throw 'v0.49 predecessor restore failed' }
            Pop-Location
            foreach ($file in @(
              'src/Matawaka.Workbench.App/Matawaka.Workbench.App.csproj',
              'src/Matawaka.Workbench.App/LocalAppMcpReadAdapterV049Service.cs',
              'src/Matawaka.Workbench.App/WorkbenchV049AcceptanceHarness.cs'
            )) {
              $src = Join-Path $candidate ($file -replace '/', [IO.Path]::DirectorySeparatorChar)
              $dst = Join-Path $overlay ($file -replace '/', [IO.Path]::DirectorySeparatorChar)
              Copy-Item -LiteralPath $src -Destination $dst -Force
            }
            Push-Location $overlay
            dotnet build Matawaka.Workbench.sln -c Release --no-restore -warnaserror
            if ($LASTEXITCODE -ne 0) { throw 'stabilization overlay failed no-restore build' }
            Pop-Location
            Write-Host 'V0491_NO_RESTORE_PASS predecessorTree=7445fba8 overlay=runtimeClosure'
          }
          finally {
            if ((Get-Location).Path -eq $overlay) { Pop-Location }
            git worktree remove --force $overlay 2>$null
          }

      - name: Prove published product dependency closure excludes ASP.NET Core
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'v0491-publish'
          if (Test-Path $out) { Remove-Item $out -Recurse -Force }
          dotnet publish src/Matawaka.Workbench.App/Matawaka.Workbench.App.csproj -c Release --no-restore -o $out
          if ($LASTEXITCODE -ne 0) { throw 'stabilization publish failed' }
          $deps = Get-Content (Join-Path $out 'Matawaka.Workbench.App.deps.json') -Raw
          if ($deps.Contains('Microsoft.AspNetCore', [StringComparison]::Ordinal)) { throw 'published deps still reference Microsoft.AspNetCore' }
          if (@(Get-ChildItem $out -Filter 'Microsoft.AspNetCore*.dll' -File).Count -ne 0) { throw 'published output unexpectedly contains Microsoft.AspNetCore assemblies' }
          Write-Host 'V0491_DEPENDENCY_CLOSURE_PASS aspnetDeps=False aspnetDlls=False'

      - name: Execute official MCP 2.2.0 client interoperability through TcpListener
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $probe = Join-Path $env:RUNNER_TEMP 'v0491-official-mcp-probe'
          if (Test-Path $probe) { Remove-Item $probe -Recurse -Force }
          New-Item -ItemType Directory -Path $probe | Out-Null
          $appProject = (Resolve-Path 'src/Matawaka.Workbench.App/Matawaka.Workbench.App.csproj').Path
          $escaped = [Security.SecurityElement]::Escape($appProject)
          @"
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net10.0-windows</TargetFramework>
              <UseWPF>true</UseWPF>
              <ImplicitUsings>enable</ImplicitUsings>
              <Nullable>enable</Nullable>
              <TreatWarningsAsErrors>true</TreatWarningsAsErrors>
            </PropertyGroup>
            <ItemGroup>
              <ProjectReference Include="$escaped" />
              <PackageReference Include="ModelContextProtocol" Version="2.2.0" />
            </ItemGroup>
          </Project>
          "@ | Set-Content (Join-Path $probe 'Probe.csproj') -Encoding UTF8

          @'
          using System.IO;
          using System.Security.Cryptography;
          using System.Text;
          using System.Text.Json;
          using Matawaka.Workbench.App;
          using ModelContextProtocol.Client;
          using ModelContextProtocol.Protocol;

          internal static class Program
          {
              private static string Hash(string path)
              {
                  using var stream = File.OpenRead(path);
                  return Convert.ToHexString(SHA256.HashData(stream)).ToLowerInvariant();
              }

              private static async Task Main()
              {
                  var workspace = Path.Combine(Path.GetTempPath(), "matawaka-v0491-" + Guid.NewGuid().ToString("N"));
                  Directory.CreateDirectory(Path.Combine(workspace, "Workbench", "artifacts"));
                  var appRoot = Path.Combine(workspace, "Apps", "alpha");
                  Directory.CreateDirectory(Path.Combine(appRoot, "data"));
                  File.WriteAllText(Path.Combine(appRoot, ".matawaka-app.json"), JsonSerializer.Serialize(new LocalApplicationIdentity(LocalApplicationMaintenanceService.IdentitySchema, "alpha", "1.0.0")), new UTF8Encoding(false));
                  var statePath = Path.Combine(appRoot, "data", "state.json");
                  File.WriteAllText(statePath, "{\"private\":\"MCP-LEASE-SECRET\"}", new UTF8Encoding(false));
                  var outsidePath = Path.Combine(appRoot, "data", "outside.txt");
                  File.WriteAllText(outsidePath, "outside", new UTF8Encoding(false));

                  var sourceRoot = Path.Combine(workspace, "AppSources", "alpha");
                  Directory.CreateDirectory(Path.Combine(sourceRoot, "web"));
                  File.WriteAllText(Path.Combine(sourceRoot, ".matawaka-source.json"), "{}", new UTF8Encoding(false));
                  var sourcePath = Path.Combine(sourceRoot, "web", "app.js");
                  File.WriteAllText(sourcePath, "source-v0491", new UTF8Encoding(false));

                  var leases = new LocalAppReadLeaseV048Service();
                  var request = new LocalAppReadLeaseRequestV048(
                      LocalAppReadLeaseV048Service.RequestSchema,
                      "lease:v0491:official",
                      "alpha",
                      new[] { new LocalAppReadLeaseScopeV048("installed", "data/state.json"), new LocalAppReadLeaseScopeV048("source", "web/") },
                      1024, 8192, 8, 300);
                  var leasePreview = leases.Preview(workspace, "alpha", request, default);
                  var created = await leases.CreateAsync(workspace, "alpha", leasePreview, false, default);
                  var grantJson = LocalAppReadLeaseV048Service.SerializeGrant(created.Grant);

                  var adapter = new LocalAppMcpReadAdapterV049Service();
                  var adapterPreview = adapter.PreviewFromGrantJson(workspace, "alpha", grantJson, default);
                  var adapterGrant = await adapter.StartAsync(workspace, "alpha", adapterPreview, grantJson, default);
                  var endpoint = new Uri(adapterGrant.EndpointUrl);
                  if (endpoint.Host != "127.0.0.1" || endpoint.AbsolutePath[5..].Length != 64) throw new Exception("loopback endpoint boundary failed");

                  var transport = new HttpClientTransport(new HttpClientTransportOptions
                  {
                      Endpoint = endpoint,
                      TransportMode = HttpTransportMode.StreamableHttp,
                      EnableStandaloneGetStream = false
                  });
                  await using var client = await McpClient.CreateAsync(transport, new McpClientOptions
                  {
                      ClientInfo = new Implementation { Name = "Matawaka-v0.49.1-qualification", Version = "1.0" }
                  });
                  var tools = await client.ListToolsAsync();
                  if (tools.Count != 1 || tools[0].Name != "read_local_app_chunk") throw new Exception("tools/list mismatch");

                  var installed = await client.CallToolAsync("read_local_app_chunk", new Dictionary<string, object?>
                  {
                      ["role"]="installed", ["relativePath"]="data/state.json", ["offset"]=0L, ["maxBytes"]=1024, ["expectedFileSha256"]=Hash(statePath)
                  });
                  if (installed.IsError is true || !installed.Content.OfType<TextContentBlock>().Single().Text.Contains("MCP-LEASE-SECRET", StringComparison.Ordinal)) throw new Exception("installed read failed");

                  var source = await client.CallToolAsync("read_local_app_chunk", new Dictionary<string, object?>
                  {
                      ["role"]="source", ["relativePath"]="web/app.js", ["offset"]=0L, ["maxBytes"]=1024, ["expectedFileSha256"]=Hash(sourcePath)
                  });
                  if (source.IsError is true || !source.Content.OfType<TextContentBlock>().Single().Text.Contains("source-v0491", StringComparison.Ordinal)) throw new Exception("source read failed");

                  var outside = await client.CallToolAsync("read_local_app_chunk", new Dictionary<string, object?>
                  {
                      ["role"]="installed", ["relativePath"]="data/outside.txt", ["offset"]=0L, ["maxBytes"]=32, ["expectedFileSha256"]=Hash(outsidePath)
                  });
                  if (outside.IsError is not true) throw new Exception("out-of-scope read not refused");

                  var authority = await client.CallToolAsync("read_local_app_chunk", new Dictionary<string, object?>
                  {
                      ["role"]="installed", ["relativePath"]="data/state.json", ["offset"]=0L, ["maxBytes"]=32, ["ApplicationId"]="other"
                  });
                  if (authority.IsError is not true) throw new Exception("caller authority expansion not refused");

                  var stale = await client.CallToolAsync("read_local_app_chunk", new Dictionary<string, object?>
                  {
                      ["role"]="installed", ["relativePath"]="data/state.json", ["offset"]=0L, ["maxBytes"]=32, ["expectedFileSha256"]=new string('0',64)
                  });
                  if (stale.IsError is not true) throw new Exception("stale hash not refused");

                  var revoked = await leases.RevokeAllActiveAsync(workspace, "alpha", default);
                  if (revoked.Receipt.RevokedLeases != 1) throw new Exception("revoke failed");
                  var afterRevoke = await client.CallToolAsync("read_local_app_chunk", new Dictionary<string, object?>
                  {
                      ["role"]="installed", ["relativePath"]="data/state.json", ["offset"]=0L, ["maxBytes"]=32
                  });
                  if (afterRevoke.IsError is not true) throw new Exception("revoked read not refused");

                  await client.DisposeAsync();
                  var stopped = await adapter.StopAsync(workspace, default);
                  if (!stopped.Receipt.ListenerStopped || adapter.IsActiveFor("alpha")) throw new Exception("stop failed");
                  Directory.Delete(workspace, true);
                  Console.WriteLine("V0491_MCP_INTEROP_PASS officialClient=2.2.0 tcpLoopback=True installed=True source=True negatives=True revoke=True stop=True aspnet=False");
              }
          }
          '@ | Set-Content (Join-Path $probe 'Program.cs') -Encoding UTF8

          dotnet run --project (Join-Path $probe 'Probe.csproj') -c Release
          if ($LASTEXITCODE -ne 0) { throw 'official MCP interoperability probe failed' }

      - name: Verify accepted remote frontier remains v0.48
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $remote = 'https://github.com/Matawaka/workbench.git'
          $main = ((git ls-remote $remote refs/heads/main) -split '\s+')[0].ToLowerInvariant()
          if ($main -ne '2b0e3127e3c0284ff569720d85889cec3374f053') { throw "remote main moved unexpectedly: $main" }
          Write-Host 'V0491_REMOTE_PASS main=v0.48'
