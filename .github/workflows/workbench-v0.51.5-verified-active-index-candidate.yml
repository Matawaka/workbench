name: Workbench v0.51.5 verified active lease index candidate

on:
  push:
    branches: [feat/workbench-v0.51.5-verified-active-lease-index]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build and static verified-index checks
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          dotnet restore Matawaka.Workbench.sln
          if($LASTEXITCODE -ne 0){throw 'restore failed'}
          dotnet build Matawaka.Workbench.sln -c Release --no-restore -warnaserror
          if($LASTEXITCODE -ne 0){throw 'Release build failed'}

          $idx=Get-Content 'src/Matawaka.Workbench.App/LocalAppActiveLeaseIndexV0515Service.cs' -Raw
          foreach($m in @('MaxReconciliationStateFiles = 4096','LiveAuthorityHardLimit = 32','ACTIVE_INDEX_RECONCILIATION_REQUIRED','ACTIVE_INDEX_INCONSISTENT','LIVE_AUTHORITY_OVERFLOW','CanonicalHistoricalScanPerformed','BearerPlaintextStored','BearerHashStored','BeginMutationAsync','CommitMutationAsync','ReadAllCanonicalStatesBounded')){
            if(-not $idx.Contains($m,[StringComparison]::Ordinal)){throw "index marker missing: $m"}
          }
          if($idx.Contains('BearerSha256,',[StringComparison]::Ordinal)){throw 'index DTO must not persist bearer hash'}

          $bridge=Get-Content 'src/Matawaka.Workbench.App/LocalAppReadLeaseIndexedLifecycleV0515Service.cs' -Raw
          foreach($m in @('BeginMutationAsync','CreateAsync','CommitMutationAsync','RevokeExactAsync','RevokeAllActiveAsync','ReconcileAsync')){
            if(-not $bridge.Contains($m,[StringComparison]::Ordinal)){throw "lifecycle bridge marker missing: $m"}
          }

          $main=Get-Content 'src/Matawaka.Workbench.App/MainWindow.V0515.cs' -Raw
          foreach($m in @('Read Session Status — verified live authority','ReadSessionHistoryPage','EnsureVerifiedActiveIndexReadyV0515Async','CreateIndexedAsync','RevokeExactIndexedAsync','CanonicalHistoricalScanPerformed = false','HistoricalEvidenceDeleted = false')){
            if(-not $main.Contains($m,[StringComparison]::Ordinal)){throw "UI marker missing: $m"}
          }

          $xaml=Get-Content 'src/Matawaka.Workbench.App/MainWindow.xaml' -Raw
          $surface=[regex]::Match($xaml,'<WrapPanel x:Name="PrimaryMaintenanceSurface"[\s\S]*?</WrapPanel>').Value
          if([regex]::Matches($surface,'<Button\b').Count -ne 4){throw 'top-level four-button surface changed'}
          Write-Host 'V0515_STATIC_PASS reconcileMax=4096 liveHard=32 canonical=true indexDerived=true bearer=false buttons=4'

      - name: Execute migration dirty recovery lazy-prune and overflow controls
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $p=Join-Path $env:RUNNER_TEMP 'v0515-probe'
          if(Test-Path $p){Remove-Item $p -Recurse -Force}
          New-Item -ItemType Directory -Path $p|Out-Null
          $appProject=(Resolve-Path 'src/Matawaka.Workbench.App/Matawaka.Workbench.App.csproj').Path
          $escaped=[Security.SecurityElement]::Escape($appProject)
          @"
          <Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><OutputType>Exe</OutputType><TargetFramework>net10.0-windows</TargetFramework><UseWPF>true</UseWPF><ImplicitUsings>enable</ImplicitUsings><Nullable>enable</Nullable><TreatWarningsAsErrors>true</TreatWarningsAsErrors></PropertyGroup><ItemGroup><ProjectReference Include="$escaped" /></ItemGroup></Project>
          "@ | Set-Content (Join-Path $p 'Probe.csproj') -Encoding UTF8
          @'
          using System.IO;
          using System.Security.Cryptography;
          using System.Text;
          using System.Text.Json;
          using Matawaka.Workbench.App;

          internal static class Program
          {
              static string Sha(string path){using var s=File.OpenRead(path);return Convert.ToHexString(SHA256.HashData(s)).ToLowerInvariant();}
              static string StateDir(string w,string app)=>Path.Combine(w,"Workbench",".workbench","read-leases",app);
              static string StatePath(string w,string app,string lease)=>Path.Combine(StateDir(w,app),lease+".json");
              static string IndexPath(string w,string app)=>Path.Combine(w,"Workbench",".workbench","read-lease-index-v0515",app,"active-index-v0.51.5.json");
              static Dictionary<string,string> Snapshot(string w,string app)=>Directory.EnumerateFiles(StateDir(w,app),"lease-*.json").ToDictionary(x=>Path.GetFileName(x),Sha,StringComparer.OrdinalIgnoreCase);
              static void Same(Dictionary<string,string>a,Dictionary<string,string>b,string role){if(a.Count!=b.Count)throw new Exception(role+": count changed");foreach(var kv in a)if(!b.TryGetValue(kv.Key,out var s)||s!=kv.Value)throw new Exception(role+": canonical bytes changed "+kv.Key);}

              public static async Task Main()
              {
                  var w=Path.Combine(Path.GetTempPath(),"matawaka-v0515-"+Guid.NewGuid().ToString("N"));
                  Directory.CreateDirectory(Path.Combine(w,"Workbench","artifacts"));
                  void App(string id){var root=Path.Combine(w,"Apps",id);Directory.CreateDirectory(Path.Combine(root,"data"));File.WriteAllText(Path.Combine(root,".matawaka-app.json"),JsonSerializer.Serialize(new LocalApplicationIdentity(LocalApplicationMaintenanceService.IdentitySchema,id,"1.0.0")),new UTF8Encoding(false));File.WriteAllText(Path.Combine(root,"data","state.json"),"{\"ok\":true}",new UTF8Encoding(false));}
                  App("alpha"); App("beta");

                  var legacy=new LocalAppReadLeaseV048Service();
                  var exactLegacy=new LocalAppReadLeaseExactRevokeV0512Service();
                  var index=new LocalAppActiveLeaseIndexV0515Service();
                  var lifecycle=new LocalAppReadLeaseIndexedLifecycleV0515Service();
                  var secrets=new List<string>();

                  async Task<(LocalAppReadLeaseGrantV048 Grant,LocalAppReadLeaseCreationReceiptV048 Receipt)> LegacyCreate(string app,string id,int calls=8,int ttl=900)
                  {
                      var req=new LocalAppReadLeaseRequestV048(LocalAppReadLeaseV048Service.RequestSchema,id,app,new[]{new LocalAppReadLeaseScopeV048("installed","data/")},65536,262144,calls,ttl);
                      var p=legacy.Preview(w,app,req,default);var c=await legacy.CreateAsync(w,app,p,false,default);secrets.Add(c.Grant.Bearer);secrets.Add(c.Receipt.BearerSha256);return(c.Grant,c.Receipt);
                  }
                  async Task<LocalAppIndexedLeaseCreateResultV0515> IndexedCreate(string app,string id,int calls=8,int ttl=900)
                  {
                      var req=new LocalAppReadLeaseRequestV048(LocalAppReadLeaseV048Service.RequestSchema,id,app,new[]{new LocalAppReadLeaseScopeV048("installed","data/")},65536,262144,calls,ttl);
                      var p=legacy.Preview(w,app,req,default);var c=await lifecycle.CreateIndexedAsync(w,app,p,false,default);secrets.Add(c.Grant.Bearer);secrets.Add(c.Receipt.BearerSha256);return c;
                  }

                  // Migration fixture: 80 historical + 3 live canonical states, no index.
                  for(var i=0;i<80;i++){var h=await LegacyCreate("alpha",$"migrate:hist:{i:D3}");await exactLegacy.RevokeExactAsync(w,"alpha",h.Grant.LeaseId,default);}
                  var a=await LegacyCreate("alpha","migrate:live:a");
                  var b=await LegacyCreate("alpha","migrate:live:b");
                  var c=await LegacyCreate("alpha","migrate:live:c");
                  var beforeRecon=Snapshot(w,"alpha");
                  var ready0=await index.GetReadinessAsync(w,"alpha",default);if(ready0.Ready||!ready0.ReconciliationRequired)throw new Exception("missing index was not reconciliation-required");
                  var recon=await index.ReconcileAsync(w,"alpha",default);
                  if(recon.Receipt.CanonicalStateRecords!=83||recon.Receipt.LiveCandidatesIndexed!=3||recon.Index.Entries.Count!=3)throw new Exception("migration reconciliation counts mismatch");
                  Same(beforeRecon,Snapshot(w,"alpha"),"reconciliation");

                  var idxText=File.ReadAllText(IndexPath(w,"alpha"));
                  var receiptText=File.ReadAllText(recon.ReceiptPath);
                  foreach(var s in secrets)if(idxText.Contains(s,StringComparison.OrdinalIgnoreCase)||receiptText.Contains(s,StringComparison.OrdinalIgnoreCase))throw new Exception("bearer/hash leaked into index/reconciliation receipt");
                  if(idxText.Contains("Scopes",StringComparison.Ordinal)||idxText.Contains("BearerSha256",StringComparison.Ordinal))throw new Exception("index duplicated scope or bearer hash authority material");

                  var fast=await index.ObserveLiveAuthorityAsync(w,"alpha",null,null,default);
                  if(fast.LiveLeaseCount!=3||fast.CanonicalHistoricalScanPerformed)throw new Exception("fast live status mismatch");

                  // Fast status must not depend on historical parsing after reconciliation.
                  var histPath=beforeRecon.Keys.Select(x=>Path.Combine(StateDir(w,"alpha"),x)).First(x=>File.ReadAllText(x).Contains("\"Revoked\": true",StringComparison.Ordinal));
                  var histBytes=File.ReadAllBytes(histPath);File.WriteAllText(histPath,"{BROKEN-HISTORY",new UTF8Encoding(false));
                  var fastWithBrokenHistory=await index.ObserveLiveAuthorityAsync(w,"alpha",null,null,default);
                  if(fastWithBrokenHistory.LiveLeaseCount!=3)throw new Exception("fast status scanned broken history");
                  File.WriteAllBytes(histPath,histBytes);

                  // Crash gap: dirty before canonical creation; fast status refuses until reconciliation, which discovers the new live state.
                  _=await index.BeginMutationAsync(w,"alpha","hostile-partial-create",null,default);
                  var d=await LegacyCreate("alpha","partial:live:d");
                  var refused=false;try{_=await index.ObserveLiveAuthorityAsync(w,"alpha",null,null,default);}catch(InvalidDataException ex)when(ex.Message.StartsWith("ACTIVE_INDEX_RECONCILIATION_REQUIRED",StringComparison.Ordinal)){refused=true;}
                  if(!refused)throw new Exception("dirty partial create did not fail closed");
                  var repaired=await index.ReconcileAsync(w,"alpha",default);
                  if(!repaired.Index.Entries.Any(x=>x.LeaseId==d.Grant.LeaseId))throw new Exception("reconciliation did not recover omitted live canonical lease");

                  // Indexed creation, then one read exhausts calls. Fast status prunes derived candidate only.
                  var e=await IndexedCreate("alpha","indexed:exhaust",1,900);
                  var readReq=new LocalAppLeaseReadRequestV048(LocalAppReadLeaseV048Service.ReadRequestSchema,"consume:one",e.Grant.LeaseId,e.Grant.Bearer,"alpha","installed","data/state.json",0,64,null);
                  await legacy.AuthorizeAndReadAsync(w,readReq,default);
                  var ePath=StatePath(w,"alpha",e.Grant.LeaseId);var eSha=Sha(ePath);
                  var afterExhaust=await index.ObserveLiveAuthorityAsync(w,"alpha",null,null,default);
                  if(afterExhaust.LiveAuthorities.Any(x=>x.LeaseId==e.Grant.LeaseId)||Sha(ePath)!=eSha)throw new Exception("budget-exhausted lazy prune mutated canonical state or retained candidate");

                  // Expiry prune also changes derived index only.
                  var f=await IndexedCreate("alpha","indexed:expire",8,1);var fPath=StatePath(w,"alpha",f.Grant.LeaseId);var fSha=Sha(fPath);await Task.Delay(1300);
                  var afterExpiry=await index.ObserveLiveAuthorityAsync(w,"alpha",null,null,default);
                  if(afterExpiry.LiveAuthorities.Any(x=>x.LeaseId==f.Grant.LeaseId)||Sha(fPath)!=fSha)throw new Exception("expiry prune mutated canonical state or retained candidate");

                  // Exact indexed revoke removes target only and leaves sibling canonical state unchanged.
                  var siblingSha=Sha(StatePath(w,"alpha",c.Grant.LeaseId));
                  var closed=await lifecycle.RevokeExactIndexedAsync(w,"alpha",b.Grant.LeaseId,default);
                  if(closed.ExactReceipt.SiblingLeasesRevoked!=0||Sha(StatePath(w,"alpha",c.Grant.LeaseId))!=siblingSha)throw new Exception("indexed exact revoke touched sibling canonical state");
                  var afterClose=await index.ObserveLiveAuthorityAsync(w,"alpha",null,null,default);
                  if(afterClose.LiveAuthorities.Any(x=>x.LeaseId==b.Grant.LeaseId))throw new Exception("revoked target remained indexed live");

                  // Dirty marker without canonical change blocks status and reconciliation repairs it.
                  _=await index.BeginMutationAsync(w,"alpha","hostile-dirty-only",null,default);
                  refused=false;try{_=await index.ObserveLiveAuthorityAsync(w,"alpha",null,null,default);}catch(InvalidDataException ex)when(ex.Message.StartsWith("ACTIVE_INDEX_RECONCILIATION_REQUIRED",StringComparison.Ordinal)){refused=true;}
                  if(!refused)throw new Exception("dirty-only marker did not block index use");
                  await index.ReconcileAsync(w,"alpha",default);

                  // Forged index entry pointing to missing canonical state must fail inconsistent, never be silently ignored.
                  var indexObj=JsonSerializer.Deserialize<LocalAppActiveLeaseIndexV0515>(File.ReadAllText(IndexPath(w,"alpha")))!;
                  var forged=indexObj with{IndexRevision=indexObj.IndexRevision+1,Entries=indexObj.Entries.Concat(new[]{new LocalAppActiveLeaseIndexEntryV0515("lease-forgedmissing",0)}).ToArray()};
                  File.WriteAllText(IndexPath(w,"alpha"),JsonSerializer.Serialize(forged,new JsonSerializerOptions{WriteIndented=true}),new UTF8Encoding(false));
                  var inconsistent=false;try{_=await index.ObserveLiveAuthorityAsync(w,"alpha",null,null,default);}catch(InvalidDataException ex)when(ex.Message.StartsWith("ACTIVE_INDEX_INCONSISTENT",StringComparison.Ordinal)){inconsistent=true;}
                  if(!inconsistent)throw new Exception("missing canonical indexed entry was silently ignored");
                  await index.ReconcileAsync(w,"alpha",default);

                  // Separate 33-live fixture: reconcile all candidates but fast status returns explicit overflow, not a partial list.
                  for(var i=0;i<33;i++)await LegacyCreate("beta",$"overflow:{i:D2}");
                  var betaRecon=await index.ReconcileAsync(w,"beta",default);if(betaRecon.Index.Entries.Count!=33)throw new Exception("overflow reconciliation did not retain all 33 candidates");
                  var overflow=false;try{_=await index.ObserveLiveAuthorityAsync(w,"beta",null,null,default);}catch(InvalidDataException ex)when(ex.Message.StartsWith("LIVE_AUTHORITY_OVERFLOW:",StringComparison.Ordinal)){overflow=true;}
                  if(!overflow)throw new Exception("33 live verified candidates did not fail closed with overflow");

                  Console.WriteLine($"V0515_RUNTIME_PASS migrationCanonical=83 migrationLive=3 fastHistoricalScan=false partialRecovered=true exhaustPruned=true expiryPruned=true exactSibling=false dirtyRefusal=true inconsistentRefusal=true overflow=33 bearer=false");
              }
          }
          '@ | Set-Content (Join-Path $p 'Program.cs') -Encoding UTF8
          Push-Location $p
          try {
            dotnet restore Probe.csproj
            if($LASTEXITCODE -ne 0){throw 'probe restore failed'}
            dotnet run --project Probe.csproj -c Release --no-restore
            if($LASTEXITCODE -ne 0){throw 'v0.51.5 hostile runtime probe failed'}
          } finally { Pop-Location }

      - name: Verify publication remains deferred
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $remote=(git ls-remote origin refs/heads/main).Split("`t")[0].Trim().ToLowerInvariant()
          if($remote -ne '632ddbb73e8d70b485f02d21f772674d429adf8c'){throw "remote main moved unexpectedly: $remote"}
          Write-Host "V0515_REMOTE_BOUNDARY_PASS main=$remote publicationDeferred=True"
