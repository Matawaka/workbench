name: Workbench v0.52 artifact acquisition core

on:
  push:
    branches: [ feat/workbench-v0.52-bounded-artifact-acquisition ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Release build
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          dotnet restore Matawaka.Workbench.sln
          if($LASTEXITCODE -ne 0){throw 'restore failed'}
          dotnet build Matawaka.Workbench.sln -c Release --no-restore -warnaserror
          if($LASTEXITCODE -ne 0){throw 'v0.52 Release build failed'}
      - name: Verify primitive markers and deferred public boundary
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $svc=Get-Content 'src/Matawaka.Workbench.App/BoundedArtifactAcquisitionV052Service.cs' -Raw
          foreach($m in @('ACQUISITION_PREPARED','DOWNLOAD_STARTED','BYTES_COMPLETE','SIZE_VERIFIED','SHA256_VERIFIED','ACQUISITION_VERIFIED','BearerPlaintextPersisted','no automatic retry or range-resume authority')){
            if(-not $svc.Contains($m,[StringComparison]::Ordinal)){throw "v0.52 marker missing: $m"}
          }
          $remote=(git ls-remote origin refs/heads/main).Split("`t")[0].Trim().ToLowerInvariant()
          if($remote -ne '632ddbb73e8d70b485f02d21f772674d429adf8c'){throw "remote main moved unexpectedly: $remote"}
          Write-Host "V052_CORE_BUILD_PASS main=$remote publicationDeferred=True"
