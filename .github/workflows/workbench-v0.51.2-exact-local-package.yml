name: Workbench v0.51.2 exact local predecessor package

on:
  push:
    branches: [feat/workbench-v0.51.2-end-read-session]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build exact source candidate
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          dotnet restore Matawaka.Workbench.sln
          if($LASTEXITCODE -ne 0){throw 'v0.51.2 restore failed'}
          dotnet build Matawaka.Workbench.sln -c Release --no-restore -warnaserror
          if($LASTEXITCODE -ne 0){throw 'v0.51.2 Release build failed'}

          $app=Get-Content 'src/Matawaka.Workbench.App/App.xaml.cs' -Raw
          if(-not $app.Contains('ConfigureV0512Routing()', [StringComparison]::Ordinal)){throw 'v0.51.2 routing missing'}
          $cp=Get-Content 'src/Matawaka.Workbench.App/LocalCheckpointV0512Service.cs' -Raw
          foreach($m in @('workbench-v0.51.1-accepted','workbench-v0.51.2-accepted','v0.51.2-source-manifest*.json','PredecessorGitSha')){
            if(-not $cp.Contains($m,[StringComparison]::Ordinal)){throw "checkpoint marker missing: $m"}
          }
          $closure=Get-Content 'src/Matawaka.Workbench.App/LocalAppReadLeaseExactRevokeV0512Service.cs' -Raw
          if($closure.Contains('EnumerateFiles(',[StringComparison]::Ordinal) -or $closure.Contains('ListActive(',[StringComparison]::Ordinal)){throw 'exact closure must not enumerate sibling leases'}
          if(-not $closure.Contains('SiblingLeasesRevoked',[StringComparison]::Ordinal)){throw 'sibling-zero evidence marker missing'}
          Write-Host 'V0512_EXACT_PACKAGE_BUILD_PASS'

      - name: Verify public publication remains deferred
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $remote=(git ls-remote origin refs/heads/main).Split("`t")[0].Trim().ToLowerInvariant()
          if($remote -ne '632ddbb73e8d70b485f02d21f772674d429adf8c'){throw "remote main moved unexpectedly: $remote"}
          Write-Host "V0512_REMOTE_BOUNDARY_PASS main=$remote publicationDeferred=True"

      - name: Package exact local predecessor update
        id: pack
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $predecessor='75ba8926d366d7aa569c6cc5944302ec9c45d1f4'
          $stage=Join-Path $env:RUNNER_TEMP 'v0512-exact-update'
          if(Test-Path $stage){Remove-Item $stage -Recurse -Force}
          $payload=Join-Path $stage 'payload'
          New-Item -ItemType Directory -Path $payload|Out-Null

          $files=@(
            'PATCH-v0.51.2.md',
            'src/Matawaka.Workbench.App/App.xaml.cs',
            'src/Matawaka.Workbench.App/GlobalUsings.V0512.cs',
            'src/Matawaka.Workbench.App/LocalAppReadLeaseExactRevokeV0512Service.cs',
            'src/Matawaka.Workbench.App/LocalAppsActionDialogV0512.cs',
            'src/Matawaka.Workbench.App/LocalCheckpointV0512Service.cs',
            'src/Matawaka.Workbench.App/MainWindow.V0512.Acceptance.cs',
            'src/Matawaka.Workbench.App/MainWindow.V0512.cs',
            'src/Matawaka.Workbench.App/WorkbenchV0512AcceptanceHarness.cs'
          )

          $items=@()
          foreach($file in $files){
            $src=Join-Path (Get-Location) ($file -replace '/', [IO.Path]::DirectorySeparatorChar)
            if(-not (Test-Path $src -PathType Leaf)){throw "missing v0.51.2 payload file: $file"}
            $dst=Join-Path $payload ($file -replace '/', [IO.Path]::DirectorySeparatorChar)
            New-Item -ItemType Directory -Path ([IO.Path]::GetDirectoryName($dst)) -Force|Out-Null
            Copy-Item $src $dst -Force
            $items += [ordered]@{Path=$file;Sha256=(Get-FileHash $src -Algorithm SHA256).Hash.ToLowerInvariant()}
          }

          $manifest=[ordered]@{
            Schema='matawaka.workbench-update-package/v0.10'
            PackageVersion='0.10'
            TargetVersion='0.51.2'
            PredecessorTag='workbench-v0.51.1-accepted'
            PredecessorCommit=$predecessor
            TargetTag='workbench-v0.51.2-accepted'
            PayloadRoot='payload/'
            Files=$items
            NetworkAccessRequested=$false
            CatalogMutationRequested=$false
            AgentExecuteRequested=$false
            ArbitraryProcessExecutionRequested=$false
            InstallerScriptExecutionRequested=$false
            NonEffects=@(
              'source only',
              'exact local v0.51.1 predecessor only',
              'no private app bytes',
              'no lease/bearer/clipboard/endpoint runtime bytes',
              'no automatic Secure MCP Tunnel',
              'no OpenAI bridge dependency',
              'no remote publication authority',
              'no binder/helper files in payload'
            )
          }
          $manifest|ConvertTo-Json -Depth 8|Set-Content (Join-Path $stage 'workbench-update-manifest.json') -Encoding UTF8

          $zip=Join-Path $env:RUNNER_TEMP 'workbench-v0.51.2-end-read-session-update.zip'
          if(Test-Path $zip){Remove-Item $zip -Force}
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip -CompressionLevel Optimal
          $sha=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "zip=$zip" >> $env:GITHUB_OUTPUT
          "sha=$sha" >> $env:GITHUB_OUTPUT
          Write-Host "V0512_PACKAGE_PASS predecessor=$predecessor files=$($files.Count) sha256=$sha"

      - uses: actions/upload-artifact@v4
        with:
          name: workbench-v0.51.2-exact-local-update
          path: ${{ steps.pack.outputs.zip }}
          if-no-files-found: error
