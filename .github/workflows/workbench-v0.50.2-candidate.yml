name: Workbench v0.50.2 plain MCP OAuth discovery candidate

on:
  push:
    branches: [feat/workbench-v0.50.2-plain-mcp-oauth-discovery]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build and static authority checks
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          dotnet restore Matawaka.Workbench.sln
          dotnet build Matawaka.Workbench.sln -c Release --no-restore -warnaserror
          if($LASTEXITCODE -ne 0){throw 'Release build failed'}
          $app=Get-Content 'src/Matawaka.Workbench.App/App.xaml.cs' -Raw
          if(-not $app.Contains('ConfigureV0502Routing()', [StringComparison]::Ordinal)){throw 'v0.50.2 routing missing'}
          $svc=Get-Content 'src/Matawaka.Workbench.App/PlainMcpOAuthDiscoveryCompatV0502Service.cs' -Raw
          foreach($m in @('/.well-known/oauth-protected-resource','OAuthMetadataAdvertised','Authorization/Cookie not forwarded','TcpListener(IPAddress.Loopback, 0)','MaxRequestBodyBytes = 64 * 1024','MaxResponseBodyBytes = 2 * 1024 * 1024')){if(-not $svc.Contains($m,[StringComparison]::Ordinal)){throw "missing v0.50.2 marker: $m"}}
          foreach($m in @('WWW-Authenticate:','IPAddress.Any','UseShellExecute = true','authorization_servers','oauth-authorization-server')){if($svc.Contains($m,[StringComparison]::Ordinal)){throw "forbidden OAuth/authority marker: $m"}}
          $cp=Get-Content 'src/Matawaka.Workbench.App/LocalCheckpointV0502Service.cs' -Raw
          if(-not $cp.Contains('1b3c5aa44e2bb302764b044b3b3ac00de14a5994')){throw 'local failed-v0.50.1 predecessor binding missing'}
          $pub=Get-Content 'src/Matawaka.Workbench.App/FixedGitHubPublicationV0502Service.cs' -Raw
          foreach($m in @('ExpectedRemoteBase = "1e0453ccf047bd948e76b577c2395a7d0009ff7a"','FailedRemoteTagV0501 = "workbench-v0.50.1-accepted"','FailedRemoteTagV050 = "workbench-v0.50-accepted"','AcceptedTag = "workbench-v0.50.2-accepted"')){if(-not $pub.Contains($m,[StringComparison]::Ordinal)){throw "publication boundary missing: $m"}}
          Write-Host 'V0502_STATIC_PASS build=True noOAuthAuthority=True loopbackFacade=True leaseAuthorityUnchanged=True'

      - name: Reconstruct local v0.50.1 product tree then overlay v0.50.2
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $candidate=(Get-Location).Path
          $overlay=Join-Path $env:RUNNER_TEMP 'overlay-v0502'
          if(Test-Path $overlay){Remove-Item $overlay -Recurse -Force}
          git worktree add --detach $overlay 1e0453ccf047bd948e76b577c2395a7d0009ff7a
          if($LASTEXITCODE -ne 0){throw 'accepted v0.49.1 predecessor unavailable'}
          $v050=@(
            'PATCH-v0.50.md',
            'src/Matawaka.Workbench.App/App.xaml.cs',
            'src/Matawaka.Workbench.App/OpenAiSecureMcpTunnelV050Service.cs',
            'src/Matawaka.Workbench.App/OpenAiSecureMcpTunnelDialogV050.cs',
            'src/Matawaka.Workbench.App/LocalAppsActionDialogV050.cs',
            'src/Matawaka.Workbench.App/MainWindow.V050.cs',
            'src/Matawaka.Workbench.App/WorkbenchV050AcceptanceHarness.cs',
            'src/Matawaka.Workbench.App/LocalCheckpointV050Service.cs',
            'src/Matawaka.Workbench.App/FixedGitHubPublicationV050Service.cs'
          )
          $v0501=@(
            'PATCH-v0.50.1.md',
            'src/Matawaka.Workbench.App/App.xaml.cs',
            'src/Matawaka.Workbench.App/OpenAiSecureMcpTunnelV0501Service.cs',
            'src/Matawaka.Workbench.App/MainWindow.V0501.cs',
            'src/Matawaka.Workbench.App/WorkbenchV0501AcceptanceHarness.cs',
            'src/Matawaka.Workbench.App/LocalCheckpointV0501Service.cs',
            'src/Matawaka.Workbench.App/FixedGitHubPublicationV0501Service.cs'
          )
          $v0502=@(
            'PATCH-v0.50.2.md',
            'src/Matawaka.Workbench.App/App.xaml.cs',
            'src/Matawaka.Workbench.App/PlainMcpOAuthDiscoveryCompatV0502Service.cs',
            'src/Matawaka.Workbench.App/MainWindow.V0502.cs',
            'src/Matawaka.Workbench.App/WorkbenchV0502AcceptanceHarness.cs',
            'src/Matawaka.Workbench.App/LocalCheckpointV0502Service.cs',
            'src/Matawaka.Workbench.App/FixedGitHubPublicationV0502Service.cs'
          )
          try {
            Push-Location $overlay
            dotnet restore Matawaka.Workbench.sln
            if($LASTEXITCODE -ne 0){throw 'accepted predecessor restore failed'}
            Pop-Location
            foreach($file in $v050){
              $dst=Join-Path $overlay ($file-replace'/',[IO.Path]::DirectorySeparatorChar)
              New-Item -ItemType Directory -Path ([IO.Path]::GetDirectoryName($dst)) -Force|Out-Null
              $text=git show "993200f753a1b399c1e8724e8e41927127394d02`:$file"
              if($LASTEXITCODE -ne 0){throw "cannot reconstruct v0.50 file: $file"}
              [IO.File]::WriteAllText($dst,($text -join "`n")+"`n",[Text.UTF8Encoding]::new($false))
            }
            foreach($file in $v0501){
              $dst=Join-Path $overlay ($file-replace'/',[IO.Path]::DirectorySeparatorChar)
              New-Item -ItemType Directory -Path ([IO.Path]::GetDirectoryName($dst)) -Force|Out-Null
              $text=git show "66b5ea51edc3195a8a3932304d7744685ed3f541`:$file"
              if($LASTEXITCODE -ne 0){throw "cannot reconstruct v0.50.1 file: $file"}
              [IO.File]::WriteAllText($dst,($text -join "`n")+"`n",[Text.UTF8Encoding]::new($false))
            }
            foreach($file in $v0502){
              $src=Join-Path $candidate ($file-replace'/',[IO.Path]::DirectorySeparatorChar)
              $dst=Join-Path $overlay ($file-replace'/',[IO.Path]::DirectorySeparatorChar)
              New-Item -ItemType Directory -Path ([IO.Path]::GetDirectoryName($dst)) -Force|Out-Null
              Copy-Item $src $dst -Force
            }
            Push-Location $overlay
            dotnet build Matawaka.Workbench.sln -c Release --no-restore -warnaserror
            if($LASTEXITCODE -ne 0){throw 'v0.50.2 reconstructed overlay --no-restore build failed'}
            Pop-Location
            Write-Host "V0502_NO_RESTORE_PASS remoteBase=v0.49.1 reconstructedV050=$($v050.Count) reconstructedV0501=$($v0501.Count) successorFiles=$($v0502.Count)"
          } finally {
            if((Get-Location).Path -eq $overlay){Pop-Location}
            git worktree remove --force $overlay 2>$null
          }

      - name: Plain MCP discovery facade integration
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $p=Join-Path $env:RUNNER_TEMP 'v0502-probe';New-Item -ItemType Directory -Path $p -Force|Out-Null
          $appProject=(Resolve-Path 'src/Matawaka.Workbench.App/Matawaka.Workbench.App.csproj').Path;$escaped=[Security.SecurityElement]::Escape($appProject)
          @"
          <Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><OutputType>Exe</OutputType><TargetFramework>net10.0-windows</TargetFramework><UseWPF>true</UseWPF><Nullable>enable</Nullable></PropertyGroup><ItemGroup><ProjectReference Include="$escaped" /></ItemGroup></Project>
          "@ | Set-Content (Join-Path $p 'Probe.csproj') -Encoding UTF8
          @'
          using System;
          using System.IO;
          using System.Net;
          using System.Net.Http;
          using System.Net.Sockets;
          using System.Text;
          using System.Threading.Tasks;
          using Matawaka.Workbench.App;

          var upstream=new TcpListener(IPAddress.Loopback,0);upstream.Start();var upstreamPort=((IPEndPoint)upstream.LocalEndpoint).Port;var upstreamToken=new string('b',64);var upstreamUrl=$"http://127.0.0.1:{upstreamPort}/mcp/{upstreamToken}";
          var observedAuth=false;var observedCookie=false;
          var upstreamTask=Task.Run(async()=>{
            using var c=await upstream.AcceptTcpClientAsync();using var s=c.GetStream();var buf=new byte[131072];var total=0;while(total<buf.Length){var n=await s.ReadAsync(buf.AsMemory(total));if(n<=0)break;total+=n;var text=Encoding.ASCII.GetString(buf,0,total);var headerEnd=text.IndexOf("\r\n\r\n",StringComparison.Ordinal);if(headerEnd>=0){var h=text[..headerEnd];observedAuth=h.Contains("Authorization:",StringComparison.OrdinalIgnoreCase);observedCookie=h.Contains("Cookie:",StringComparison.OrdinalIgnoreCase);var body=Encoding.UTF8.GetBytes("{\"jsonrpc\":\"2.0\",\"id\":1,\"result\":{\"ok\":true}}");var head=Encoding.ASCII.GetBytes($"HTTP/1.1 200 OK\r\nContent-Type: application/json\r\nContent-Length: {body.Length}\r\nConnection: close\r\n\r\n");await s.WriteAsync(head);await s.WriteAsync(body);break;}}
          });

          var svc=new PlainMcpOAuthDiscoveryCompatV0502Service();var grant=await svc.StartAsync("alpha","lease-alpha",DateTimeOffset.Now.AddMinutes(3),upstreamUrl,default);var facade=new Uri(grant.EndpointUrl);using var http=new HttpClient();
          var root=await http.GetAsync($"http://127.0.0.1:{facade.Port}/.well-known/oauth-protected-resource");if(root.StatusCode!=HttpStatusCode.NotFound)throw new Exception("root PRMD must be 404");
          var path=await http.GetAsync($"http://127.0.0.1:{facade.Port}/.well-known/oauth-protected-resource{facade.AbsolutePath}");if(path.StatusCode!=HttpStatusCode.NotFound)throw new Exception("path PRMD must be 404");
          var endpointGet=await http.GetAsync(grant.EndpointUrl);if(endpointGet.StatusCode!=HttpStatusCode.MethodNotAllowed)throw new Exception("MCP GET must remain 405");
          using var post=new HttpRequestMessage(HttpMethod.Post,grant.EndpointUrl);post.Content=new StringContent("{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"ping\"}",Encoding.UTF8,"application/json");post.Headers.TryAddWithoutValidation("Authorization","Bearer should-not-forward");post.Headers.TryAddWithoutValidation("Cookie","session=should-not-forward");var response=await http.SendAsync(post);var responseText=await response.Content.ReadAsStringAsync();if(!response.IsSuccessStatusCode||!responseText.Contains("\"ok\":true"))throw new Exception("POST proxy failed");await upstreamTask;if(observedAuth||observedCookie)throw new Exception("Authorization/Cookie forwarded upstream");
          var checks=PlainMcpOAuthDiscoveryCompatV0502Service.RunOfflineContractChecks();if(checks.Any(x=>!x.Passed))throw new Exception("offline facade checks failed");await svc.StopAsync(default);upstream.Stop();Console.WriteLine("V0502_FACADE_PASS root404=True path404=True mcpGet405=True postProxy=True authForward=False filesystemAuthority=False");
          '@ | Set-Content (Join-Path $p 'Program.cs') -Encoding UTF8
          dotnet run --project (Join-Path $p 'Probe.csproj') -c Release
          if($LASTEXITCODE -ne 0){throw 'v0.50.2 facade integration failed'}

      - name: Remote prepublication boundary
        shell: pwsh
        run: |
          $remote='https://github.com/Matawaka/workbench.git'
          $main=((git ls-remote $remote refs/heads/main)-split '\s+')[0].ToLowerInvariant()
          if($main -ne '1e0453ccf047bd948e76b577c2395a7d0009ff7a'){throw "remote main moved: $main"}
          $remoteBaseTag=((git ls-remote $remote refs/tags/workbench-v0.49.1-accepted)-split '\s+')[0].ToLowerInvariant()
          $localBaseTagObject=(git rev-parse workbench-v0.49.1-accepted).Trim().ToLowerInvariant()
          $localBaseTagCommit=(git rev-list -n 1 workbench-v0.49.1-accepted).Trim().ToLowerInvariant()
          if($remoteBaseTag -ne $localBaseTagObject){throw 'remote v0.49.1 tag object moved'}
          if($localBaseTagCommit -ne '1e0453ccf047bd948e76b577c2395a7d0009ff7a'){throw 'remote accepted base tag peel mismatch'}
          foreach($tag in @('workbench-v0.49-accepted','workbench-v0.50-accepted','workbench-v0.50.1-accepted','workbench-v0.50.2-accepted')){if(@(git ls-remote $remote "refs/tags/$tag").Count -ne 0){throw "unexpected remote tag: $tag"}}
          Write-Host 'V0502_REMOTE_PASS main=v0.49.1 failedTagsAbsent=True targetAbsent=True'

      - name: Package source-only v0.50.2 candidate
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop';Add-Type -AssemblyName System.IO.Compression.FileSystem
          $files=@(
            'PATCH-v0.50.2.md',
            'src/Matawaka.Workbench.App/App.xaml.cs',
            'src/Matawaka.Workbench.App/PlainMcpOAuthDiscoveryCompatV0502Service.cs',
            'src/Matawaka.Workbench.App/MainWindow.V0502.cs',
            'src/Matawaka.Workbench.App/WorkbenchV0502AcceptanceHarness.cs',
            'src/Matawaka.Workbench.App/LocalCheckpointV0502Service.cs',
            'src/Matawaka.Workbench.App/FixedGitHubPublicationV0502Service.cs'
          )
          $root=Join-Path $env:RUNNER_TEMP 'v0502-package';$payload=Join-Path $root 'payload';if(Test-Path $root){Remove-Item $root -Recurse -Force};New-Item -ItemType Directory -Path $payload -Force|Out-Null
          $mf=@();foreach($file in $files){$d=Join-Path $payload ($file-replace'/',[IO.Path]::DirectorySeparatorChar);New-Item -ItemType Directory -Path ([IO.Path]::GetDirectoryName($d)) -Force|Out-Null;Copy-Item $file $d;$mf+=[ordered]@{Path=$file;Sha256=(Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()}}
          $m=[ordered]@{Schema='matawaka.workbench-update-package/v0.10';PackageVersion='0.10';TargetVersion='0.50.2';PredecessorTag='workbench-v0.50.1-accepted';PredecessorCommit='1b3c5aa44e2bb302764b044b3b3ac00de14a5994';TargetTag='workbench-v0.50.2-accepted';PayloadRoot='payload/';Files=$mf;NetworkAccessRequested=$false;CatalogMutationRequested=$false;AgentExecuteRequested=$false;ArbitraryProcessExecutionRequested=$false;InstallerScriptExecutionRequested=$false;NonEffects=@('source only','failed v0.50/v0.50.1 remain local predecessor evidence','no OAuth authority','external tunnel-client excluded','credentials/private bytes/runtime facade state excluded')}
          [IO.File]::WriteAllText((Join-Path $root 'workbench-update-manifest.json'),($m|ConvertTo-Json -Depth 8),[Text.UTF8Encoding]::new($false))
          $zip=Join-Path $env:RUNNER_TEMP 'workbench-v0.50.2-plain-mcp-oauth-discovery-candidate.zip';if(Test-Path $zip){Remove-Item $zip -Force};[IO.Compression.ZipFile]::CreateFromDirectory($root,$zip,[IO.Compression.CompressionLevel]::Optimal,$false)
          $sha=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant();$size=(Get-Item $zip).Length
          $entries=[IO.Compression.ZipFile]::OpenRead($zip);try{$names=@($entries.Entries|% FullName);if($names.Count -ne ($files.Count+1)){throw "unexpected zip entries: $($names.Count)"};if($names -contains '.github/workflows/workbench-v0.50.2-candidate.yml'){throw 'workflow leaked into package'}}finally{$entries.Dispose()}
          "PACKAGE_SHA256=$sha"|Out-File $env:GITHUB_ENV -Append;"PACKAGE_SIZE=$size"|Out-File $env:GITHUB_ENV -Append;"PACKAGE_PATH=$zip"|Out-File $env:GITHUB_ENV -Append
          Write-Host "V0502_PACKAGE_PASS sha256=$sha bytes=$size payloadFiles=$($files.Count) authorityFlags=false"

      - name: Upload candidate
        uses: actions/upload-artifact@v4
        with:
          name: workbench-v0.50.2-plain-mcp-oauth-discovery-candidate
          path: ${{ env.PACKAGE_PATH }}
          if-no-files-found: error
