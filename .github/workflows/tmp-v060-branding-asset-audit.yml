name: TEMP v0.60 Branding Asset Audit

on:
  push:
    branches:
      - feat/workbench-v0.60-windows-branding-v2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: Record exact repository asset hashes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $paths = @(
            'src/Matawaka.Workbench.App/Assets/Branding/MatawakaWorkbench.ico',
            'src/Matawaka.Workbench.App/Assets/Branding/splash-v060.jpg',
            'src/Matawaka.Workbench.App/Assets/Branding/update-v060.jpg'
          )
          foreach ($path in $paths) {
            $item = Get-Item $path
            $sha = (Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant()
            Write-Host "ASSET $path bytes=$($item.Length) sha256=$sha"
          }
      - name: Upload exact repository branding assets
        uses: actions/upload-artifact@v4
        with:
          name: tmp-v060-branding-asset-audit
          path: src/Matawaka.Workbench.App/Assets/Branding/
          if-no-files-found: error
