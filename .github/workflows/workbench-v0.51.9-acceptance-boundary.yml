name: Workbench v0.51.9 acceptance boundary

on:
  push:
    branches: [feat/workbench-v0.51.9-mcp-owner-generation-continuity]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build and verify first-boot acceptance boundary
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          dotnet restore Matawaka.Workbench.sln
          if($LASTEXITCODE -ne 0){throw 'v0.51.9 restore failed'}
          dotnet build Matawaka.Workbench.sln -c Release --no-restore -warnaserror
          if($LASTEXITCODE -ne 0){throw 'v0.51.9 Release build failed'}

          $app=Get-Content 'src/Matawaka.Workbench.App/App.xaml.cs' -Raw
          foreach($m in @('ConfigureV0519Routing()','ConfigureV0519AcceptanceRouting()')){
            if(-not $app.Contains($m,[StringComparison]::Ordinal)){throw "v0.51.9 startup marker missing: $m"}
          }
          $g=Get-Content 'src/Matawaka.Workbench.App/LocalAppMcpOwnerGenerationV0519Service.cs' -Raw
          foreach($m in @('PRIOR_OWNER_METADATA_PRESERVED_VALID','PRIOR_OWNER_METADATA_PRESERVED_OPAQUE_UNTRUSTED','NO_PRIOR_OWNER_METADATA','MaxPriorMetadataBytes = 64 * 1024','ArchiveHashVerified','ResumeAuthorityGranted')){
            if(-not $g.Contains($m,[StringComparison]::Ordinal)){throw "v0.51.9 generation marker missing: $m"}
          }
          $o=Get-Content 'src/Matawaka.Workbench.App/LocalAppMcpSessionOwnershipV0517Service.cs' -Raw
          $preserve=$o.IndexOf('PreservePriorBeforeSuccessorAsync(',[StringComparison]::Ordinal)
          $write=$o.IndexOf('WriteOwnerAsync(held, null, "OWNERSHIP_ACQUIRED_UNBOUND"',[StringComparison]::Ordinal)
          if($preserve -lt 0 -or $write -lt 0 -or $preserve -ge $write){throw 'generation preservation ordering drift'}
          $cp=Get-Content 'src/Matawaka.Workbench.App/LocalCheckpointV0519Service.cs' -Raw
          foreach($m in @('workbench-v0.51.8-accepted','workbench-v0.51.9-accepted','v0.51.9-source-manifest*.json','PredecessorGitSha')){
            if(-not $cp.Contains($m,[StringComparison]::Ordinal)){throw "v0.51.9 checkpoint marker missing: $m"}
          }
          $acc=Get-Content 'src/Matawaka.Workbench.App/MainWindow.V0519.Acceptance.cs' -Raw
          foreach($m in @('Window_LoadedV0519','RunV0519AcceptanceArtifactAsync','AcceptFromBootstrapAsync','PriorOwnerMetadataPreservedBeforeSuccessorWrite = true','PreservationFailureReleasesOwnerBeforeLeaseCreation = true','AutomaticPublishPerformed = false')){
            if(-not $acc.Contains($m,[StringComparison]::Ordinal)){throw "v0.51.9 acceptance marker missing: $m"}
          }
          Write-Host 'V0519_ACCEPTANCE_BOUNDARY_PASS bootstrap=one-shot priorEvidenceBeforeSuccessor=true failClosedBeforeLease=true authority=false publish=deferred'

      - name: Verify publication remains deferred
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $remote=(git ls-remote origin refs/heads/main).Split("`t")[0].Trim().ToLowerInvariant()
          if($remote -ne '632ddbb73e8d70b485f02d21f772674d429adf8c'){throw "remote main moved unexpectedly: $remote"}
          Write-Host "V0519_ACCEPTANCE_REMOTE_BOUNDARY_PASS main=$remote publicationDeferred=True"
