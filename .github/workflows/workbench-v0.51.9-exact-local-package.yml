name: Workbench v0.51.9 exact local predecessor package

on:
  push:
    branches: [feat/workbench-v0.51.9-mcp-owner-generation-continuity]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build exact source candidate
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          dotnet restore Matawaka.Workbench.sln
          if($LASTEXITCODE -ne 0){throw 'v0.51.9 restore failed'}
          dotnet build Matawaka.Workbench.sln -c Release --no-restore -warnaserror
          if($LASTEXITCODE -ne 0){throw 'v0.51.9 Release build failed'}
          $app=Get-Content 'src/Matawaka.Workbench.App/App.xaml.cs' -Raw
          foreach($m in @('ConfigureV0519Routing()','ConfigureV0519AcceptanceRouting()')){if(-not $app.Contains($m,[StringComparison]::Ordinal)){throw "v0.51.9 routing marker missing: $m"}}
          $gen=Get-Content 'src/Matawaka.Workbench.App/LocalAppMcpOwnerGenerationV0519Service.cs' -Raw
          foreach($m in @('PRIOR_OWNER_METADATA_PRESERVED_VALID','PRIOR_OWNER_METADATA_PRESERVED_OPAQUE_UNTRUSTED','MCP_OWNER_GENERATION_ARCHIVE_HASH_MISMATCH','LeaseAuthorityGranted','ResumeAuthorityGranted')){if(-not $gen.Contains($m,[StringComparison]::Ordinal)){throw "v0.51.9 generation marker missing: $m"}}
          $cp=Get-Content 'src/Matawaka.Workbench.App/LocalCheckpointV0519Service.cs' -Raw
          foreach($m in @('workbench-v0.51.8-accepted','workbench-v0.51.9-accepted','v0.51.9-source-manifest*.json','PredecessorGitSha')){if(-not $cp.Contains($m,[StringComparison]::Ordinal)){throw "v0.51.9 checkpoint marker missing: $m"}}
          Write-Host 'V0519_EXACT_PACKAGE_BUILD_PASS'

      - name: Verify public publication remains deferred
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $remote=(git ls-remote origin refs/heads/main).Split("`t")[0].Trim().ToLowerInvariant()
          if($remote -ne '632ddbb73e8d70b485f02d21f772674d429adf8c'){throw "remote main moved unexpectedly: $remote"}
          Write-Host "V0519_REMOTE_BOUNDARY_PASS main=$remote publicationDeferred=True"

      - name: Package exact local predecessor update
        id: pack
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $predecessor='7777e9c3208633da8f572c0845375bb08e9b56b6'
          $stage=Join-Path $env:RUNNER_TEMP 'v0519-exact-update'
          if(Test-Path $stage){Remove-Item $stage -Recurse -Force}
          $payload=Join-Path $stage 'payload'
          New-Item -ItemType Directory -Path $payload|Out-Null
          $files=@(
            'PATCH-v0.51.9.md',
            'src/Matawaka.Workbench.App/App.xaml.cs',
            'src/Matawaka.Workbench.App/LocalAppMcpOwnerGenerationV0519Service.cs',
            'src/Matawaka.Workbench.App/LocalAppMcpSessionOwnershipV0517Service.cs',
            'src/Matawaka.Workbench.App/LocalCheckpointV0519Service.cs',
            'src/Matawaka.Workbench.App/MainWindow.V0519.Acceptance.cs',
            'src/Matawaka.Workbench.App/MainWindow.V0519.cs',
            'src/Matawaka.Workbench.App/WorkbenchV0519AcceptanceHarness.cs'
          )
          $items=@()
          foreach($file in $files){
            $src=Join-Path (Get-Location) ($file -replace '/', [IO.Path]::DirectorySeparatorChar)
            if(-not (Test-Path $src -PathType Leaf)){throw "missing v0.51.9 payload file: $file"}
            $dst=Join-Path $payload ($file -replace '/', [IO.Path]::DirectorySeparatorChar)
            New-Item -ItemType Directory -Path ([IO.Path]::GetDirectoryName($dst)) -Force|Out-Null
            Copy-Item $src $dst -Force
            $items += [ordered]@{Path=$file;Sha256=(Get-FileHash $src -Algorithm SHA256).Hash.ToLowerInvariant()}
          }
          $manifest=[ordered]@{
            Schema='matawaka.workbench-update-package/v0.10'
            PackageVersion='0.10'
            TargetVersion='0.51.9'
            PredecessorTag='workbench-v0.51.8-accepted'
            PredecessorCommit=$predecessor
            TargetTag='workbench-v0.51.9-accepted'
            PayloadRoot='payload/'
            Files=$items
            NetworkAccessRequested=$false
            CatalogMutationRequested=$false
            AgentExecuteRequested=$false
            ArbitraryProcessExecutionRequested=$false
            InstallerScriptExecutionRequested=$false
            NonEffects=@(
              'source only',
              'exact local v0.51.8 predecessor only',
              'prior MCP owner metadata evidence is preserved before successor generation metadata write',
              'generation evidence grants no lease/read/revoke/resume authority',
              'canonical v0.48 lease authority and v0.51.5 derived active index remain unchanged',
              'v0.51.8 ownership status/stale acknowledgement preserved',
              'no historical lease enumeration or canonical/index mutation by generation preservation',
              'no bearer plaintext/hash or endpoint path token in transition receipt/log/UI',
              'no private app bytes or runtime owner/lease/index/evidence state',
              'no automatic Secure MCP Tunnel or OpenAI bridge dependency',
              'no remote publication authority',
              'no CI workflow/qualification fixture files in payload'
            )
          }
          $manifest|ConvertTo-Json -Depth 8|Set-Content (Join-Path $stage 'workbench-update-manifest.json') -Encoding UTF8
          $zip=Join-Path $env:RUNNER_TEMP 'workbench-v0.51.9-mcp-owner-generation-continuity-update.zip'
          if(Test-Path $zip){Remove-Item $zip -Force}
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip -CompressionLevel Optimal
          $sha=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "zip=$zip" >> $env:GITHUB_OUTPUT
          "sha=$sha" >> $env:GITHUB_OUTPUT
          Write-Host "V0519_PACKAGE_PASS predecessor=$predecessor files=$($files.Count) sha256=$sha"

      - uses: actions/upload-artifact@v4
        with:
          name: workbench-v0.51.9-exact-local-update
          path: ${{ steps.pack.outputs.zip }}
          if-no-files-found: error
