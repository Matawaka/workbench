name: Stage v0.60.1 public-main rebind

on:
  push:
    branches:
      - staging/workbench-v0.60.1-public-main-rebind-v1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebind:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/workbench-v0.60.1-operator-acceptance-closure
          fetch-depth: 0

      - name: Guard exact convergence frontier
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $feature = 'feat/workbench-v0.60.1-operator-acceptance-closure'
          $expectedHead = '45a229f66c32fad36a773e2433f1d6d5e376cef8'
          $oldMain = '6541dc32182c970c8e1a6ade426a6cee7086511b'
          $newMain = 'ac083598711caa0c399cc0d2c385b980c083024a'
          $oldClosure = 'aa2bfa215d3cacca015d40cd8786706aff0a9f19'
          if ((git rev-parse HEAD).Trim() -ne $expectedHead) { throw 'feature head drifted before rebind' }
          $parents = (git show -s --format=%P HEAD).Trim()
          if ($parents -ne "$oldClosure $newMain") { throw "unexpected convergence parents: $parents" }
          $remote = 'https://github.com/Matawaka/workbench.git'
          $observedMain = (git ls-remote $remote refs/heads/main).Split("`t")[0]
          if ($observedMain -ne $newMain) { throw "public main drifted again: $observedMain" }
          if ((git rev-parse "$newMain^1").Trim() -ne $oldMain) { throw 'public #100 predecessor binding changed' }
          if (-not [string]::IsNullOrWhiteSpace((git status --porcelain=v1 --untracked-files=all) -join "`n")) { throw 'feature checkout not clean' }
          Write-Host "V0601_REBIND_FRONTIER_PASS head=$expectedHead public=$newMain"

      - name: Guard exact public number 100 bytes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $public = 'ac083598711caa0c399cc0d2c385b980c083024a'
          $bindings = [ordered]@{
            '.github/qualification/source-bound-model/Probe.csproj' = '7099afc63264a0bee684788fe50448a78272e616'
            '.github/qualification/source-bound-model/Program.cs' = '065e8d339acd4d8ee9766f8433e9f5de0c598902'
            '.github/qualification/source-bound-model/translation-fixture.json' = '3409b9f71c0f47f286fd191994857b8e3c862825'
            'KONTUR_INTEGRATION_BACKLOG.md' = '5035aaa63702678f54533bbf98abf2f565e51a10'
            'integrations/model-invocation/QUALIFICATION.md' = '606f186a6ecd960cceed18966f28f27472f6ff2f'
            'integrations/model-invocation/README.md' = 'b4823d0421ec663ad4bb82a49852d3022bedabc5'
            'integrations/model-invocation/source-binding.schema.json' = '13b2b78cea39a870546db79c1881bc271224e721'
            'src/Matawaka.Workbench.App/SourceBoundModelInvocation.cs' = '14d092d47e6a699405eededad6b577bd4bf8a4da'
          }
          foreach ($item in $bindings.GetEnumerator()) {
            $treeBlob = (git rev-parse "$public`:$($item.Key)").Trim()
            $workingBlob = (git hash-object -- $item.Key).Trim()
            if ($treeBlob -ne $item.Value -or $workingBlob -ne $item.Value) {
              throw "public #100 byte mismatch: $($item.Key) public=$treeBlob working=$workingBlob expected=$($item.Value)"
            }
          }
          Write-Host "V0601_PUBLIC100_BYTES_PASS paths=$($bindings.Count)"

      - name: Rebind fixed public evidence and qualification
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $oldMain = '6541dc32182c970c8e1a6ade426a6cee7086511b'
          $newMain = 'ac083598711caa0c399cc0d2c385b980c083024a'
          $oldToken = 'IMPORT-EXACT-PUBLIC-6541'
          $newToken = 'IMPORT-EXACT-PUBLIC-AC08'
          $shaPaths = @(
            'src/Matawaka.Workbench.App/V0601QualifiedSourceBindings.cs',
            'src/Matawaka.Workbench.App/PublicMainImportReceiptV0601.cs',
            'src/Matawaka.Workbench.App/LocalCheckpointV0601Service.cs',
            'tooling/v0601-public-main-import/Program.cs',
            '.github/qualification/v0601-checkpoint/Program.cs',
            '.github/workflows/workbench-v0601-operator-acceptance.yml'
          )
          $found = @(git grep -l $oldMain -- .)
          if (@(Compare-Object ($shaPaths | Sort-Object) ($found | Sort-Object)).Count -ne 0) {
            throw "old public SHA appears outside exact rebind set: found=$($found -join ',')"
          }
          foreach ($path in $shaPaths) {
            $text = Get-Content $path -Raw
            if (-not $text.Contains($oldMain)) { throw "old public SHA missing from expected rebind file: $path" }
            $text = $text.Replace($oldMain, $newMain)
            [IO.File]::WriteAllText((Resolve-Path $path), $text, [Text.UTF8Encoding]::new($false))
          }
          foreach ($path in @('tooling/v0601-public-main-import/Program.cs','.github/workflows/workbench-v0601-operator-acceptance.yml')) {
            $text = Get-Content $path -Raw
            if (-not $text.Contains($oldToken)) { throw "old confirmation token missing: $path" }
            $text = $text.Replace($oldToken, $newToken)
            [IO.File]::WriteAllText((Resolve-Path $path), $text, [Text.UTF8Encoding]::new($false))
          }

          $bindingsPath = 'src/Matawaka.Workbench.App/V0601QualifiedSourceBindings.cs'
          $bindingsText = Get-Content $bindingsPath -Raw
          if ($bindingsText.Contains('SourceBoundModelInvocation.cs"] = "14d092')) { throw 'public #100 source bindings already inserted unexpectedly' }
          $needle = '            ["src/Matawaka.Workbench.App/Assets/Branding/splash-v060.b64.004"] = "e2294e891885f68e40f5fe05e88fcd9751d0d0f7"'
          if (-not $bindingsText.Contains($needle)) { throw 'source-binding insertion marker missing' }
          $block = $needle + ",`r`n" +
            '            [".github/qualification/source-bound-model/Probe.csproj"] = "7099afc63264a0bee684788fe50448a78272e616",' + "`r`n" +
            '            [".github/qualification/source-bound-model/Program.cs"] = "065e8d339acd4d8ee9766f8433e9f5de0c598902",' + "`r`n" +
            '            [".github/qualification/source-bound-model/translation-fixture.json"] = "3409b9f71c0f47f286fd191994857b8e3c862825",' + "`r`n" +
            '            ["KONTUR_INTEGRATION_BACKLOG.md"] = "5035aaa63702678f54533bbf98abf2f565e51a10",' + "`r`n" +
            '            ["integrations/model-invocation/QUALIFICATION.md"] = "606f186a6ecd960cceed18966f28f27472f6ff2f",' + "`r`n" +
            '            ["integrations/model-invocation/README.md"] = "b4823d0421ec663ad4bb82a49852d3022bedabc5",' + "`r`n" +
            '            ["integrations/model-invocation/source-binding.schema.json"] = "13b2b78cea39a870546db79c1881bc271224e721",' + "`r`n" +
            '            ["src/Matawaka.Workbench.App/SourceBoundModelInvocation.cs"] = "14d092d47e6a699405eededad6b577bd4bf8a4da"'
          $bindingsText = $bindingsText.Replace($needle, $block)
          [IO.File]::WriteAllText((Resolve-Path $bindingsPath), $bindingsText, [Text.UTF8Encoding]::new($false))

          $workflowPath = '.github/workflows/workbench-v0601-operator-acceptance.yml'
          $workflow = Get-Content $workflowPath -Raw
          $allowNeedle = "            '.github/qualification/v0601-checkpoint/Program.cs',"
          if (-not $workflow.Contains($allowNeedle)) { throw 'workflow allowlist marker missing' }
          $allowBlock = $allowNeedle + "`r`n" +
            "            '.github/qualification/source-bound-model/Probe.csproj',`r`n" +
            "            '.github/qualification/source-bound-model/Program.cs',`r`n" +
            "            '.github/qualification/source-bound-model/translation-fixture.json',`r`n" +
            "            'KONTUR_INTEGRATION_BACKLOG.md',`r`n" +
            "            'integrations/model-invocation/QUALIFICATION.md',`r`n" +
            "            'integrations/model-invocation/README.md',`r`n" +
            "            'integrations/model-invocation/source-binding.schema.json',`r`n" +
            "            'src/Matawaka.Workbench.App/SourceBoundModelInvocation.cs',"
          $workflow = $workflow.Replace($allowNeedle, $allowBlock)

          $publishMarker = '      - name: Publish candidate and preserve neutral branding WPF smoke'
          if (-not $workflow.Contains($publishMarker)) { throw 'workflow publish marker missing' }
          $publicStep = @'
      - name: Guard and qualify public number 100 source-bound model layer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $public = 'ac083598711caa0c399cc0d2c385b980c083024a'
          $paths = @(
            '.github/qualification/source-bound-model/Probe.csproj',
            '.github/qualification/source-bound-model/Program.cs',
            '.github/qualification/source-bound-model/translation-fixture.json',
            'KONTUR_INTEGRATION_BACKLOG.md',
            'integrations/model-invocation/QUALIFICATION.md',
            'integrations/model-invocation/README.md',
            'integrations/model-invocation/source-binding.schema.json',
            'src/Matawaka.Workbench.App/SourceBoundModelInvocation.cs'
          )
          foreach ($path in $paths) {
            $expected = (git rev-parse "$public`:$path").Trim()
            $observed = (git hash-object -- $path).Trim()
            if ($expected -ne $observed) { throw "public #100 source drift: $path" }
          }
          dotnet run --project .\.github\qualification\source-bound-model\Probe.csproj -c Release
          Write-Host "V0601_PUBLIC100_MODEL_LAYER_PASS paths=$($paths.Count)"

'@
          $workflow = $workflow.Replace($publishMarker, $publicStep + $publishMarker)
          [IO.File]::WriteAllText((Resolve-Path $workflowPath), $workflow, [Text.UTF8Encoding]::new($false))

          if ((git grep -l $oldMain -- . | Measure-Object).Count -ne 0) { throw 'old public main SHA remains after rebind' }
          if ((git grep -l $oldToken -- . | Measure-Object).Count -ne 0) { throw 'old confirmation token remains after rebind' }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'git diff --check failed' }
          Write-Host 'V0601_EXACT_REBIND_EDIT_PASS'

      - name: Guard exact changed file set and fast-forward feature branch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = @(
            '.github/qualification/v0601-checkpoint/Program.cs',
            '.github/workflows/workbench-v0601-operator-acceptance.yml',
            'src/Matawaka.Workbench.App/LocalCheckpointV0601Service.cs',
            'src/Matawaka.Workbench.App/PublicMainImportReceiptV0601.cs',
            'src/Matawaka.Workbench.App/V0601QualifiedSourceBindings.cs',
            'tooling/v0601-public-main-import/Program.cs'
          ) | Sort-Object
          $actual = @(git status --porcelain=v1 --untracked-files=all | ForEach-Object { $_.Substring(3).Replace('\\','/') }) | Sort-Object
          if (@(Compare-Object $expected $actual).Count -ne 0) { throw "unexpected rebind delta: $($actual -join ',')" }
          git config user.name 'Matawaka v0.60.1 Rebind'
          git config user.email '319695216+Matawaka@users.noreply.github.com'
          git add -- $expected
          git commit -m 'Rebind v0.60.1 acceptance to public #100 frontier'
          $newHead = (git rev-parse HEAD).Trim()
          $remoteFeature = (git ls-remote origin refs/heads/feat/workbench-v0.60.1-operator-acceptance-closure).Split("`t")[0]
          if ($remoteFeature -ne '45a229f66c32fad36a773e2433f1d6d5e376cef8') { throw "feature branch drifted before push: $remoteFeature" }
          git push origin HEAD:refs/heads/feat/workbench-v0.60.1-operator-acceptance-closure
          if ($LASTEXITCODE -ne 0) { throw 'non-force feature push failed' }
          Write-Host "V0601_REBIND_PUSH_PASS newHead=$newHead force=false"
