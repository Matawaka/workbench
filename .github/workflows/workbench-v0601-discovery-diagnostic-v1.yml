name: Workbench v0601 no-push discovery diagnostic v1
on:
  push:
    branches: [tooling/workbench-v0.60.1-fixed-publication-v1]
    paths:
      - 'tooling/v0601-fixed-publication/discovery-diagnostic-v1/**'
      - '.github/workflows/workbench-v0601-discovery-diagnostic-v1.yml'
permissions:
  contents: read
jobs:
  windows-discovery:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 10.0.401
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Obtain exact MinGit for disposable fixture use
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP/discovery-MinGit.zip"
          Invoke-WebRequest 'https://github.com/git-for-windows/git/releases/download/v2.55.0.windows.4/MinGit-2.55.0.4-64-bit.zip' -OutFile $zip -TimeoutSec 120
          if ((Get-Item $zip).Length -ne 38792847 -or (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne '4e03f94c2ffbf70be337e005cee02661c732dbfc81031a078bda9299b9a7d644') { throw 'MINGIT_ARCHIVE_IDENTITY_MISMATCH' }
          Expand-Archive -LiteralPath $zip -DestinationPath "$env:RUNNER_TEMP/discovery-mingit"
      - name: Materialize no-push diagnostic and unchanged regression sources
        shell: pwsh
        run: |
          python tooling/v0601-fixed-publication/discovery-diagnostic-v1/prepare.py "$env:RUNNER_TEMP/discovery-source" "$env:RUNNER_TEMP/discovery-MinGit.zip"
          if ($LASTEXITCODE -ne 0) { throw 'DISCOVERY_MATERIALIZATION_FAILED' }
      - name: Negative authenticated discovery and bounded stream qualification
        shell: pwsh
        run: |
          $env:DIAGNOSTIC_TEST_GIT_ROOT = "$env:RUNNER_TEMP/discovery-mingit"
          $env:PATH = "$env:DIAGNOSTIC_TEST_GIT_ROOT/cmd;" + $env:PATH
          Set-Location "$env:RUNNER_TEMP/discovery-source"
          dotnet run --project DiagnosticTests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'DISCOVERY_DIAGNOSTIC_QUALIFICATION_FAILED' }
      - name: Preserve inherited source evidence recovery atomic guard and lost-response regression coverage
        shell: pwsh
        run: |
          $env:PATH = "$env:RUNNER_TEMP/discovery-mingit/cmd;" + $env:PATH
          Set-Location "$env:RUNNER_TEMP/discovery-source"
          foreach ($project in @('V2Tests.csproj', 'PublisherTests.csproj', 'NetworkTests.csproj')) {
            dotnet run --project $project -c Release
            if ($LASTEXITCODE -ne 0) { throw "INHERITED_REGRESSION_FAILED $project" }
          }
      - name: Build diagnostic only after all tests and reject arbitrary production arguments
        shell: pwsh
        run: |
          dotnet publish "$env:RUNNER_TEMP/discovery-source/Diagnostic.csproj" -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o "$env:RUNNER_TEMP/discovery-delivery"
          if ($LASTEXITCODE -ne 0) { throw 'DIAGNOSTIC_BUILD_FAILED' }
          @'
          import os,pathlib,subprocess
          exe=pathlib.Path(os.environ['RUNNER_TEMP'])/'discovery-delivery/Matawaka.Workbench.V0601ReceiveDiscoveryDiagnostic.exe'
          p=subprocess.run([str(exe),'--argument-probe'],capture_output=True,timeout=20)
          assert p.returncode==1 and b'ARGUMENTS_NOT_ACCEPTED' in p.stderr
          print('PRODUCTION_DIAGNOSTIC_ZERO_ARGUMENT_GUARD_PASS_NO_HOST_ACCESS')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'DIAGNOSTIC_CLI_GUARD_FAILED' }
      - name: Bind actual source reports executable and inherited pins
        shell: pwsh
        run: |
          @'
          import os,pathlib,hashlib,json,zipfile,shutil
          temp=pathlib.Path(os.environ['RUNNER_TEMP']);src=temp/'discovery-source';out=temp/'discovery-delivery'
          reports=['discovery-diagnostic-qualification.json','preflight-qualification.json','evidence-qualification.json','promisor-v2-qualification.json','publisher-qualification.json','publisher-https-qualification.json']
          for name in reports:
              value=json.loads((src/name).read_text(encoding='utf-8-sig'));assert value['Passed'] and all(x['Passed'] for x in value['Checks'])
              shutil.copyfile(src/name,out/name)
          for name in ['diagnostic-materialization.json','publisher-materialization.json','mingit-files.json']:
              shutil.copyfile(src/name,out/name)
          with zipfile.ZipFile(out/'qualified-source.zip','w',zipfile.ZIP_DEFLATED) as z:
              for p in sorted(src.iterdir()):
                  if p.is_file() and p.suffix in ('.cs','.csproj','.json'):z.write(p,p.name)
          project=(src/'Diagnostic.csproj').read_text();assert '<Compile Include="Publisher.cs"' not in project and '<DefineConstants>QUALIFICATION' not in project
          files=[{'Path':p.name,'Bytes':p.stat().st_size,'Sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in sorted(out.iterdir()) if p.is_file()]
          manifest={'Schema':'matawaka.receive-discovery-diagnostic-delivery/v0.1','SourceSha':os.environ['GITHUB_SHA'],'RunId':os.environ['GITHUB_RUN_ID'],'OperatorHostAccessed':False,'ProductionGitHubContacted':False,'ProductionPushImplemented':False,'PriorAttemptRearmed':False,'Files':files}
          (out/'manifest.json').write_text(json.dumps(manifest,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(manifest,indent=2))
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'DIAGNOSTIC_DELIVERY_BINDING_FAILED' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: workbench-v0601-receive-discovery-diagnostic-v1-win-x64
          path: ${{ runner.temp }}/discovery-delivery/*
          retention-days: 30
          if-no-files-found: error
